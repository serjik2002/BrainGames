<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Фіджет-спінер - Brain Games</title>
    <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        /* Базові змінні кольорів та розмірів (Brain Games Standard) */
        :root {
            --bg-color: #F8F9FA;
            --text-color: #1C2331;
            --text-muted: #7A8294;
            --board-bg: #FFFFFF;
            --shadow-color: rgba(0, 0, 0, 0.08);

            --color-yellow: #FFD166;
            --color-green: #06D6A0;
            --color-blue: #118AB2;
            --color-pink: #EF476F;
            --color-purple: #D7D0F1;

            --btn-bg: #FFFFFF;
            --btn-shadow: rgba(0, 0, 0, 0.1);
            --icon-color: rgba(0, 0, 0, 0.15);

            --bearing-1: #ffffff;
            --bearing-2: #cfd4dc;
            --bearing-3: #9aa1ad;
            --bearing-4: #5b616c;
            --cap-1: #3a3d44;
            --cap-2: #16171b;

            --margin: 16px;
            --gap: 12px;
            --header-h: 64px;
            --board-size: 320px;
            --btn-size: 44px;
            --icon-size: 22px;
            --title-size: 22px;
        }

        [data-theme="dark"] {
            --bg-color: #121826;
            --text-color: #E2E8F0;
            --text-muted: #94A3B8;
            --board-bg: #1E293B;
            --shadow-color: rgba(0, 0, 0, 0.3);

            --color-yellow: #D9B35A;
            --color-green: #05A87E;
            --color-blue: #0E6B8A;
            --color-pink: #BF3959;
            --color-purple: #B2ABC9;

            --btn-bg: #2B3548;
            --btn-shadow: rgba(0, 0, 0, 0.4);
            --icon-color: rgba(255, 255, 255, 0.15);

            --bearing-1: #9aa1ad;
            --bearing-2: #6b707a;
            --bearing-3: #4a4e57;
            --bearing-4: #2a2c32;
            --cap-1: #1a1b1f;
            --cap-2: #050506;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body { width: 100%; height: 100%; }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            touch-action: none;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .app-container {
            position: fixed;
            inset: 0;
            padding-top: calc(var(--margin) + env(safe-area-inset-top, 0px));
            padding-bottom: calc(var(--margin) + env(safe-area-inset-bottom, 0px));
            padding-left: calc(var(--margin) + env(safe-area-inset-left, 0px));
            padding-right: calc(var(--margin) + env(safe-area-inset-right, 0px));
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--gap);
        }

        /* ── Header ── */
        .header {
            width: 100%;
            max-width: calc(var(--board-size) + 2px);
            height: var(--header-h);
            flex: 0 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            position: relative;
        }

        .back-btn {
            width: var(--btn-size); height: var(--btn-size); min-width: var(--btn-size);
            border-radius: 50%; background: var(--btn-bg);
            box-shadow: 0 4px 12px var(--btn-shadow);
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; border: none; outline: none; color: var(--text-color);
            transition: transform 0.1s, background 0.3s;
        }
        .back-btn:active { transform: scale(0.9); }
        .back-btn svg { width: var(--icon-size); height: var(--icon-size); }

        .header-title {
            position: absolute; left: 50%; transform: translateX(-50%);
            max-width: calc(100% - var(--btn-size) * 2 - 40px);
            font-size: var(--title-size); font-weight: 800; letter-spacing: 1px;
            line-height: 1; color: var(--text-color);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none;
        }

        .header-right { display: flex; align-items: center; gap: 6px; }

        .theme-toggle {
            width: var(--btn-size); height: var(--btn-size); min-width: var(--btn-size);
            border-radius: 50%; background: var(--btn-bg);
            box-shadow: 0 4px 12px var(--btn-shadow);
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; border: none; outline: none; color: var(--text-color);
            transition: transform 0.1s, background 0.3s;
        }
        .theme-toggle:active { transform: scale(0.9); }
        .theme-toggle svg { width: var(--icon-size); height: var(--icon-size); color: var(--text-color); }

        /* Board */
        .board-bg {
            background-color: var(--board-bg);
            border-radius: 30px;
            padding: 10px;
            box-shadow: 0 10px 30px var(--shadow-color);
            width: var(--board-size);
            height: var(--board-size);
            flex: 0 0 auto;
            position: relative;
            transition: background-color 0.3s ease, box-shadow 0.3s ease;
        }

        .board {
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.03);
            border-radius: 20px;
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            overflow: hidden;
            touch-action: none;
        }

        [data-theme="dark"] .board {
            background: rgba(255, 255, 255, 0.03);
        }

        /* Спінер */
        .spinner-stage {
            width: 85%;
            height: 85%;
            cursor: grab;
            filter: drop-shadow(0 15px 20px rgba(0,0,0,0.15));
        }
        
        .spinner-stage.grabbing {
            cursor: grabbing;
        }

        #spinnerArms {
            will-change: transform;
        }

        .hint-text {
            position: absolute;
            bottom: 15px;
            font-size: 14px;
            color: var(--text-muted);
            font-weight: 700;
            text-align: center;
            pointer-events: none;
            transition: opacity 0.4s ease;
        }

        /* Нижня панель статистики */
        .stats-row {
            display: flex;
            justify-content: center;
            gap: 15px;
            width: 100%;
        }

        .stat-pill {
            background-color: var(--btn-bg);
            padding: 12px 20px;
            border-radius: 20px;
            box-shadow: 0 4px 0 var(--btn-shadow);
            display: flex;
            align-items: center;
            gap: 8px;
            font-weight: 800;
            font-size: 16px;
            color: var(--text-color);
            transition: all 0.2s ease;
        }

        .stat-pill svg {
            width: 20px;
            height: 20px;
        }

        /* Модальне вікно */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: var(--board-bg);
            padding: 40px 30px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 20px 40px var(--shadow-color);
            transform: translateY(20px);
            transition: transform 0.3s ease;
            width: 90%;
            max-width: 340px;
            color: var(--text-color);
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-content h2 {
            font-size: 28px;
            margin: 0 0 10px 0;
            color: var(--color-green);
            font-weight: 800;
        }

        .modal-content p {
            color: var(--text-muted);
            margin: 0 0 25px 0;
            font-size: 16px;
            font-weight: 700;
        }

        .modal-btn {
            background-color: var(--color-green);
            color: white;
            border: none;
            padding: 15px 30px;
            border-radius: 20px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 6px 0 rgba(0, 0, 0, 0.15);
            transition: transform 0.1s ease, box-shadow 0.1s ease;
        }

        .modal-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 rgba(0, 0, 0, 0.15);
        }

        .sun-icon { display: block; }
        .moon-icon { display: none; }
        [data-theme="dark"] .sun-icon { display: none; }
        [data-theme="dark"] .moon-icon { display: block; }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <button class="back-btn" onclick="goBack()" title="Back">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <span class="header-title">Фіджет-спінер</span>
            <div class="header-right">
                <!-- <div class="score-container" title="Рекорд часу">
                    <svg viewBox="0 0 24 24"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>
                    <span id="recordVal">—</span>
                </div> -->
                <button class="theme-toggle" id="themeBtn" title="Change theme">
                    <svg id="sunIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                    <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
            </div>
        </div>

        <!-- Ігрове поле -->
        <div class="board-bg">
            <div class="board" id="spinnerBoard">
                <svg class="spinner-stage" id="spinnerStage" viewBox="0 0 200 200">
                    <defs>
                        <!-- Градієнти перенесені з оригінального коду -->
                        <linearGradient id="bodyGrad" gradientUnits="userSpaceOnUse" x1="140" y1="20" x2="60" y2="180">
                            <stop offset="0%" stop-color="#FF3FC2"/>
                            <stop offset="22%" stop-color="#C24CE0"/>
                            <stop offset="50%" stop-color="#3D8FF5"/>
                            <stop offset="65%" stop-color="#2FC6D8"/>
                            <stop offset="80%" stop-color="#6BD65C"/>
                            <stop offset="100%" stop-color="#D9E84A"/>
                        </linearGradient>
                        <radialGradient id="ballShine" cx="35%" cy="30%" r="65%">
                            <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9"/>
                            <stop offset="45%" stop-color="#ffffff" stop-opacity="0.25"/>
                            <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
                        </radialGradient>
                        <radialGradient id="bearingGrad" cx="35%" cy="30%" r="75%">
                            <stop offset="0%" stop-color="#F2F3F5"/>
                            <stop offset="50%" stop-color="#C9CCD2"/>
                            <stop offset="100%" stop-color="#8E929B"/>
                        </radialGradient>
                        <radialGradient id="capGrad" cx="50%" cy="50%" r="50%">
                            <stop offset="0%" stop-color="#2B2C30"/>
                            <stop offset="100%" stop-color="#040405"/>
                        </radialGradient>
                    </defs>

                    <!-- Статична контактна тінь -->
                    <ellipse cx="100" cy="185" rx="55" ry="8" fill="rgba(0,0,0,0.15)"/>

                    <g id="spinnerArms">
                        <circle cx="100" cy="42" r="40" fill="url(#bodyGrad)"/>
                        <circle cx="150" cy="129" r="40" fill="url(#bodyGrad)"/>
                        <circle cx="50" cy="129" r="40" fill="url(#bodyGrad)"/>
                        <circle cx="100" cy="100" r="42" fill="url(#bodyGrad)"/>

                        <g transform="rotate(0 100 100)">
                            <circle cx="100" cy="42" r="22" fill="url(#bearingGrad)"/>
                            <circle cx="100" cy="42" r="18" fill="url(#capGrad)"/>
                            <circle cx="100" cy="42" r="18" fill="url(#ballShine)"/>
                        </g>
                        <g transform="rotate(120 100 100)">
                            <circle cx="100" cy="42" r="22" fill="url(#bearingGrad)"/>
                            <circle cx="100" cy="42" r="18" fill="url(#capGrad)"/>
                            <circle cx="100" cy="42" r="18" fill="url(#ballShine)"/>
                        </g>
                        <g transform="rotate(240 100 100)">
                            <circle cx="100" cy="42" r="22" fill="url(#bearingGrad)"/>
                            <circle cx="100" cy="42" r="18" fill="url(#capGrad)"/>
                            <circle cx="100" cy="42" r="18" fill="url(#ballShine)"/>
                        </g>

                        <!-- Центральний ковпачок -->
                        <circle cx="100" cy="100" r="25" fill="url(#bearingGrad)"/>
                        <circle cx="100" cy="100" r="20" fill="url(#capGrad)"/>
                        <circle cx="100" cy="100" r="20" fill="url(#ballShine)"/>
                    </g>
                </svg>
                <div class="hint-text" id="hintText">Покрути пальцем і відпусти 👆</div>
            </div>
        </div>

        <!-- Статистика -->
        <div class="stats-row">
            <div class="stat-pill" style="color: var(--text-muted);">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l3 2"/><path d="M9 2h6M12 2v3" stroke-linecap="round"/></svg>
                <span id="timeVal" style="color: var(--text-color);">0.0</span> с
            </div>
            <div class="stat-pill" style="color: var(--color-green);">
                <svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L3 14h7l-1 8 11-13h-7l1-7z"/></svg>
                <span id="rpmVal" style="color: var(--text-color);">0</span> об/хв
            </div>
        </div>

    </div>

    <!-- Модальне вікно рекорду -->
    <div class="modal-overlay" id="recordModal">
        <div class="modal-content">
            <h2>НОВИЙ РЕКОРД!</h2>
            <p id="recordModalText">Спінер крутився 0.0 секунд!</p>
            <button class="modal-btn" onclick="closeModal()">Чудово!</button>
        </div>
    </div>

    <script>
        function showInterstitialAd() {
            let payload = { action: "showInterstitial" };
            Unity.call(JSON.stringify(payload));
        }

        function showRewardedAd() {
            let payload = { action: "showRewarded" };
            Unity.call(JSON.stringify(payload));
        }

        function closeGame() {
            let payload = { action: "close" };
            Unity.call(JSON.stringify(payload));
        }

        function goBack() {
            closeGame();
        }

        // ── Adaptive Layout ──
        let safeInsetsCache = { top: 0, bottom: 0, left: 0, right: 0 };
        (function measureSafeInsets() {
            const probe = document.createElement('div');
            probe.style.cssText = 'position:fixed;top:0;left:0;width:0;height:0;' +
                'padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);' +
                'padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);visibility:hidden;';
            document.body.appendChild(probe);
            const cs = getComputedStyle(probe);
            safeInsetsCache = {
                top: parseFloat(cs.paddingTop) || 0, bottom: parseFloat(cs.paddingBottom) || 0,
                left: parseFloat(cs.paddingLeft) || 0, right: parseFloat(cs.paddingRight) || 0
            };
            probe.remove();
        })();

        function applyLayout() {
            const insets = safeInsetsCache;
            const availW = window.innerWidth - insets.left - insets.right;
            const availH = window.innerHeight - insets.top - insets.bottom;
            const margin = Math.round(availH * 0.025);
            const gap = Math.round(availH * 0.018);
            const headerH = Math.round(Math.min(Math.max(availH * 0.075, availH * 0.05), availH * 0.10));
            const usableH = availH - margin * 2 - headerH - gap;
            const usableW = availW - margin * 2;
            const boardSize = Math.max(180, Math.floor(Math.min(usableH, usableW)));

            const root = document.documentElement;
            root.style.setProperty('--margin', margin + 'px');
            root.style.setProperty('--gap', gap + 'px');
            root.style.setProperty('--header-h', headerH + 'px');
            root.style.setProperty('--board-size', boardSize + 'px');
            root.style.setProperty('--btn-size', Math.round(headerH * 0.68) + 'px');
            root.style.setProperty('--icon-size', Math.round(headerH * 0.36) + 'px');
            root.style.setProperty('--title-size', Math.round(headerH * 0.34) + 'px');
        }
        applyLayout();
        window.addEventListener('resize', applyLayout);

        // ── Theme ──
        const themeBtn = document.getElementById('themeBtn');
        const sunIcon = document.getElementById('sunIcon');
        const moonIcon = document.getElementById('moonIcon');
        let isDark = localStorage.getItem('brainGamesTheme') === 'dark';

        function updateTheme() {
            document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
            sunIcon.style.display = isDark ? 'block' : 'none';
            moonIcon.style.display = isDark ? 'none' : 'block';
            localStorage.setItem('brainGamesTheme', isDark ? 'dark' : 'light');
        }
        updateTheme();

        themeBtn.addEventListener('click', () => {
            isDark = !isDark;
            updateTheme();
        });

        // --- АУДІО ДВИЖОК ---
        let audioCtx, whirrOsc, whirrGain, whirrFilter;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();

                whirrOsc = audioCtx.createOscillator();
                whirrOsc.type = 'sawtooth';
                whirrOsc.frequency.value = 70;

                whirrFilter = audioCtx.createBiquadFilter();
                whirrFilter.type = 'lowpass';
                whirrFilter.frequency.value = 1800;

                whirrGain = audioCtx.createGain();
                whirrGain.gain.value = 0;

                whirrOsc.connect(whirrFilter);
                whirrFilter.connect(whirrGain);
                whirrGain.connect(audioCtx.destination);
                whirrOsc.start();
            }
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function updateWhirrSound(speed) {
            if (!audioCtx) return;
            const targetFreq = 70 + speed * 6;
            const targetGain = Math.min(0.13, (speed / 60) * 0.13);
            whirrFilter.frequency.setTargetAtTime(900 + speed * 14, audioCtx.currentTime, 0.05);
            whirrOsc.frequency.setTargetAtTime(targetFreq, audioCtx.currentTime, 0.05);
            whirrGain.gain.setTargetAtTime(targetGain, audioCtx.currentTime, 0.08);
        }

        function playClick() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.connect(g); g.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(500, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(220, audioCtx.currentTime + 0.08);
            g.gain.setValueAtTime(0.12, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.08);
            osc.start(); osc.stop(audioCtx.currentTime + 0.08);
        }

        function playRecordFanfare() {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.connect(g); g.connect(audioCtx.destination);
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, audioCtx.currentTime);
            osc.frequency.setValueAtTime(600, audioCtx.currentTime + 0.1);
            osc.frequency.setValueAtTime(800, audioCtx.currentTime + 0.2);
            osc.frequency.setValueAtTime(1200, audioCtx.currentTime + 0.3);
            g.gain.setValueAtTime(0.2, audioCtx.currentTime);
            g.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.8);
            osc.start(); osc.stop(audioCtx.currentTime + 0.8);
        }

        // --- ФІЗИКА ОБЕРТАННЯ ---
        const COULOMB = 0.4;     
        const VISCOUS = 0.04;    
        const STOP_EPS = 0.03;   
        const VEL_BOOST = 1.6;   
        const MAX_AV = 90;       
        const MIN_START_AV = 1.0; 

        let angle = 0;            
        let angularVelocity = 0;  
        let isDragging = false;
        let spinActive = false;
        let spinStartPerf = 0;
        let recordTime = parseFloat(localStorage.getItem('fidget_spinner_record') || '0');

        let dragCenter = { x: 0, y: 0 };
        let dragSamples = [];
        let lastDragAngle = 0;
        let liveAv = 0;
        let lastMoveTime = 0;

        const spinnerArms = document.getElementById('spinnerArms');
        const spinnerStage = document.getElementById('spinnerStage');
        const spinnerBoard = document.getElementById('spinnerBoard');
        const hintText = document.getElementById('hintText');
        const timeVal = document.getElementById('timeVal');
        const rpmVal = document.getElementById('rpmVal');
        const recordVal = document.getElementById('recordVal');
        const recordModal = document.getElementById('recordModal');
        const recordModalText = document.getElementById('recordModalText');

        if (recordTime > 0) recordVal.textContent = recordTime.toFixed(1) + ' с';

        function getAngleFromEvent(e) {
            // Центр розраховується відносно стабільного board (щоб не було "воблу")
            const dx = e.clientX - dragCenter.x;
            const dy = e.clientY - dragCenter.y;
            return Math.atan2(dy, dx);
        }

        spinnerStage.addEventListener('pointerdown', (e) => {
            initAudio();
            playClick();
            
            const rect = spinnerBoard.getBoundingClientRect();
            dragCenter.x = rect.left + rect.width / 2;
            dragCenter.y = rect.top + rect.height / 2;

            isDragging = true;
            angularVelocity = 0;
            spinActive = false;
            liveAv = 0;
            lastDragAngle = getAngleFromEvent(e);
            lastMoveTime = performance.now();
            dragSamples = [{ t: lastMoveTime, angle: angle }];
            
            spinnerStage.classList.add('grabbing');
            spinnerStage.setPointerCapture(e.pointerId);
            hintText.style.opacity = '0';
        });

        spinnerStage.addEventListener('pointermove', (e) => {
            if (!isDragging) return;
            const now = performance.now();
            const newPointerAngle = getAngleFromEvent(e);
            let delta = newPointerAngle - lastDragAngle;
            
            if (delta > Math.PI) delta -= 2 * Math.PI;
            if (delta < -Math.PI) delta += 2 * Math.PI;

            angle += delta;

            const dtMove = (now - lastMoveTime) / 1000;
            if (dtMove > 0.001) liveAv = delta / dtMove;

            lastDragAngle = newPointerAngle;
            lastMoveTime = now;

            dragSamples.push({ t: now, angle });
            while (dragSamples.length > 2 && now - dragSamples[0].t > 150) dragSamples.shift();
        });

        function endDrag(e) {
            if (!isDragging) return;
            isDragging = false;
            spinnerStage.classList.remove('grabbing');
            const now = performance.now();

            let av = 0;
            if (dragSamples.length >= 2) {
                const first = dragSamples[0];
                const last = dragSamples[dragSamples.length - 1];
                const dt = (last.t - first.t) / 1000;
                if (dt > 0.005) av = (last.angle - first.angle) / dt;
            }
            av *= VEL_BOOST;
            av = Math.max(-MAX_AV, Math.min(MAX_AV, av));

            if (Math.abs(av) >= MIN_START_AV) {
                angularVelocity = av;
                spinActive = true;
                spinStartPerf = now;
                timeVal.textContent = '0.0';
            } else {
                angularVelocity = 0;
            }
            liveAv = 0;
        }

        spinnerStage.addEventListener('pointerup', endDrag);
        spinnerStage.addEventListener('pointercancel', endDrag);

        function finishSpin() {
            spinActive = false;
            const elapsed = (performance.now() - spinStartPerf) / 1000;
            timeVal.textContent = elapsed.toFixed(1);

            if (elapsed > recordTime + 0.05) {
                recordTime = elapsed;
                localStorage.setItem('fidget_spinner_record', recordTime.toFixed(1));
                recordVal.textContent = recordTime.toFixed(1) + ' с';
                celebrateRecord(elapsed);
            }
        }

        function celebrateRecord(elapsed) {
            playRecordFanfare();
            const duration = 1200;
            const end = Date.now() + duration;
            (function frame() {
                confetti({
                    particleCount: 4, angle: 60, spread: 55, origin: { x: 0 },
                    colors: ['#06D6A0', '#118AB2', '#FFD166', '#EF476F']
                });
                confetti({
                    particleCount: 4, angle: 120, spread: 55, origin: { x: 1 },
                    colors: ['#06D6A0', '#118AB2', '#FFD166', '#EF476F']
                });
                if (Date.now() < end) requestAnimationFrame(frame);
                else {
                    showInterstitialAd();
                    recordModalText.textContent = `Спінер крутився ${elapsed.toFixed(1)} секунд!`;
                    recordModal.classList.add('active');
                }
            }());
        }

        // Робимо функцію глобальною для виклику з HTML
        window.closeModal = function() {
            recordModal.classList.remove('active');
        };

        // --- ОСНОВНИЙ ЦИКЛ АНІМАЦІЇ ---
        let lastFrameTime = performance.now();

        function loop(now) {
            let dt = (now - lastFrameTime) / 1000;
            lastFrameTime = now;
            if (dt > 0.05) dt = 0.05; 

            if (!isDragging && angularVelocity !== 0) {
                const dir = Math.sign(angularVelocity);
                const decel = (COULOMB + VISCOUS * Math.abs(angularVelocity)) * dir;
                let newAv = angularVelocity - decel * dt;

                if (Math.sign(newAv) !== dir || Math.abs(newAv) < STOP_EPS) newAv = 0;

                angularVelocity = newAv;
                angle += angularVelocity * dt;

                if (angularVelocity === 0 && spinActive) finishSpin();
            }

            updateVisuals();
            requestAnimationFrame(loop);
        }

        function updateVisuals() {
            const deg = (angle * 180 / Math.PI) % 360;
            spinnerArms.setAttribute('transform', `rotate(${deg} 100 100)`);

            const speed = isDragging ? Math.abs(liveAv) : Math.abs(angularVelocity);
            const clampedSpeed = Math.min(MAX_AV, speed);

            rpmVal.textContent = Math.round(clampedSpeed * 9.5493);

            if (spinActive) {
                const elapsed = (performance.now() - spinStartPerf) / 1000;
                timeVal.textContent = elapsed.toFixed(1);
            }

            updateWhirrSound(clampedSpeed);
        }

        requestAnimationFrame(loop);

    </script>
</body>
</html>
