<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rubik's Cube - Brain Games</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <style>
        :root {
            --bg-color: #F8F9FA;
            --text-color: #1C2331;
            --text-secondary: #7A8294;
            --board-bg: #E2E8F0;
            --btn-bg: #FFFFFF;
            --btn-shadow: rgba(0, 0, 0, 0.05);
            --primary: #06D6A0;

            --cube-white: #ffffff;
            --cube-yellow: #ffec99;
            --cube-red: #ff8787;
            --cube-orange: #ffc078;
            --cube-green: #69db7c;
            --cube-blue: #74c0fc;
            --cube-inner: #1a1a1a;

            --margin: clamp(8px, 2.5vh, 24px);
            --gap: clamp(4px, 1.8vh, 16px);
            --header-h: clamp(32px, 7.5vh, 64px);
            --score-row-h: clamp(44px, 9vh, 64px);
            --bottom-row-h: clamp(36px, 7vh, 48px);

            --btn-size: calc(var(--header-h) * 0.68);
            --icon-size: calc(var(--header-h) * 0.36);
            --title-size: calc(var(--header-h) * 0.34);
        }

        @supports (height: 100dvh) {
            :root {
                --margin: clamp(8px, 2.5dvh, 24px);
                --gap: clamp(4px, 1.8dvh, 16px);
                --header-h: clamp(32px, 7.5dvh, 64px);
                --score-row-h: clamp(44px, 9dvh, 64px);
                --bottom-row-h: clamp(36px, 7dvh, 48px);
            }
        }

        @media (orientation: landscape) {
            :root {
                --margin: clamp(12px, 3.5vh, 32px);
                --gap: clamp(6px, 3vh, 20px);
                --header-h: clamp(40px, 12vh, 80px);
                --score-row-h: clamp(36px, 8vh, 48px);
                --bottom-row-h: clamp(28px, 6vh, 40px);
            }
        }

        @media (orientation: landscape) {
            @supports (height: 100dvh) {
                :root {
                    --margin: clamp(12px, 3.5dvh, 32px);
                    --gap: clamp(6px, 3dvh, 20px);
                    --header-h: clamp(40px, 12dvh, 80px);
                    --score-row-h: clamp(36px, 8dvh, 48px);
                    --bottom-row-h: clamp(28px, 6dvh, 40px);
                }
            }
        }

        [data-theme="dark"] {
            --bg-color: #1A1A24;
            --text-color: #F8F9FA;
            --text-secondary: #A0AABF;
            --board-bg: #2A2A38;
            --btn-bg: #2A2A38;
            --btn-shadow: rgba(0, 0, 0, 0.2);
            --primary: #059669;
            --cube-white: #e2e8f0;
            --cube-yellow: #d8c67c;
            --cube-red: #d96c6c;
            --cube-orange: #d69e63;
            --cube-green: #54b264;
            --cube-blue: #5b9ccf;
            --cube-inner: #0f172a;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; -webkit-tap-highlight-color: transparent; }
        html, body { width: 100%; height: 100%; }

        body {
            font-family: 'Nunito', 'Segoe UI', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        .app-container {
            height: 100vh; height: 100dvh;
            padding: calc(var(--margin) + env(safe-area-inset-top, 0px))
                     calc(var(--margin) + env(safe-area-inset-right, 0px))
                     calc(var(--margin) + env(safe-area-inset-bottom, 0px))
                     calc(var(--margin) + env(safe-area-inset-left, 0px));
            display: flex; flex-direction: column; align-items: stretch;
            gap: var(--gap);
        }

        .header {
            width: 100%; height: var(--header-h); flex: 0 0 auto;
            display: flex; justify-content: space-between; align-items: center;
            position: relative;
        }

        .back-btn, .theme-toggle {
            width: var(--btn-size); height: var(--btn-size); min-width: var(--btn-size);
            border-radius: 50%; background-color: var(--btn-bg);
            box-shadow: 0 4px 12px var(--btn-shadow);
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; border: none; outline: none; color: var(--text-color);
            transition: transform 0.1s, background-color 0.3s;
        }
        .back-btn:active, .theme-toggle:active { transform: scale(0.9); }
        .back-btn svg, .theme-toggle svg { width: var(--icon-size); height: var(--icon-size); }

        .header-title {
            position: absolute; left: 50%; transform: translateX(-50%);
            font-size: var(--title-size); font-weight: 900; letter-spacing: 2px;
            color: var(--text-color); white-space: nowrap; pointer-events: none;
        }

        .header-right { display: flex; align-items: center; gap: 6px; }

        /* Обёртка поле + плашки + кнопка */
        .board-col {
            --avail-h: calc(100vh - var(--header-h) - var(--score-row-h) - var(--bottom-row-h)
                - var(--gap) - var(--gap) - var(--gap) - 2 * var(--margin)
                - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
            --max-w: calc(100vw - 2 * var(--margin)
                - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
            --board-size: min(var(--max-w), var(--avail-h));
            display: flex; flex-direction: column; align-items: center;
            gap: calc(var(--board-size) * 0.0256);
            align-self: center;
            flex: 1 1 auto; justify-content: center;
        }

        @supports (height: 100dvh) {
            .board-col {
                --avail-h: calc(100dvh - var(--header-h) - var(--score-row-h) - var(--bottom-row-h)
                    - var(--gap) - var(--gap) - var(--gap) - 2 * var(--margin)
                    - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
                --max-w: calc(100dvw - 2 * var(--margin)
                    - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
            }
        }

        /* Плашки TIME / MOVES / BEST */
        .score-row {
            width: 100%; display: flex;
            gap: calc(var(--board-size) * 0.0256);
        }

        .score-box {
            flex: 1 1 33.333%;
            background-color: var(--board-bg);
            border-radius: calc(var(--board-size) * 0.02);
            padding: 0 clamp(4px, 1vw, 10px);
            height: calc(var(--board-size) * 0.15);
            display: flex; flex-direction: column; justify-content: center;
            text-align: center;
            box-shadow: 0 4px 12px var(--btn-shadow);
            transition: background-color 0.3s;
        }

        .score-label {
            display: block;
            font-size: clamp(7px, calc(var(--board-size) * 0.028), 11px);
            font-weight: 700; letter-spacing: 1px;
            color: var(--text-secondary); text-transform: uppercase;
        }

        .score-value {
            display: block;
            font-size: clamp(10px, calc(var(--board-size) * 0.045), 18px);
            font-weight: 600; color: var(--text-color); line-height: 1;
        }

        /* Поле */
        .board-bg {
            width: var(--board-size); aspect-ratio: 1 / 1;
            flex: 0 0 auto; container-type: size;
            background: var(--board-bg); border-radius: 2cqw;
            padding: 2cqw;
            box-shadow: 0 8px 24px var(--btn-shadow);
        }

        .board {
            width: 100%; height: 100%; overflow: hidden;
            position: relative; touch-action: none;
        }
        .board canvas { display: block; width: 100%; height: 100%; }

        /* Кнопка Shuffle */
        .bottom-row { display: flex; align-self: flex-start; }

        .shuffle-btn {
            width: calc(var(--board-size) * 0.1);
            height: calc(var(--board-size) * 0.1);
            border-radius: calc(var(--board-size) * 0.02);
            background: var(--primary);
            color: white;
            box-shadow: 0 4px 12px var(--btn-shadow);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: none; outline: none;
            transition: transform 0.1s;
        }
        .shuffle-btn:active { transform: scale(0.9); }
        .shuffle-btn svg {
            width: calc(var(--board-size) * 0.05);
            height: calc(var(--board-size) * 0.05);
        }

        /* Модалка */
        .modal-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 100;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-content {
            background: var(--bg-color);
            padding: calc(var(--board-size) * 0.07);
            border-radius: calc(var(--board-size) * 0.04);
            text-align: center;
            transform: translateY(50px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2); max-width: 90%;
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }

        .modal-content h2 { font-size: calc(var(--board-size) * 0.07); margin-bottom: 8px; color: var(--text-color); }
        .modal-content p { color: var(--text-secondary); margin-bottom: 20px; font-size: calc(var(--board-size) * 0.04); }

        .play-btn {
            background: var(--primary); color: white; border: none;
            padding: calc(var(--board-size) * 0.04) calc(var(--board-size) * 0.08);
            font-size: calc(var(--board-size) * 0.042); font-weight: 700;
            font-family: inherit; border-radius: calc(var(--board-size) * 0.04);
            cursor: pointer; width: 100%; transition: transform 0.1s;
        }
        .play-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <button class="back-btn" onclick="goBack()" title="Back">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <span class="header-title">Rubik's Cube</span>
        <div class="header-right">
            <button class="theme-toggle" id="themeBtn" title="Change theme">
                <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                <svg id="sunIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </button>
        </div>
    </div>

    <div class="board-col">

        <div class="score-row">
            <div class="score-box">
                <span class="score-label">TIME</span>
                <span class="score-value" id="timeDisplay">00:00</span>
            </div>
            <div class="score-box">
                <span class="score-label">MOVES</span>
                <span class="score-value" id="movesDisplay">0</span>
            </div>
            <div class="score-box">
                <span class="score-label">BEST</span>
                <span class="score-value" id="bestDisplay">-</span>
            </div>
        </div>

        <div class="board-bg">
            <div class="board" id="board"></div>
        </div>

        <div class="bottom-row">
            <button class="shuffle-btn" id="shuffleBtn" title="Shuffle">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M 20.3 13.43 a 1 1 0 0 0 -1.25 0.65 A 7.14 7.14 0 0 1 12.18 19 A 7.1 7.1 0 0 1 5 12 a 7.1 7.1 0 0 1 7.18 -7 a 7.26 7.26 0 0 1 4.65 1.67 l -2.17 -0.36 a 1 1 0 0 0 -1.15 0.83 a 1 1 0 0 0 0.83 1.15 l 4.24 0.7 h 0.17 a 1 1 0 0 0 0.34 -0.06 a 0.33 0.33 0 0 0 0.1 -0.06 a 0.78 0.78 0 0 0 0.2 -0.11 l 0.09 -0.11 c 0 -0.05 0.09 -0.09 0.13 -0.15 s 0 -0.1 0.05 -0.14 a 1.34 1.34 0 0 0 0.07 -0.18 l 0.75 -4 a 1 1 0 0 0 -2 -0.38 l -0.27 1.45 A 9.21 9.21 0 0 0 12.18 3 A 9.1 9.1 0 0 0 3 12 a 9.1 9.1 0 0 0 9.18 9 A 9.12 9.12 0 0 0 21 14.68 A 1 1 0 0 0 20.3 13.43 Z"/></svg>
            </button>
        </div>

    </div>
</div>

<div class="modal-overlay" id="winOverlay">
    <div class="modal-content">
        <h2>Brilliant! 🎉</h2>
        <p>You solved the cube!</p>
        <button class="play-btn" id="playAgainBtn">Play Again</button>
    </div>
</div>

<script>
    // ================================================================
    // ПЕРЕМЕННЫЕ
    // ================================================================
    let scene, camera, renderer;
    let materials = [];
    const board = document.getElementById('board');
    let cubeGroup;
    const cubies = [];

    // Ходы / таймер / рекорд
    let moves = 0;
    let timerSec = 0;
    let timerInterval = null;
    let bestTime = Infinity;
    let isGameActive = false;
    const BEST_KEY = 'brainGames_rubik_best';

    function loadBest() {
        try {
            const v = localStorage.getItem(BEST_KEY);
            if (v !== null) bestTime = parseInt(v, 10) || Infinity;
        } catch (_) { bestTime = Infinity; }
        document.getElementById('bestDisplay').innerText = bestTime === Infinity ? '-' : fmtTime(bestTime);
    }

    function fmtTime(s) {
        const m = Math.floor(s / 60);
        const sec = s % 60;
        return String(m).padStart(2, '0') + ':' + String(sec).padStart(2, '0');
    }

    function updateTimeDisplay() {
        document.getElementById('timeDisplay').innerText = fmtTime(timerSec);
    }

    function updateMovesDisplay() {
        document.getElementById('movesDisplay').innerText = moves;
    }

    function startTimer() {
        if (timerInterval) return;
        timerInterval = setInterval(() => {
            timerSec++;
            updateTimeDisplay();
        }, 1000);
    }

    function stopTimer() {
        if (timerInterval) { clearInterval(timerInterval); timerInterval = null; }
    }

    function resetStats() {
        stopTimer();
        moves = 0; timerSec = 0;
        updateMovesDisplay();
        updateTimeDisplay();
    }

    loadBest();

    // ================================================================
    // ТЕМЫ
    // ================================================================
    const themeBtn = document.getElementById('themeBtn');
    const moonIcon = document.getElementById('moonIcon');
    const sunIcon = document.getElementById('sunIcon');
    let currentTheme = localStorage.getItem('brainGamesTheme') || 'light';

    function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        moonIcon.style.display = theme === 'dark' ? 'none' : '';
        sunIcon.style.display = theme === 'dark' ? '' : 'none';
        localStorage.setItem('brainGamesTheme', theme);
        updateCubeColors();
    }
    applyTheme(currentTheme);

    themeBtn.addEventListener('click', () => {
        currentTheme = currentTheme === 'light' ? 'dark' : 'light';
        applyTheme(currentTheme);
    });

    // ================================================================
    // АУДИО
    // ================================================================
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function initAudio() {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'click') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
            gainNode.gain.setValueAtTime(0.5, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'win') {
            const notes = [440, 554.37, 659.25, 880];
            notes.forEach((freq, i) => {
                const oscNote = audioCtx.createOscillator();
                const gainNote = audioCtx.createGain();
                oscNote.type = 'sine';
                oscNote.frequency.value = freq;
                oscNote.connect(gainNote);
                gainNote.connect(audioCtx.destination);
                gainNote.gain.setValueAtTime(0, now);
                gainNote.gain.linearRampToValueAtTime(0.3, now + i * 0.1 + 0.05);
                gainNote.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.5);
                oscNote.start(now + i * 0.1);
                oscNote.stop(now + i * 0.1 + 0.5);
            });
        }
    }

    document.addEventListener('pointerdown', initAudio, { once: true });

    // ================================================================
    // THREE.JS: КУБИК РУБИКА
    // ================================================================

    const getColors = () => {
        const style = getComputedStyle(document.body);
        return [
            style.getPropertyValue('--cube-red').trim(),
            style.getPropertyValue('--cube-orange').trim(),
            style.getPropertyValue('--cube-white').trim(),
            style.getPropertyValue('--cube-yellow').trim(),
            style.getPropertyValue('--cube-green').trim(),
            style.getPropertyValue('--cube-blue').trim(),
            style.getPropertyValue('--cube-inner').trim()
        ];
    };

    function updateRendererSize() {
        if (!renderer || !camera) return;
        const w = board.clientWidth;
        const h = board.clientHeight;
        if (w === 0) return;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
    }

    let resizeTimer;
    window.addEventListener('resize', () => {
        clearTimeout(resizeTimer);
        resizeTimer = setTimeout(updateRendererSize, 150);
    });

    function init3D() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(45, board.clientWidth / board.clientHeight, 0.1, 100);
        camera.position.set(5, 5, 6);
        camera.lookAt(0, 0, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(board.clientWidth, board.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        board.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.3);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        cubeGroup = new THREE.Group();
        scene.add(cubeGroup);

        createCubies();

        renderer.setAnimationLoop(() => {
            renderer.render(scene, camera);
        });

        setupControls();
    }

    function createMaterials() {
        const colors = getColors();
        materials = [];
        for (let i = 0; i < 6; i++) {
            materials.push(new THREE.MeshLambertMaterial({
                color: colors[i], polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1
            }));
        }
        const innerMat = new THREE.MeshLambertMaterial({ color: colors[6] });
        return { colored: materials, inner: innerMat };
    }

    function createCubies() {
        cubies.forEach(c => cubeGroup.remove(c));
        cubies.length = 0;

        const mats = createMaterials();
        const gap = 0.05;
        const size = 0.95;
        const geometry = new THREE.BoxGeometry(size, size, size);
        const edgesGeo = new THREE.EdgesGeometry(geometry);
        const edgeMat = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2, transparent: true, opacity: 0.2 });

        for (let x = -1; x <= 1; x++) {
            for (let y = -1; y <= 1; y++) {
                for (let z = -1; z <= 1; z++) {
                    const cubeMaterials = [
                        x === 1 ? mats.colored[0] : mats.inner,
                        x === -1 ? mats.colored[1] : mats.inner,
                        y === 1 ? mats.colored[2] : mats.inner,
                        y === -1 ? mats.colored[3] : mats.inner,
                        z === 1 ? mats.colored[4] : mats.inner,
                        z === -1 ? mats.colored[5] : mats.inner,
                    ];
                    const mesh = new THREE.Mesh(geometry, cubeMaterials);
                    mesh.position.set(x * (1 + gap), y * (1 + gap), z * (1 + gap));

                    const edges = new THREE.LineSegments(edgesGeo, edgeMat);
                    mesh.add(edges);
                    mesh.userData = { x, y, z };

                    cubeGroup.add(mesh);
                    cubies.push(mesh);
                }
            }
        }
        cubeGroup.quaternion.setFromEuler(new THREE.Euler(0.2, -0.4, 0));
    }

    function updateCubeColors() {
        if (!materials || materials.length === 0) return;
        const colors = getColors();
        for (let i = 0; i < 6; i++) {
            materials[i].color.set(colors[i]);
        }
    }

    // ================================================================
    // ИНТЕРАКЦИЯ
    // ================================================================
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    let isDragging = false;
    let dragStartPoint = { x: 0, y: 0 };
    let intersectStart = null;
    let isAnimating = false;

    function setupControls() {
        board.addEventListener('pointerdown', onPointerDown);
        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);
        window.addEventListener('pointercancel', onPointerUp);
    }

    function getIntersects(event) {
        const rect = board.getBoundingClientRect();
        mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        return raycaster.intersectObjects(cubies);
    }

    function onPointerDown(event) {
        if (isAnimating) return;
        isDragging = true;
        dragStartPoint = { x: event.clientX, y: event.clientY };
        const intersects = getIntersects(event);
        intersectStart = intersects.length > 0 ? intersects[0] : null;
    }

    function onPointerMove(event) {
        if (!isDragging || isAnimating) return;

        const deltaX = event.clientX - dragStartPoint.x;
        const deltaY = event.clientY - dragStartPoint.y;

        if (!intersectStart) {
            const rightDir = new THREE.Vector3(1, 0, 0).transformDirection(camera.matrixWorld).normalize();
            const upDir = new THREE.Vector3(0, 1, 0).transformDirection(camera.matrixWorld).normalize();

            const rotX = new THREE.Quaternion().setFromAxisAngle(upDir, deltaX * 0.005);
            const rotY = new THREE.Quaternion().setFromAxisAngle(rightDir, deltaY * 0.005);

            const deltaRot = new THREE.Quaternion().multiplyQuaternions(rotY, rotX);
            cubeGroup.quaternion.premultiply(deltaRot);
            cubeGroup.quaternion.normalize();

            dragStartPoint = { x: event.clientX, y: event.clientY };
        } else {
            const dist = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            if (dist > 30) {
                handleSliceRotation(deltaX, deltaY);
                isDragging = false;
            }
        }
    }

    function onPointerUp() {
        isDragging = false;
        intersectStart = null;
    }

    function handleSliceRotation(deltaX, deltaY) {
        const normalWorld = intersectStart.face.normal.clone().transformDirection(intersectStart.object.matrixWorld).normalize();
        const dragWorld = new THREE.Vector3(deltaX, -deltaY, 0);
        dragWorld.transformDirection(camera.matrixWorld).normalize();

        const axisWorld = new THREE.Vector3().crossVectors(normalWorld, dragWorld).normalize();

        const matrixInverse = cubeGroup.matrixWorld.clone().invert();
        const axisLocal = axisWorld.clone().transformDirection(matrixInverse).round();

        let axis = new THREE.Vector3();
        let direction = 1;

        if (Math.abs(axisLocal.x) > Math.abs(axisLocal.y) && Math.abs(axisLocal.x) > Math.abs(axisLocal.z)) {
            axis.set(1, 0, 0); direction = Math.sign(axisLocal.x);
        } else if (Math.abs(axisLocal.y) > Math.abs(axisLocal.z)) {
            axis.set(0, 1, 0); direction = Math.sign(axisLocal.y);
        } else {
            axis.set(0, 0, 1); direction = Math.sign(axisLocal.z);
        }

        const point = intersectStart.object.position.clone();
        rotateLayer(axis, point, direction * Math.PI / 2, 300);
    }

    function rotateLayer(axis, point, angle, duration = 300, isScrambling = false) {
        return new Promise(resolve => {
            isAnimating = true;
            if (!isScrambling) {
                playSound('click');
                moves++;
                updateMovesDisplay();
                startTimer();
            }

            const activeCubies = [];
            const epsilon = 0.5;

            cubies.forEach(c => {
                if (axis.x && Math.abs(c.position.x - point.x) < epsilon) activeCubies.push(c);
                if (axis.y && Math.abs(c.position.y - point.y) < epsilon) activeCubies.push(c);
                if (axis.z && Math.abs(c.position.z - point.z) < epsilon) activeCubies.push(c);
            });

            const pivot = new THREE.Object3D();
            pivot.rotation.set(0, 0, 0);
            pivot.updateMatrixWorld();
            cubeGroup.add(pivot);

            activeCubies.forEach(c => pivot.attach(c));

            const axisKey = axis.x ? 'x' : axis.y ? 'y' : 'z';
            const startRot = pivot.rotation[axisKey];
            const targetRot = startRot + angle;
            const startTime = performance.now();

            function animateRotation(now) {
                const timePassed = now - startTime;
                const progress = Math.min(timePassed / duration, 1);
                const ease = progress < 0.5 ? 2 * progress * progress : -1 + (4 - 2 * progress) * progress;
                pivot.rotation[axisKey] = startRot + angle * ease;

                if (progress < 1) {
                    requestAnimationFrame(animateRotation);
                } else {
                    pivot.rotation[axisKey] = targetRot;
                    pivot.updateMatrixWorld();
                    activeCubies.forEach(c => cubeGroup.attach(c));
                    cubeGroup.remove(pivot);
                    isAnimating = false;
                    if (!isScrambling) checkWin();
                    resolve();
                }
            }

            requestAnimationFrame(animateRotation);
        });
    }

    // ================================================================
    // ЛОГИКА ИГРЫ
    // ================================================================
    function isSolved() {
        for (const c of cubies) {
            const ud = c.userData;
            if (Math.abs(ud.x - Math.round(c.position.x)) > 0.01 ||
                Math.abs(ud.y - Math.round(c.position.y)) > 0.01 ||
                Math.abs(ud.z - Math.round(c.position.z)) > 0.01) {
                return false;
            }
        }
        return true;
    }

    function checkWin() {
        if (!isGameActive) return;
        if (isSolved()) {
            isGameActive = false;
            stopTimer();
            playSound('win');

            if (timerSec < bestTime) {
                bestTime = timerSec;
                try { localStorage.setItem(BEST_KEY, bestTime); } catch (_) { }
                document.getElementById('bestDisplay').innerText = fmtTime(bestTime);
            }

            document.getElementById('modalDesc').innerText =
                'Solved in ' + fmtTime(timerSec) + ' — ' + moves + ' moves';
            setTimeout(() => {
                showInterstitialAd();
                document.getElementById('winOverlay').classList.add('active');
            }, 600);
        }
    }

    async function doShuffle() {
        if (isAnimating) return;
        initAudio();
        resetStats();
        isGameActive = true;
        document.getElementById('winOverlay').classList.remove('active');

        const axes = [
            { axis: new THREE.Vector3(1, 0, 0), points: [new THREE.Vector3(-1,0,0), new THREE.Vector3(0,0,0), new THREE.Vector3(1,0,0)], angles: [-1, 1] },
            { axis: new THREE.Vector3(0, 1, 0), points: [new THREE.Vector3(0,-1,0), new THREE.Vector3(0,0,0), new THREE.Vector3(0,1,0)], angles: [-1, 1] },
            { axis: new THREE.Vector3(0, 0, 1), points: [new THREE.Vector3(0,0,-1), new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,1)], angles: [-1, 1] },
        ];

        // Гарантированная сложность: 20 случайных поворотов
        for (let i = 0; i < 20; i++) {
            const randAxis = axes[Math.floor(Math.random() * axes.length)];
            const point = randAxis.points[Math.floor(Math.random() * randAxis.points.length)];
            const angle = randAxis.angles[Math.floor(Math.random() * randAxis.angles.length)] * Math.PI / 2;
            await rotateLayer(randAxis.axis, point, angle, 60, true);
        }
    }

    document.getElementById('shuffleBtn').addEventListener('pointerdown', doShuffle);

    document.getElementById('playAgainBtn').addEventListener('pointerdown', () => {
        document.getElementById('winOverlay').classList.remove('active');
        doShuffle();
    });

    // Авто-перемешка при старте
    requestAnimationFrame(() => {
        init3D();
        setTimeout(() => doShuffle(), 500);
    });

    function showInterstitialAd() {
        let payload = { action: "showInterstitial" };
        Unity.call(JSON.stringify(payload));
    }

    function showRewardedAd() {
        let payload = { action: "showRewarded" };
        Unity.call(JSON.stringify(payload));
    }

    function closeGame() {
        let payload = { action: "close" };
        Unity.call(JSON.stringify(payload));
    }

    function goBack() {
        closeGame();
    }
</script>
