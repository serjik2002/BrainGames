<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Rubik's Cube 3D - Brain Games</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-color: #F8F9FA;
            --text-color: #1C2331;
            --text-secondary: #7A8294;
            --board-bg: #E2E8F0;
            --btn-bg: #FFFFFF;
            --btn-shadow: rgba(0, 0, 0, 0.05);
            --primary: #06D6A0;

            --cube-white: #ffffff;
            --cube-yellow: #ffec99;
            --cube-red: #ff8787;
            --cube-orange: #ffc078;
            --cube-green: #69db7c;
            --cube-blue: #74c0fc;
            --cube-inner: #1a1a1a;

            /* fallback */
            --margin: 16px;
            --gap: 12px;
            --header-h: 64px;
            --board-size: 320px;
            --btn-size: 44px;
            --icon-size: 22px;
            --title-size: 22px;
            --board-padding: 6px;
            --board-radius: 20px;
            --scramble-size: 18px;
            --scramble-radius: 16px;
            --modal-padding: 24px;
            --modal-radius: 18px;
            --modal-title-size: 24px;
            --modal-text-size: 16px;
            --modal-btn-size: 18px;
        }

        [data-theme="dark"] {
            --bg-color: #1A1A24;
            --text-color: #F8F9FA;
            --text-secondary: #A0AABF;
            --board-bg: #2A2A38;
            --btn-bg: #2A2A38;
            --btn-shadow: rgba(0, 0, 0, 0.2);
            --primary: #059669;

            --cube-white: #e2e8f0;
            --cube-yellow: #d8c67c;
            --cube-red: #d96c6c;
            --cube-orange: #d69e63;
            --cube-green: #54b264;
            --cube-blue: #5b9ccf;
            --cube-inner: #0f172a;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .app-container {
            position: fixed;
            inset: 0;
            padding-top: calc(var(--margin) + env(safe-area-inset-top, 0px));
            padding-bottom: calc(var(--margin) + env(safe-area-inset-bottom, 0px));
            padding-left: calc(var(--margin) + env(safe-area-inset-left, 0px));
            padding-right: calc(var(--margin) + env(safe-area-inset-right, 0px));
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--gap);
        }

        /* Header */
        .header {
            width: 100%;
            max-width: calc(var(--board-size) + 2px);
            height: var(--header-h);
            flex: 0 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            position: relative;
        }

        .back-btn {
            width: var(--btn-size);
            height: var(--btn-size);
            min-width: var(--btn-size);
            border-radius: 50%;
            background-color: var(--btn-bg);
            box-shadow: 0 4px 12px var(--btn-shadow);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: none;
            outline: none;
            color: var(--text-color);
            transition: transform 0.1s, background-color 0.3s;
        }

        .back-btn:active { transform: scale(0.9); }
        .back-btn svg { width: var(--icon-size); height: var(--icon-size); }

        .header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            max-width: calc(100% - var(--btn-size) * 2 - 40px);
            font-size: var(--title-size);
            font-weight: 900;
            letter-spacing: 2px;
            line-height: 1;
            color: var(--text-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            pointer-events: none;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .theme-toggle {
            width: var(--btn-size);
            height: var(--btn-size);
            min-width: var(--btn-size);
            border-radius: 50%;
            background-color: var(--btn-bg);
            box-shadow: 0 4px 12px var(--btn-shadow);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: none;
            outline: none;
            color: var(--text-color);
            transition: transform 0.1s, background-color 0.3s;
        }

        .theme-toggle:active { transform: scale(0.9); }
        .theme-toggle svg { width: var(--icon-size); height: var(--icon-size); color: var(--text-color); }

        /* Game area */
        .game-area {
            flex: 1 1 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--gap);
            min-height: 0;
        }

        /* Board */
        .board-bg {
            background: var(--board-bg);
            border-radius: var(--board-radius);
            padding: var(--board-padding);
            box-shadow: 0 8px 24px var(--btn-shadow);
            width: var(--board-size);
            height: var(--board-size);
            flex: 0 0 auto;
        }

        .board {
            width: 100%;
            height: 100%;
            border-radius: calc(var(--board-radius) - var(--board-padding));
            overflow: hidden;
            position: relative;
            touch-action: none;
        }

        .board canvas {
            display: block;
            width: 100%;
            height: 100%;
            outline: none;
        }

        /* Scramble button */
        .scramble-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: var(--scramble-pad-v) var(--scramble-pad-h);
            font-size: var(--scramble-size);
            font-weight: 700;
            font-family: inherit;
            border-radius: var(--scramble-radius);
            cursor: pointer;
            box-shadow: 0 4px 12px var(--btn-shadow);
            transition: transform 0.1s;
            width: var(--board-size);
        }

        .scramble-btn:active { transform: scale(0.95); }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 100;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--bg-color);
            padding: var(--modal-padding);
            border-radius: var(--modal-radius);
            text-align: center;
            transform: translateY(50px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            max-width: 90%;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-content h2 {
            font-size: var(--modal-title-size);
            margin-bottom: 10px;
            color: var(--text-color);
        }

        .modal-content p {
            color: var(--text-secondary);
            margin-bottom: 25px;
            font-size: var(--modal-text-size);
        }

        .play-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: var(--modal-padding) calc(var(--modal-padding) * 2);
            font-size: var(--modal-btn-size);
            font-weight: 700;
            font-family: inherit;
            border-radius: var(--modal-radius);
            cursor: pointer;
            transition: transform 0.1s;
            width: 100%;
        }

        .play-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <button class="back-btn" onclick="goBack()" title="Back">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <span class="header-title">Rubik's Cube</span>
        <div class="header-right">
            <button class="theme-toggle" id="themeBtn" title="Change theme">
                <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                <svg id="sunIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </button>
        </div>
    </div>

    <div class="game-area">
        <div class="board-bg">
            <div class="board" id="board"></div>
        </div>

        <button class="scramble-btn" id="scrambleBtn">Scramble</button>
    </div>
</div>

<div class="modal-overlay" id="winOverlay">
    <div class="modal-content">
        <h2>Brilliant! 🎉</h2>
        <p>You solved the cube!</p>
        <button class="play-btn" id="playAgainBtn">Play Again</button>
    </div>
</div>

<script>
    // ================================================================
    // АДАПТИВНАЯ ВЁРСТКА
    // ================================================================
    let scene, camera, renderer; // объявлены здесь, чтобы updateRendererSize не падал
    let materials = []; // здесь же, чтобы updateCubeColors не падал

    const LAYOUT_CFG = {
        portrait: {
            marginRatio: 0.025,
            gapRatio: 0.018,
            headerRatio: 0.075,
            headerMinRatio: 0.05, headerMaxRatio: 0.10,
        },
        landscape: {
            marginRatio: 0.035,
            gapRatio: 0.03,
            headerRatio: 0.12,
            headerMinRatio: 0.06, headerMaxRatio: 0.14,
        }
    };

    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

    let safeInsetsCache = { top: 0, bottom: 0, left: 0, right: 0 };
    (function measureSafeInsets() {
        const probe = document.createElement('div');
        probe.style.cssText = 'position:fixed;top:0;left:0;width:0;height:0;' +
            'padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);' +
            'padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);' +
            'visibility:hidden;';
        document.body.appendChild(probe);
        const cs = getComputedStyle(probe);
        safeInsetsCache = {
            top: parseFloat(cs.paddingTop) || 0,
            bottom: parseFloat(cs.paddingBottom) || 0,
            left: parseFloat(cs.paddingLeft) || 0,
            right: parseFloat(cs.paddingRight) || 0
        };
        probe.remove();
    })();

    function calcLayout() {
        const insets = safeInsetsCache;
        const availW = window.innerWidth - insets.left - insets.right;
        const availH = window.innerHeight - insets.top - insets.bottom;
        const isPortrait = availH >= availW;
        const cfg = isPortrait ? LAYOUT_CFG.portrait : LAYOUT_CFG.landscape;

        const margin = Math.round(availH * cfg.marginRatio);
        const gap = Math.round(availH * cfg.gapRatio);
        const headerH = Math.round(clamp(availH * cfg.headerRatio, availH * cfg.headerMinRatio, availH * cfg.headerMaxRatio));

        // scramble button height ~ headerH * 0.5
        const btnH = Math.round(headerH * 0.5);
        const usableH = availH - margin * 2 - headerH - btnH - gap * 2;
        const usableW = availW - margin * 2;
        const boardSize = Math.max(180, Math.floor(Math.min(usableH, usableW)));

        return { margin, gap, headerH, boardSize };
    }

    let currentLayout = null;

    function applyLayout() {
        const L = calcLayout();
        currentLayout = L;
        const root = document.documentElement;

        root.style.setProperty('--margin', L.margin + 'px');
        root.style.setProperty('--gap', L.gap + 'px');
        root.style.setProperty('--header-h', L.headerH + 'px');
        root.style.setProperty('--board-size', L.boardSize + 'px');

        root.style.setProperty('--btn-size', Math.round(L.headerH * 0.68) + 'px');
        root.style.setProperty('--icon-size', Math.round(L.headerH * 0.36) + 'px');
        root.style.setProperty('--title-size', Math.round(L.headerH * 0.34) + 'px');

        root.style.setProperty('--board-padding', Math.round(L.boardSize * 0.02) + 'px');
        root.style.setProperty('--board-radius', Math.round(L.boardSize * 0.06) + 'px');

        root.style.setProperty('--scramble-pad-v', Math.round(L.headerH * 0.2) + 'px');
        root.style.setProperty('--scramble-pad-h', Math.round(L.headerH * 0.4) + 'px');
        root.style.setProperty('--scramble-size', Math.round(L.headerH * 0.32) + 'px');
        root.style.setProperty('--scramble-radius', Math.round(L.headerH * 0.35) + 'px');

        root.style.setProperty('--modal-padding', Math.round(L.boardSize * 0.07) + 'px');
        root.style.setProperty('--modal-radius', Math.round(L.boardSize * 0.05) + 'px');
        root.style.setProperty('--modal-title-size', Math.round(L.boardSize * 0.065) + 'px');
        root.style.setProperty('--modal-text-size', Math.round(L.boardSize * 0.04) + 'px');
        root.style.setProperty('--modal-btn-size', Math.round(L.boardSize * 0.042) + 'px');

        // Обновляем Three.js рендерер
        updateRendererSize();
    }

    applyLayout();
    window.addEventListener('resize', applyLayout);

    // ================================================================
    // ТЕМЫ
    // ================================================================
    const themeBtn = document.getElementById('themeBtn');
    const moonIcon = document.getElementById('moonIcon');
    const sunIcon = document.getElementById('sunIcon');
    let currentTheme = localStorage.getItem('brainGamesTheme') || 'light';

    function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        moonIcon.style.display = theme === 'dark' ? 'none' : '';
        sunIcon.style.display = theme === 'dark' ? '' : 'none';
        localStorage.setItem('brainGamesTheme', theme);
        updateCubeColors();
    }
    applyTheme(currentTheme);

    themeBtn.addEventListener('click', () => {
        currentTheme = currentTheme === 'light' ? 'dark' : 'light';
        applyTheme(currentTheme);
    });

    // ================================================================
    // АУДИО
    // ================================================================
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function initAudio() {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gainNode = audioCtx.createGain();
        osc.connect(gainNode);
        gainNode.connect(audioCtx.destination);
        const now = audioCtx.currentTime;

        if (type === 'click') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, now);
            osc.frequency.exponentialRampToValueAtTime(50, now + 0.1);
            gainNode.gain.setValueAtTime(0.5, now);
            gainNode.gain.exponentialRampToValueAtTime(0.01, now + 0.1);
            osc.start(now);
            osc.stop(now + 0.1);
        } else if (type === 'win') {
            const notes = [440, 554.37, 659.25, 880];
            notes.forEach((freq, i) => {
                const oscNote = audioCtx.createOscillator();
                const gainNote = audioCtx.createGain();
                oscNote.type = 'sine';
                oscNote.frequency.value = freq;
                oscNote.connect(gainNote);
                gainNote.connect(audioCtx.destination);
                gainNote.gain.setValueAtTime(0, now);
                gainNote.gain.linearRampToValueAtTime(0.3, now + i * 0.1 + 0.05);
                gainNote.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.5);
                oscNote.start(now + i * 0.1);
                oscNote.stop(now + i * 0.1 + 0.5);
            });
        }
    }

    document.addEventListener('pointerdown', initAudio, { once: true });

    // ================================================================
    // THREE.JS: КУБИК РУБИКА
    // ================================================================
    const board = document.getElementById('board');
    let cubeGroup;
    const cubies = [];

    const getColors = () => {
        const style = getComputedStyle(document.body);
        return [
            style.getPropertyValue('--cube-red').trim(),
            style.getPropertyValue('--cube-orange').trim(),
            style.getPropertyValue('--cube-white').trim(),
            style.getPropertyValue('--cube-yellow').trim(),
            style.getPropertyValue('--cube-green').trim(),
            style.getPropertyValue('--cube-blue').trim(),
            style.getPropertyValue('--cube-inner').trim()
        ];
    };

    function updateRendererSize() {
        if (!renderer || !camera) return;
        const w = board.clientWidth;
        const h = board.clientHeight;
        if (w === 0) return;
        camera.aspect = w / h;
        camera.updateProjectionMatrix();
        renderer.setSize(w, h);
    }

    function init3D() {
        scene = new THREE.Scene();
        camera = new THREE.PerspectiveCamera(45, board.clientWidth / board.clientHeight, 0.1, 100);
        camera.position.set(5, 5, 6);
        camera.lookAt(0, 0, 0);

        renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(board.clientWidth, board.clientHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        board.appendChild(renderer.domElement);

        const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
        scene.add(ambientLight);
        const dirLight = new THREE.DirectionalLight(0xffffff, 0.3);
        dirLight.position.set(10, 20, 10);
        scene.add(dirLight);

        cubeGroup = new THREE.Group();
        scene.add(cubeGroup);

        createCubies();

        renderer.setAnimationLoop(() => {
            renderer.render(scene, camera);
        });

        setupControls();
    }

    function createMaterials() {
        const colors = getColors();
        materials = [];
        for (let i = 0; i < 6; i++) {
            materials.push(new THREE.MeshLambertMaterial({
                color: colors[i], polygonOffset: true, polygonOffsetFactor: 1, polygonOffsetUnits: 1
            }));
        }
        const innerMat = new THREE.MeshLambertMaterial({ color: colors[6] });
        return { colored: materials, inner: innerMat };
    }

    function createCubies() {
        cubies.forEach(c => cubeGroup.remove(c));
        cubies.length = 0;

        const mats = createMaterials();
        const gap = 0.05;
        const size = 0.95;
        const geometry = new THREE.BoxGeometry(size, size, size);
        const edgesGeo = new THREE.EdgesGeometry(geometry);
        const edgeMat = new THREE.LineBasicMaterial({ color: 0x000000, linewidth: 2, transparent: true, opacity: 0.2 });

        for (let x = -1; x <= 1; x++) {
            for (let y = -1; y <= 1; y++) {
                for (let z = -1; z <= 1; z++) {
                    const cubeMaterials = [
                        x === 1 ? mats.colored[0] : mats.inner,
                        x === -1 ? mats.colored[1] : mats.inner,
                        y === 1 ? mats.colored[2] : mats.inner,
                        y === -1 ? mats.colored[3] : mats.inner,
                        z === 1 ? mats.colored[4] : mats.inner,
                        z === -1 ? mats.colored[5] : mats.inner,
                    ];
                    const mesh = new THREE.Mesh(geometry, cubeMaterials);
                    mesh.position.set(x * (1 + gap), y * (1 + gap), z * (1 + gap));

                    const edges = new THREE.LineSegments(edgesGeo, edgeMat);
                    mesh.add(edges);
                    mesh.userData = { x, y, z };

                    cubeGroup.add(mesh);
                    cubies.push(mesh);
                }
            }
        }
        cubeGroup.quaternion.setFromEuler(new THREE.Euler(0.2, -0.4, 0));
    }

    function updateCubeColors() {
        if (!materials || materials.length === 0) return;
        const colors = getColors();
        for (let i = 0; i < 6; i++) {
            materials[i].color.set(colors[i]);
        }
    }

    // ================================================================
    // ИНТЕРАКЦИЯ
    // ================================================================
    const raycaster = new THREE.Raycaster();
    const mouse = new THREE.Vector2();

    let isDragging = false;
    let dragStartPoint = { x: 0, y: 0 };
    let intersectStart = null;
    let isAnimating = false;
    let isGameActive = false;

    function setupControls() {
        board.addEventListener('pointerdown', onPointerDown);
        window.addEventListener('pointermove', onPointerMove);
        window.addEventListener('pointerup', onPointerUp);
        window.addEventListener('pointercancel', onPointerUp);
    }

    function getIntersects(event) {
        const rect = board.getBoundingClientRect();
        mouse.x = ((event.clientX - rect.left) / rect.width) * 2 - 1;
        mouse.y = -((event.clientY - rect.top) / rect.height) * 2 + 1;
        raycaster.setFromCamera(mouse, camera);
        return raycaster.intersectObjects(cubies);
    }

    function onPointerDown(event) {
        if (isAnimating) return;
        isDragging = true;
        dragStartPoint = { x: event.clientX, y: event.clientY };
        const intersects = getIntersects(event);
        intersectStart = intersects.length > 0 ? intersects[0] : null;
    }

    function onPointerMove(event) {
        if (!isDragging || isAnimating) return;

        const deltaX = event.clientX - dragStartPoint.x;
        const deltaY = event.clientY - dragStartPoint.y;

        if (!intersectStart) {
            const rightDir = new THREE.Vector3(1, 0, 0).transformDirection(camera.matrixWorld).normalize();
            const upDir = new THREE.Vector3(0, 1, 0).transformDirection(camera.matrixWorld).normalize();

            const rotX = new THREE.Quaternion().setFromAxisAngle(upDir, deltaX * 0.005);
            const rotY = new THREE.Quaternion().setFromAxisAngle(rightDir, deltaY * 0.005);

            const deltaRot = new THREE.Quaternion().multiplyQuaternions(rotY, rotX);
            cubeGroup.quaternion.premultiply(deltaRot);
            cubeGroup.quaternion.normalize();

            dragStartPoint = { x: event.clientX, y: event.clientY };
        } else {
            const dist = Math.sqrt(deltaX * deltaX + deltaY * deltaY);
            if (dist > 30) {
                handleSliceRotation(deltaX, deltaY);
                isDragging = false;
            }
        }
    }

    function onPointerUp() {
        isDragging = false;
        intersectStart = null;
    }

    function handleSliceRotation(deltaX, deltaY) {
        const normalWorld = intersectStart.face.normal.clone().transformDirection(intersectStart.object.matrixWorld).normalize();
        const dragWorld = new THREE.Vector3(deltaX, -deltaY, 0);
        dragWorld.transformDirection(camera.matrixWorld).normalize();

        const axisWorld = new THREE.Vector3().crossVectors(normalWorld, dragWorld).normalize();

        const matrixInverse = cubeGroup.matrixWorld.clone().invert();
        const axisLocal = axisWorld.clone().transformDirection(matrixInverse).round();

        let axis = new THREE.Vector3();
        let direction = 1;

        if (Math.abs(axisLocal.x) > Math.abs(axisLocal.y) && Math.abs(axisLocal.x) > Math.abs(axisLocal.z)) {
            axis.set(1, 0, 0); direction = Math.sign(axisLocal.x);
        } else if (Math.abs(axisLocal.y) > Math.abs(axisLocal.z)) {
            axis.set(0, 1, 0); direction = Math.sign(axisLocal.y);
        } else {
            axis.set(0, 0, 1); direction = Math.sign(axisLocal.z);
        }

        const point = intersectStart.object.position.clone();
        rotateLayer(axis, point, direction * Math.PI / 2, 300);
    }

    function rotateLayer(axis, point, angle, duration = 300, isScrambling = false) {
        return new Promise(resolve => {
            isAnimating = true;
            if (!isScrambling) playSound('click');

            const activeCubies = [];
            const epsilon = 0.5;

            cubies.forEach(c => {
                if (axis.x && Math.abs(c.position.x - point.x) < epsilon) activeCubies.push(c);
                if (axis.y && Math.abs(c.position.y - point.y) < epsilon) activeCubies.push(c);
                if (axis.z && Math.abs(c.position.z - point.z) < epsilon) activeCubies.push(c);
            });

            const pivot = new THREE.Object3D();
            pivot.rotation.set(0, 0, 0);
            pivot.updateMatrixWorld();
            cubeGroup.add(pivot);

            activeCubies.forEach(c => pivot.attach(c));

            const axisKey = axis.x ? 'x' : axis.y ? 'y' : 'z';
            const startRot = pivot.rotation[axisKey];
            const targetRot = startRot + angle;
            const startTime = performance.now();

            function animateRotation(now) {
                const timePassed = now - startTime;
                const progress = Math.min(timePassed / duration, 1);
                const ease = progress < 0.5 ? 2 * progress * progress : -1 + (4 - 2 * progress) * progress;
                pivot.rotation[axisKey] = startRot + angle * ease;

                if (progress < 1) {
                    requestAnimationFrame(animateRotation);
                } else {
                    pivot.rotation[axisKey] = targetRot;
                    pivot.updateMatrixWorld();
                    activeCubies.forEach(c => cubeGroup.attach(c));
                    cubeGroup.remove(pivot);
                    isAnimating = false;
                    if (!isScrambling) checkWin();
                    resolve();
                }
            }

            requestAnimationFrame(animateRotation);
        });
    }

    // ================================================================
    // ЛОГИКА ИГРЫ
    // ================================================================
    function isSolved() {
        for (const c of cubies) {
            const ud = c.userData;
            if (Math.abs(ud.x - Math.round(c.position.x)) > 0.01 ||
                Math.abs(ud.y - Math.round(c.position.y)) > 0.01 ||
                Math.abs(ud.z - Math.round(c.position.z)) > 0.01) {
                return false;
            }
        }
        return true;
    }

    function checkWin() {
        if (!isGameActive) return;
        if (isSolved()) {
            isGameActive = false;
            playSound('win');
            const boardSz = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--board-size')) || 400;
            confetti({
                particleCount: Math.round(boardSz * 0.35),
                spread: Math.round(boardSz * 0.16),
                origin: { y: 0.6 },
                colors: ['#06D6A0', '#FFD166', '#EF476F', '#118AB2']
            });
            setTimeout(() => document.getElementById('winOverlay').classList.add('active'), 800);
        }
    }

    document.getElementById('scrambleBtn').addEventListener('pointerdown', async () => {
        if (isAnimating) return;
        initAudio();
        isGameActive = true;
        document.getElementById('winOverlay').classList.remove('active');
        confetti.reset();

        const axes = [
            { axis: new THREE.Vector3(1, 0, 0), points: [new THREE.Vector3(-1,0,0), new THREE.Vector3(0,0,0), new THREE.Vector3(1,0,0)], angles: [-1, 1] },
            { axis: new THREE.Vector3(0, 1, 0), points: [new THREE.Vector3(0,-1,0), new THREE.Vector3(0,0,0), new THREE.Vector3(0,1,0)], angles: [-1, 1] },
            { axis: new THREE.Vector3(0, 0, 1), points: [new THREE.Vector3(0,0,-1), new THREE.Vector3(0,0,0), new THREE.Vector3(0,0,1)], angles: [-1, 1] },
        ];

        for (let i = 0; i < 20; i++) {
            const randAxis = axes[Math.floor(Math.random() * axes.length)];
            const point = randAxis.points[Math.floor(Math.random() * randAxis.points.length)];
            const angle = randAxis.angles[Math.floor(Math.random() * randAxis.angles.length)] * Math.PI / 2;
            await rotateLayer(randAxis.axis, point, angle, 80, true);
        }
    });

    document.getElementById('playAgainBtn').addEventListener('pointerdown', () => {
        document.getElementById('winOverlay').classList.remove('active');
        confetti.reset();
        document.getElementById('scrambleBtn').click();
    });

    // Даём браузеру выполнить layout, затем запускаем 3D
    requestAnimationFrame(() => init3D());
</script>
</body>
