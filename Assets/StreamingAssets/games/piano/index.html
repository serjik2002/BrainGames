<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Piano Tiles - Brain Games</title>
    <style>
        :root {
            --bg-color: #F8F9FA;
            --text-color: #1C2331;
            --board-bg: #E2E8F0;
            --tile-color: #1C2331;
            --tile-active: #06D6A0;
            --danger: #EF476F;
            --btn-bg: #E2E6EB;
            --btn-shadow: rgba(0,0,0,0.06);
            --primary: #06D6A0;

            --margin: 16px;
            --gap: 12px;
            --header-h: 64px;
            --btn-size: 44px;
            --icon-size: 22px;
            --title-size: 22px;
            --score-size: 18px;
            --board-w: 300px;
            --board-h: 400px;
        }

        [data-theme="dark"] {
            --bg-color: #1A1A24;
            --text-color: #E2E8F0;
            --board-bg: #16213E;
            --tile-color: #64B5F6;
            --tile-active: #06D6A0;
            --danger: #E94560;
            --btn-bg: #2A2A38;
            --btn-shadow: rgba(0,0,0,0.3);
            --primary: #059669;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Nunito', 'Segoe UI', Tahoma, sans-serif; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }

        html, body { width: 100%; height: 100%; }

        body {
            background-color: var(--bg-color); color: var(--text-color);
            overflow: hidden; touch-action: none;
            transition: background-color 0.3s, color 0.3s;
        }

        .app-container {
            position: fixed; inset: 0;
            padding-top: calc(var(--margin) + env(safe-area-inset-top, 0px));
            padding-bottom: calc(var(--margin) + env(safe-area-inset-bottom, 0px));
            padding-left: calc(var(--margin) + env(safe-area-inset-left, 0px));
            padding-right: calc(var(--margin) + env(safe-area-inset-right, 0px));
            display: flex; flex-direction: column; align-items: center;
            gap: var(--gap);
        }

        /* Header */
        .header {
            width: 100%; max-width: 500px;
            height: var(--header-h); flex: 0 0 auto;
            display: flex; justify-content: space-between; align-items: center;
            gap: 12px; position: relative;
        }

        .back-btn {
            width: var(--btn-size); height: var(--btn-size); min-width: var(--btn-size);
            border-radius: 50%; background-color: var(--btn-bg);
            box-shadow: 0 4px 12px var(--btn-shadow);
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; border: none; outline: none; color: var(--text-color);
            transition: transform 0.1s, background-color 0.3s;
        }
        .back-btn:active { transform: scale(0.9); }
        .back-btn svg { width: var(--icon-size); height: var(--icon-size); }

        .header-title {
            position: absolute; left: 50%; transform: translateX(-50%);
            max-width: calc(100% - var(--btn-size) * 2 - 40px);
            font-size: var(--title-size); font-weight: 900; letter-spacing: 2px;
            line-height: 1; color: var(--text-color);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none;
        }

        .header-right { display: flex; align-items: center; gap: 6px; }

        .score-pill {
            background: var(--btn-bg); padding: 6px 14px; border-radius: 20px;
            box-shadow: 0 4px 12px var(--btn-shadow);
            font-weight: 800; font-size: var(--score-size); white-space: nowrap;
        }

        .theme-toggle {
            width: var(--btn-size); height: var(--btn-size); min-width: var(--btn-size);
            border-radius: 50%; background-color: var(--btn-bg);
            box-shadow: 0 4px 12px var(--btn-shadow);
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; border: none; outline: none; color: var(--text-color);
            transition: transform 0.1s, background-color 0.3s;
        }
        .theme-toggle:active { transform: scale(0.9); }
        .theme-toggle svg { width: var(--icon-size); height: var(--icon-size); color: var(--text-color); }

        /* Game area */
        .game-area {
            flex: 1 1 auto; width: 100%;
            display: flex; align-items: center; justify-content: center;
            min-height: 0;
        }

        /* Board */
        .board {
            width: var(--board-w);
            height: var(--board-h);
            max-height: 100%;
            background-color: var(--board-bg);
            border-radius: 12px; position: relative; overflow: hidden;
            display: flex;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.1);
        }

        .start-screen {
            position: absolute; inset: 0;
            background: rgba(0,0,0,0.4); backdrop-filter: blur(3px);
            z-index: 50; display: flex; justify-content: center; align-items: center;
            color: #fff; font-size: 24px; font-weight: bold;
            cursor: pointer; border-radius: 12px;
            text-shadow: 0 2px 4px rgba(0,0,0,0.5);
        }

        .lane { flex: 1; border-right: 1px solid rgba(0,0,0,0.05); position: relative; }
        .lane:last-child { border-right: none; }

        .tile {
            position: absolute; width: 100%; height: 25%;
            background-color: var(--tile-color); border-radius: 8px;
            cursor: pointer; transition: background-color 0.1s;
        }
        .tile.clicked { background-color: var(--tile-active); opacity: 0.8; }

        /* Modal */
        .modal {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center; z-index: 100;
        }
        .modal-content {
            background-color: var(--bg-color); padding: 40px; border-radius: 20px;
            text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .modal h2 { margin: 0 0 20px 0; color: var(--danger); font-size: 32px; }
        .modal p { font-size: 20px; margin-bottom: 30px; }
        .modal button {
            padding: 15px 40px; font-size: 20px; border: none; border-radius: 20px;
            background-color: var(--primary); color: #fff; font-weight: bold; cursor: pointer;
        }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <button class="back-btn" onclick="goBack()" title="Back">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <span class="header-title">Piano Tiles</span>
        <div class="header-right">
            <div class="score-pill"><span id="score">0</span></div>
            <button class="theme-toggle" id="themeBtn" title="Change theme">
                <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                <svg id="sunIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </button>
        </div>
    </div>

    <div class="game-area">
        <div class="board" id="board">
            <div class="start-screen" id="startScreen"><span>Tap to start</span></div>
            <div class="lane" id="lane-0"></div>
            <div class="lane" id="lane-1"></div>
            <div class="lane" id="lane-2"></div>
            <div class="lane" id="lane-3"></div>
        </div>
    </div>
</div>

<div class="modal" id="gameOverModal">
    <div class="modal-content">
        <h2>Game Over!</h2>
        <p>Your score: <strong id="finalScore">0</strong></p>
        <button onclick="restartGame()">Try Again</button>
    </div>
</div>

<script>
    // ================================================================
    // АДАПТИВНАЯ ВЁРСТКА
    // ================================================================
    const LAYOUT_CFG = {
        portrait: {
            marginRatio: 0.025, gapRatio: 0.018, headerRatio: 0.075,
            headerMinRatio: 0.05, headerMaxRatio: 0.10,
        },
        landscape: {
            marginRatio: 0.02, gapRatio: 0.015, headerRatio: 0.10,
            headerMinRatio: 0.06, headerMaxRatio: 0.14,
        }
    };

    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

    let safeInsetsCache = { top:0, bottom:0, left:0, right:0 };
    (function measureSafeInsets() {
        const probe = document.createElement('div');
        probe.style.cssText = 'position:fixed;top:0;left:0;width:0;height:0;' +
            'padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);' +
            'padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);visibility:hidden;';
        document.body.appendChild(probe);
        const cs = getComputedStyle(probe);
        safeInsetsCache = {
            top: parseFloat(cs.paddingTop)||0, bottom: parseFloat(cs.paddingBottom)||0,
            left: parseFloat(cs.paddingLeft)||0, right: parseFloat(cs.paddingRight)||0
        };
        probe.remove();
    })();

    function calcLayout() {
        const insets = safeInsetsCache;
        const availW = window.innerWidth - insets.left - insets.right;
        const availH = window.innerHeight - insets.top - insets.bottom;
        const isPortrait = availH >= availW;
        const cfg = isPortrait ? LAYOUT_CFG.portrait : LAYOUT_CFG.landscape;

        const margin = Math.round(availH * cfg.marginRatio);
        const gap = Math.round(availH * cfg.gapRatio);
        const headerH = Math.round(clamp(availH * cfg.headerRatio, availH * cfg.headerMinRatio, availH * cfg.headerMaxRatio));

        // 3:4 aspect ratio board
        const availBoardH = availH - margin * 2 - headerH - gap;
        const boardH = Math.min(availBoardH, (availW - margin * 2) * 4 / 3);
        const boardW = boardH * 3 / 4;

        return { margin, gap, headerH, boardW, boardH };
    }

    function applyLayout() {
        const L = calcLayout();
        const root = document.documentElement;

        root.style.setProperty('--margin', L.margin + 'px');
        root.style.setProperty('--gap', L.gap + 'px');
        root.style.setProperty('--header-h', L.headerH + 'px');

        root.style.setProperty('--btn-size', Math.round(L.headerH * 0.68) + 'px');
        root.style.setProperty('--icon-size', Math.round(L.headerH * 0.36) + 'px');
        root.style.setProperty('--title-size', Math.round(L.headerH * 0.34) + 'px');
        root.style.setProperty('--score-size', Math.round(L.headerH * 0.28) + 'px');
        root.style.setProperty('--board-w', Math.round(L.boardW) + 'px');
        root.style.setProperty('--board-h', Math.round(L.boardH) + 'px');
    }

    applyLayout();
    window.addEventListener('resize', applyLayout);

    // ================================================================
    // ТЕМЫ
    // ================================================================
    const themeBtn = document.getElementById('themeBtn');
    const moonIcon = document.getElementById('moonIcon');
    const sunIcon = document.getElementById('sunIcon');
    let currentTheme = localStorage.getItem('brainGamesTheme') || 'light';

    function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        moonIcon.style.display = theme === 'dark' ? 'none' : '';
        sunIcon.style.display = theme === 'dark' ? '' : 'none';
        localStorage.setItem('brainGamesTheme', theme);
    }
    applyTheme(currentTheme);
    themeBtn.addEventListener('click', () => {
        currentTheme = currentTheme === 'light' ? 'dark' : 'light';
        applyTheme(currentTheme);
    });

    // ================================================================
    // АУДИО (ОРИГИНАЛЬНАЯ ЛОГИКА)
    // ================================================================
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;
    const notes = [261.63, 293.66, 329.63, 349.23, 392.00, 440.00, 493.88, 523.25];

    function initAudio() {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playNote() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = notes[Math.floor(Math.random() * notes.length)];
        osc.type = 'triangle';
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.5);
        osc.stop(audioCtx.currentTime + 0.5);
    }

    function playError() {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.frequency.value = 150; osc.type = 'sawtooth';
        osc.connect(gain); gain.connect(audioCtx.destination);
        osc.start();
        gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.00001, audioCtx.currentTime + 0.3);
        osc.stop(audioCtx.currentTime + 0.3);
    }

    // ================================================================
    // ЛОГИКА ИГРЫ (ОРИГИНАЛ)
    // ================================================================
    const lanes = [
        document.getElementById('lane-0'), document.getElementById('lane-1'),
        document.getElementById('lane-2'), document.getElementById('lane-3')
    ];
    const scoreEl = document.getElementById('score');
    const modal = document.getElementById('gameOverModal');
    const finalScoreEl = document.getElementById('finalScore');
    const startScreen = document.getElementById('startScreen');

    let score = 0, isGameOver = true, tiles = [];
    let baseSpeed = 0.3, animationId, spawnTimer = 0;

    startScreen.addEventListener('pointerdown', (e) => {
        e.stopPropagation();
        initAudio();
        startScreen.style.display = 'none';
        startGame();
    });

    function spawnTile() {
        const laneIndex = Math.floor(Math.random() * 4);
        const tile = document.createElement('div');
        tile.classList.add('tile');
        tile.style.top = '-25%';
        let tileObj = { el: tile, lane: laneIndex, y: -25, clicked: false };

        tile.addEventListener('pointerdown', (e) => {
            e.stopPropagation();
            if (isGameOver || tileObj.clicked) return;
            const expectedTile = tiles.find(t => !t.clicked);
            if (tileObj !== expectedTile) { gameOver(); return; }
            tileObj.clicked = true;
            tile.classList.add('clicked');
            score++;
            scoreEl.innerText = score;
            playNote();
        });

        lanes[laneIndex].appendChild(tile);
        tiles.push(tileObj);
    }

    function gameLoop() {
        if (isGameOver) return;
        let currentSpeed = baseSpeed + (score * 0.005);
        spawnTimer += currentSpeed;
        if (spawnTimer >= 35) { spawnTile(); spawnTimer = 0; }

        for (let i = 0; i < tiles.length; i++) {
            let t = tiles[i];
            t.y += currentSpeed;
            t.el.style.top = t.y + '%';
            if (t.y > 100) {
                if (!t.clicked) { gameOver(); return; }
                else { t.el.remove(); tiles.splice(i, 1); i--; }
            }
        }
        animationId = requestAnimationFrame(gameLoop);
    }

    function gameOver() {
        isGameOver = true;
        cancelAnimationFrame(animationId);
        playError();
        finalScoreEl.innerText = score;
        modal.style.display = 'flex';
    }

    function startGame() {
        isGameOver = false;
        score = 0; scoreEl.innerText = score;
        baseSpeed = 0.3; spawnTimer = -20;
        tiles.forEach(t => t.el.remove());
        tiles = [];
        gameLoop();
    }

    function restartGame() {
        modal.style.display = 'none';
        startScreen.style.display = 'flex';
        tiles.forEach(t => t.el.remove());
        tiles = [];
        score = 0; scoreEl.innerText = score;
    }
</script>
</body>
</html>
