<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Тестирование рекламы</title>
    <style>
        /* Стили для красивого интерфейса */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }

        .container {
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 30px;
            padding: 40px 30px;
            max-width: 400px;
            width: 100%;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            color: #ffffff;
            font-size: 28px;
            font-weight: 700;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
            margin-bottom: 8px;
        }

        .header p {
            color: rgba(255, 255, 255, 0.6);
            font-size: 14px;
        }

        .status-card {
            background: rgba(255, 255, 255, 0.08);
            border-radius: 16px;
            padding: 20px;
            margin-bottom: 25px;
            text-align: center;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .status-card .label {
            color: rgba(255, 255, 255, 0.5);
            font-size: 12px;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .status-card .value {
            color: #4fc3f7;
            font-size: 32px;
            font-weight: 700;
            margin-top: 5px;
        }

        .status-card .value .currency {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.3);
        }

        .ad-buttons {
            display: flex;
            flex-direction: column;
            gap: 15px;
            margin: 25px 0;
        }

        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            padding: 18px 24px;
            border: none;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 600;
            color: #ffffff;
            cursor: pointer;
            transition: all 0.3s ease;
            position: relative;
            overflow: hidden;
            width: 100%;
            touch-action: manipulation;
            user-select: none;
        }

        .btn:active {
            transform: scale(0.95);
        }

        .btn .icon {
            font-size: 24px;
        }

        .btn-rewarded {
            background: linear-gradient(135deg, #f093fb 0%, #f5576c 100%);
            box-shadow: 0 8px 25px rgba(245, 87, 108, 0.4);
        }

        .btn-rewarded:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(245, 87, 108, 0.5);
        }

        .btn-interstitial {
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            box-shadow: 0 8px 25px rgba(79, 172, 254, 0.4);
        }

        .btn-interstitial:hover {
            transform: translateY(-2px);
            box-shadow: 0 12px 35px rgba(79, 172, 254, 0.5);
        }

        .btn-close {
            background: rgba(255, 255, 255, 0.08);
            border: 1px solid rgba(255, 255, 255, 0.15);
            margin-top: 10px;
            padding: 14px;
            font-size: 16px;
            color: rgba(255, 255, 255, 0.6);
        }

        .btn-close:hover {
            background: rgba(255, 255, 255, 0.15);
        }

        .btn .badge {
            position: absolute;
            top: -8px;
            right: -8px;
            background: #ffd700;
            color: #1a1a2e;
            font-size: 10px;
            font-weight: 700;
            padding: 4px 10px;
            border-radius: 20px;
            box-shadow: 0 4px 15px rgba(255, 215, 0, 0.4);
        }

        .log-container {
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
        }

        .log-container .log-title {
            color: rgba(255, 255, 255, 0.4);
            font-size: 11px;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 10px;
        }

        .log-box {
            background: rgba(0, 0, 0, 0.3);
            border-radius: 12px;
            padding: 12px 15px;
            max-height: 120px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.7);
        }

        .log-box .log-entry {
            padding: 2px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.03);
        }

        .log-box .log-entry .time {
            color: rgba(255, 255, 255, 0.3);
            margin-right: 8px;
        }

        .log-box .log-entry .green {
            color: #66bb6a;
        }

        .log-box .log-entry .yellow {
            color: #ffd54f;
        }

        .log-box .log-entry .red {
            color: #ef5350;
        }

        .log-box .log-entry .blue {
            color: #4fc3f7;
        }

        .log-box::-webkit-scrollbar {
            width: 4px;
        }

        .log-box::-webkit-scrollbar-track {
            background: transparent;
        }

        .log-box::-webkit-scrollbar-thumb {
            background: rgba(255, 255, 255, 0.2);
            border-radius: 10px;
        }

        /* Анимация для кнопок при нажатии */
        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(255, 255, 255, 0.4); }
            100% { box-shadow: 0 0 0 15px rgba(255, 255, 255, 0); }
        }

        .btn-pulse {
            animation: pulse 0.6s ease-out;
        }

        /* Для мобильных устройств */
        @media (max-width: 480px) {
            .container {
                padding: 25px 20px;
            }
            .header h1 {
                font-size: 22px;
            }
            .btn {
                padding: 16px 20px;
                font-size: 16px;
            }
            .status-card .value {
                font-size: 28px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Шапка -->
        <div class="header">
            <h1>🎮 Тест рекламы</h1>
            <p>Нажмите на кнопку чтобы протестировать показ</p>
        </div>

        <!-- Счетчик звезд -->
        <div class="status-card">
            <div class="label">⭐ Баланс звезд</div>
            <div class="value" id="starsBalance">
                100 <span class="currency">⭐</span>
            </div>
        </div>

        <!-- Кнопки рекламы -->
        <div class="ad-buttons">
            <button class="btn btn-rewarded" id="btnRewarded" onclick="sendToUnity('showRewarded')">
                <span class="icon">🎁</span>
                Смотреть Rewarded
                <span class="badge">+50 ⭐</span>
            </button>
            
            <button class="btn btn-interstitial" id="btnInterstitial" onclick="sendToUnity('showInterstitial')">
                <span class="icon">📺</span>
                Показать Interstitial
            </button>

            <button class="btn btn-close" id="btnClose" onclick="sendToUnity('close')">
                ✕ Закрыть WebView
            </button>
        </div>

        <!-- Лог сообщений -->
        <div class="log-container">
            <div class="log-title">📋 Лог событий</div>
            <div class="log-box" id="logBox">
                <div class="log-entry">
                    <span class="time">[00:00]</span>
                    <span class="blue">Готов к тестированию</span>
                </div>
            </div>
        </div>
    </div>

    <script>
        // ============================================
        // 1. ФУНКЦИИ ДЛЯ РАБОТЫ С UNITY
        // ============================================

        /**
         * Отправка сообщения в Unity
         * @param {string} message - Сообщение для отправки
         */
        function sendToUnity(message) {
            Unity.call(message);
            addLog('📤 Отправлено: ' + message, 'yellow');
        }

        /**
         * Обновление баланса звезд из Unity
         * @param {number} stars - Количество звезд для добавления
         */
        function updateStars(stars) {
            const el = document.getElementById('starsBalance');
            const current = parseInt(el.textContent) || 0;
            const newBalance = current + stars;
            el.innerHTML = newBalance + ' <span class="currency">⭐</span>';
            
            // Анимация
            el.style.transition = 'transform 0.2s';
            el.style.transform = 'scale(1.3)';
            setTimeout(() => {
                el.style.transform = 'scale(1)';
            }, 200);
            
            addLog('⭐ Получено +' + stars + ' звезд!', 'green');
        }

        /**
         * Добавление записи в лог
         */
        function addLog(message, type = 'white') {
            const logBox = document.getElementById('logBox');
            const time = new Date().toLocaleTimeString();
            const colors = {
                green: 'green',
                yellow: 'yellow',
                red: 'red',
                blue: 'blue',
                white: ''
            };
            const entry = document.createElement('div');
            entry.className = 'log-entry';
            entry.innerHTML = `
                <span class="time">[${time}]</span>
                <span class="${colors[type] || ''}">${message}</span>
            `;
            logBox.appendChild(entry);
            logBox.scrollTop = logBox.scrollHeight;
            
            // Ограничиваем количество записей
            while (logBox.children.length > 50) {
                logBox.removeChild(logBox.firstChild);
            }
        }

        // ============================================
        // 2. ОБРАБОТЧИКИ КНОПОК
        // ============================================

        // Кнопка Reward Video
document.addEventListener('DOMContentLoaded', function () {

    document.getElementById('btnRewarded').addEventListener('click', function () {
        sendToUnity('showRewarded');
    });

    document.getElementById('btnInterstitial').addEventListener('click', function () {
        sendToUnity('showInterstitial');
    });

    document.getElementById('btnClose').addEventListener('click', function () {
        addLog('❌ Закрытие WebView', 'red');
        sendToUnity('close');
    });

});
        // ============================================
        // 3. ОБРАБОТКА СООБЩЕНИЙ ИЗ UNITY
        // ============================================

        /**
         * Эта функция вызывается из Unity через EvaluateJS
         * Unity может вызвать: 
         *   - UpdateStars(50) - добавить звезды
         *   - ShowMessage("Текст") - показать сообщение
         */
        window.UpdateStars = function(stars) {
            updateStars(stars);
        };

        window.ShowMessage = function(text) {
            addLog('📢 ' + text, 'blue');
        };

        window.ShowAdResult = function(type, success) {
            const icon = success ? '✅' : '❌';
            const status = success ? 'успешно' : 'отменено';
            addLog(icon + ' Реклама (' + type + ') ' + status, success ? 'green' : 'red');
        };

        // ============================================
        // 4. ДОПОЛНИТЕЛЬНО: ПЕРЕХВАТ ОШИБОК
        // ============================================

        // Если сообщение не доходит до Unity, можно показать alert (для отладки)
        window.addEventListener('error', function(e) {
            addLog('⚠️ Ошибка: ' + e.message, 'red');
        });

        // Проверяем, что страница загружена в WebView
        if (window.unityWebView) {
            addLog('✅ Подключено к Unity WebView', 'green');
        } else {
            addLog('⚠️ Режим: обычный браузер (нет Unity)', 'yellow');
            addLog('💡 Отправка сообщений будет имитироваться', 'yellow');
            
            // Подмена для тестирования в браузере
            window.sendToUnity = function(cmd) {
                addLog('📤 [ИМИТАЦИЯ] Отправка: ' + cmd, 'yellow');
                if (cmd === 'showRewarded') {
                    setTimeout(() => {
                        updateStars(50);
                        addLog('🎁 [ИМИТАЦИЯ] Награда выдана!', 'green');
                    }, 1500);
                } else if (cmd === 'showInterstitial') {
                    setTimeout(() => {
                        addLog('📺 [ИМИТАЦИЯ] Interstitial показан', 'green');
                    }, 1000);
                }
            };
        }

        // Инициализация
        addLog('🚀 Страница загружена', 'blue');
        console.log('🎯 HTML-страница для тестирования рекламы готова!');
        console.log('📋 Используйте кнопки для вызова рекламы');
        console.log('💡 Команды: showRewarded, showInterstitial, close');
    </script>
</body>
</html>
