<!DOCTYPE html>
<html lang="ru" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>2048 - Brain Games</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        /* ================================================================
           Базовые цвета, переменные темы и адаптивная вёрстка (CSS-only)
           Все размеры — через clamp / dvh / aspect-ratio / cqw.
           Никакого JS-расчёта геометрии.
           ================================================================ */

        /* --- Портретная ориентация (default) --- */
        :root {
            /* Тема */
            --bg-color: #F8F9FA;
            --text-color: #1C2331;
            --text-secondary: #7A8294;
            --board-bg: #E2E6EB;
            --cell-bg: #D1D6DE;
            --btn-bg: #FFFFFF;
            --btn-shadow: rgba(0, 0, 0, 0.05);

            /* Геометрия (vh-фолбэк для старых WebView без dvh) */
            --margin: clamp(8px, 2.5vh, 24px);
            --gap: clamp(4px, 1.8vh, 16px);
            --header-h: clamp(32px, 7.5vh, 64px);
            --score-row-h: clamp(44px, 9vh, 64px);
            --bottom-row-h: clamp(40px, 8vh, 56px);

            /* Производные от высоты шапки */
            --btn-size: calc(var(--header-h) * 0.68);
            --icon-size: calc(var(--header-h) * 0.36);
            --title-size: calc(var(--header-h) * 0.34);

            /* Модальное окно — пропорционально экрану */
            --modal-padding: clamp(10px, 3vh, 28px);
            --modal-radius: clamp(8px, 2vh, 18px);
            --modal-title-size: clamp(16px, 3vh, 32px);
            --modal-text-size: clamp(12px, 2vh, 20px);
            --modal-btn-size: clamp(12px, 2vh, 20px);

            /* Цвета плиток (Пастельные) */
            --tile-2: #FFF0D4;
            --tile-2-text: #7A8294;
            --tile-4: #FFE0A8;
            --tile-4-text: #7A8294;
            --tile-8: #FFD166;
            --tile-8-text: #FFFFFF;
            --tile-16: #FFB067;
            --tile-16-text: #FFFFFF;
            --tile-32: #FF8E72;
            --tile-32-text: #FFFFFF;
            --tile-64: #EF476F;
            --tile-64-text: #FFFFFF;
            --tile-128: #45CB85;
            --tile-128-text: #FFFFFF;
            --tile-256: #06D6A0;
            --tile-256-text: #FFFFFF;
            --tile-512: #118AB2;
            --tile-512-text: #FFFFFF;
            --tile-1024: #073B4C;
            --tile-1024-text: #FFFFFF;
            --tile-2048: #9D4EDD;
            --tile-2048-text: #FFFFFF;
            --tile-super: #3C096C;
        }

        /* dvh включаем только если браузер поддерживает */
        @supports (height: 100dvh) {
            :root {
                --margin: clamp(8px, 2.5dvh, 24px);
                --gap: clamp(4px, 1.8dvh, 16px);
                --header-h: clamp(32px, 7.5dvh, 64px);
                --modal-padding: clamp(10px, 3dvh, 28px);
                --modal-radius: clamp(8px, 2dvh, 18px);
                --modal-title-size: clamp(16px, 3dvh, 32px);
                --modal-text-size: clamp(12px, 2dvh, 20px);
                --modal-btn-size: clamp(12px, 2dvh, 20px);
            }
        }

        /* --- Ландшафтная ориентация --- */
        @media (orientation: landscape) {
            :root {
                --margin: clamp(12px, 3.5vh, 32px);
                --gap: clamp(6px, 3vh, 20px);
                --header-h: clamp(40px, 12vh, 80px);
                --score-row-h: clamp(36px, 9vh, 52px);
                --bottom-row-h: clamp(32px, 8vh, 48px);
            }
        }

        @media (orientation: landscape) {
            @supports (height: 100dvh) {
                :root {
                    --margin: clamp(12px, 3.5dvh, 32px);
                    --gap: clamp(6px, 3dvh, 20px);
                    --header-h: clamp(40px, 12dvh, 80px);
                    --score-row-h: clamp(36px, 9dvh, 52px);
                    --bottom-row-h: clamp(32px, 8dvh, 48px);
                }
            }
        }

        [data-theme="dark"] {
            --bg-color: #1A1A24;
            --text-color: #F8F9FA;
            --text-secondary: #A0AABF;
            --board-bg: #2A2A38;
            --cell-bg: #353546;
            --btn-bg: #2A2A38;
            --btn-shadow: rgba(0, 0, 0, 0.2);

            /* Приглушенные цвета плиток для темной темы */
            --tile-2: #4A433A;
            --tile-2-text: #E2E6EB;
            --tile-4: #6B5C4A;
            --tile-4-text: #E2E6EB;
            --tile-8: #CBA54D;
            --tile-16: #CB8A50;
            --tile-32: #CC6F58;
            --tile-64: #BF3659;
            --tile-128: #36A369;
            --tile-256: #05AB80;
            --tile-512: #0D6F8F;
            --tile-1024: #052F3D;
            --tile-2048: #7A3DBF;
            --tile-super: #2D0652;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        html,
        body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        /* Корневой контейнер — flex-колонка на всю высоту, вёрстка силами CSS */
        .app-container {
            height: 100vh;               /* фолбэк */
            height: 100dvh;              /* учитывает скрывающиеся системные бары */
            padding-top: calc(var(--margin) + env(safe-area-inset-top, 0px));
            padding-bottom: calc(var(--margin) + env(safe-area-inset-bottom, 0px));
            padding-left: calc(var(--margin) + env(safe-area-inset-left, 0px));
            padding-right: calc(var(--margin) + env(safe-area-inset-right, 0px));
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: var(--gap);
        }

        /* Верхняя панель */
        .header {
            width: 100%;
            height: var(--header-h);
            flex: 0 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            position: relative;
        }

        /* Кнопка назад */
        .back-btn {
            width: var(--btn-size);
            height: var(--btn-size);
            min-width: var(--btn-size);
            border-radius: 50%;
            background-color: var(--btn-bg);
            box-shadow: 0 4px 12px var(--btn-shadow);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: none;
            outline: none;
            color: var(--text-color);
            transition: transform 0.1s, background-color 0.3s;
            -webkit-tap-highlight-color: transparent;
        }

        .back-btn:active {
            transform: scale(0.9);
        }

        .back-btn svg {
            width: var(--icon-size);
            height: var(--icon-size);
        }

        /* Название игры по центру (абсолютное позиционирование) */
        .header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            max-width: calc(100% - var(--btn-size) * 2 - 80px);
            font-size: var(--title-size);
            font-weight: 900;
            letter-spacing: 2px;
            line-height: 1;
            color: var(--text-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            pointer-events: none;
        }

        /* Правая группа: очки + тема */
        .header-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .theme-toggle {
            width: var(--btn-size);
            height: var(--btn-size);
            min-width: var(--btn-size);
            border-radius: 50%;
            background-color: var(--btn-bg);
            box-shadow: 0 4px 12px var(--btn-shadow);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: none;
            outline: none;
            color: var(--text-color);
            transition: transform 0.1s, background-color 0.3s;
            -webkit-tap-highlight-color: transparent;
        }

        .theme-toggle:active {
            transform: scale(0.9);
        }

        .theme-toggle svg {
            width: var(--icon-size);
            height: var(--icon-size);
            color: var(--text-color);
        }

        /* Обёртка «поле + плашки + кнопки» — как в fifteens */
        .board-col {
            --avail-h: calc(100vh - var(--header-h) - var(--score-row-h) - var(--bottom-row-h)
                - var(--gap) - var(--gap) - var(--gap) - 2 * var(--margin)
                - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
            --max-w: calc(100vw - 2 * var(--margin)
                - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
            --board-size: min(var(--max-w), var(--avail-h));
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: calc(var(--board-size) * 0.0256);
            align-self: center;
            flex: 1 1 auto;
            justify-content: center;
        }

        @supports (height: 100dvh) {
            .board-col {
                --avail-h: calc(100dvh - var(--header-h) - var(--score-row-h) - var(--bottom-row-h)
                    - var(--gap) - var(--gap) - var(--gap) - 2 * var(--margin)
                    - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
                --max-w: calc(100dvw - 2 * var(--margin)
                    - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
            }
        }

        /* Плашки SCORE / BEST */
        .score-row {
            width: 100%;
            display: flex;
            gap: calc(var(--board-size) * 0.0256);
        }

        .score-box {
            flex: 1 1 50%;
            background-color: var(--board-bg);
            border-radius: calc(var(--board-size) * 0.02);
            padding: 0 clamp(8px, 2vw, 16px);
            height: calc(var(--board-size) * 0.15);
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            box-shadow: 0 4px 12px var(--btn-shadow);
            transition: background-color 0.3s;
        }

        .score-label {
            display: block;
            font-size: clamp(1px, calc(var(--board-size) * 0.032), 13px);
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .score-value {
            display: block;
            font-size: clamp(1px, calc(var(--board-size) * 0.05), 20px);
            font-weight: 600;
            color: var(--text-color);
            line-height: 1;
        }

        /* Кнопки снизу */
        .bottom-row {
            display: flex;
        }

        .undo-btn {
            width: var(--btn-size);
            height: var(--btn-size);
            border-radius: 50%;
            background-color: var(--btn-bg);
            box-shadow: 0 4px 12px var(--btn-shadow);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: none;
            outline: none;
            color: var(--text-color);
            transition: transform 0.1s, opacity 0.2s, background-color 0.3s;
            -webkit-tap-highlight-color: transparent;
        }

        .undo-btn:active:not(:disabled) {
            transform: scale(0.9);
        }

        .undo-btn:disabled {
            opacity: 0.35;
            cursor: not-allowed;
        }

        .undo-btn svg {
            width: var(--icon-size);
            height: var(--icon-size);
        }

        /* Игровое поле — квадратное, центрированное, размер через min() */
        .board-bg {
            width: var(--board-size);
            aspect-ratio: 1 / 1;
            flex: 0 0 auto;
            container-type: size;
            background-color: var(--board-bg);
            border-radius: 2cqw;
            padding: 2%;
            position: relative;
            box-shadow: 0 8px 24px var(--btn-shadow);
            transition: background-color 0.3s;
        }

        .board-grid {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            grid-template-rows: repeat(4, 1fr);
            gap: 2.666%;
        }

        .grid-cell {
            background-color: var(--cell-bg);
            border-radius: 2cqw;
            transition: background-color 0.3s;
        }

        /* Плитки с числами */
        .tile-container {
            position: absolute;
            top: 2%;
            left: 2%;
            width: 96%;
            height: 96%;
            pointer-events: none;
        }

        .tile {
            position: absolute;
            width: 23%;
            height: 23%;
            background-color: var(--tile-2);
            border-radius: 2cqw;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 8cqw;
            font-weight: bold;
            color: var(--tile-2-text);
            /* Плавная анимация перемещения */
            transition: top 0.1s ease-in-out, left 0.1s ease-in-out, transform 0.15s ease-in-out;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }

        /* Анимация появления */
        .tile.new {
            animation: appear 0.2s ease-out forwards;
        }

        @keyframes appear {
            0% { transform: scale(0); }
            100% { transform: scale(1); }
        }

        /* Оверлей окончания игры */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 100;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal {
            background-color: var(--bg-color);
            padding: var(--modal-padding);
            border-radius: var(--modal-radius);
            text-align: center;
            transform: translateY(50px);
            transition: transform 0.3s;
            width: 80%;
            max-width: 90vw;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
        }

        .overlay.active .modal {
            transform: translateY(0);
        }

        .modal h2 {
            font-size: var(--modal-title-size);
            margin-bottom: 0.3em;
            color: var(--text-color);
        }

        .modal p {
            color: var(--text-secondary);
            font-size: var(--modal-text-size);
            margin-bottom: 0.8em;
        }

        .btn {
            background-color: #06D6A0;
            color: white;
            border: none;
            padding: 0.8em 2em;
            font-size: var(--modal-btn-size);
            font-weight: bold;
            border-radius: 0.8em;
            cursor: pointer;
            transition: transform 0.1s, opacity 0.2s;
            width: 100%;
        }

        .btn:active {
            transform: scale(0.95);
        }

        /* Классы для расцветки плиток */
        .t-2  { background-color: var(--tile-2);  color: var(--tile-2-text); }
        .t-4  { background-color: var(--tile-4);  color: var(--tile-4-text); }
        .t-8  { background-color: var(--tile-8);  color: var(--tile-8-text); }
        .t-16 { background-color: var(--tile-16); color: var(--tile-16-text); }
        .t-32 { background-color: var(--tile-32); color: var(--tile-32-text); }
        .t-64 { background-color: var(--tile-64); color: var(--tile-64-text); }

        .t-128 {
            background-color: var(--tile-128);
            color: var(--tile-128-text);
            font-size: 6.4cqw;
        }

        .t-256 {
            background-color: var(--tile-256);
            color: var(--tile-256-text);
            font-size: 6.4cqw;
        }

        .t-512 {
            background-color: var(--tile-512);
            color: var(--tile-512-text);
            font-size: 6.4cqw;
        }

        .t-1024 {
            background-color: var(--tile-1024);
            color: var(--tile-1024-text);
            font-size: 4.8cqw;
        }

        .t-2048 {
            background-color: var(--tile-2048);
            color: var(--tile-2048-text);
            font-size: 4.8cqw;
            box-shadow: 0 0 15px rgba(157, 78, 221, 0.5);
        }

        .t-super {
            background-color: var(--tile-super);
            color: var(--tile-2048-text);
            font-size: 4.8cqw;
        }
    </style>
</head>

<body>

    <div class="app-container">
        <!-- Верхняя панель -->
        <div class="header">
            <button class="back-btn" id="backBtn" onclick="goBack()" title="Назад">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <span class="header-title">2048</span>
            <div class="header-right">
                <!-- Очки закомментированы
                <div class="score-container">
                    <svg viewBox="0 0 24 24"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                    <span id="scoreDisplay">0</span>
                </div>
                -->
                <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()" title="Сменить тему">
                    <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" style="display: none;">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                    <svg id="sunIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                </button>
            </div>
        </div>

        <!-- Поле + плашки + кнопки — обёртка как в fifteens -->
        <div class="board-col">

            <!-- Плашки SCORE / BEST — ровно над полем, каждая 50% ширины -->
            <div class="score-row">
                <div class="score-box">
                    <span class="score-label">SCORE</span>
                    <span class="score-value" id="scoreDisplay">0</span>
                </div>
                <div class="score-box">
                    <span class="score-label">BEST</span>
                    <span class="score-value" id="bestDisplay">0</span>
                </div>
            </div>

            <div class="board-bg" id="touchArea">
                <div class="board-grid">
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                    <div class="grid-cell"></div>
                </div>
                <!-- Слой для динамических плиток -->
                <div class="tile-container" id="tileContainer"></div>
            </div>

            <!-- Кнопка отмены хода (слева под полем) -->
            <div class="bottom-row">
                <button class="undo-btn" id="undoBtn" onclick="undoMove()" disabled title="Отменить ход">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="1 4 1 10 7 10"></polyline>
                        <path d="M3.51 15a9 9 0 1 0 2.13-9.36L1 10"></path>
                    </svg>
                </button>
            </div>

        </div>
    </div>

    <!-- Модальное окно поражения/победы -->
    <div class="overlay" id="modalOverlay">
        <div class="modal">
            <h2 id="modalTitle">You Lost</h2>
            <p id="modalDesc"></p>
            <button class="btn" onclick="restartGame()">RESTART</button>
        </div>
    </div>

    <script>
        function sendToUnity(message) {
            Unity.call(message);
        }
        // --- АУДИО ДВИЖОК (Web Audio API) ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new AudioContext();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gainNode = audioCtx.createGain();
            osc.connect(gainNode);
            gainNode.connect(audioCtx.destination);

            if (type === 'slide') {
                // Короткий мягкий "шух" при свайпе
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(150, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.05, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'merge') {
                // Звонкий "поп" при соединении плиток
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(600, audioCtx.currentTime + 0.1);
                gainNode.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gainNode.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'win') {
                // Победный арпеджио
                const notes = [440, 554.37, 659.25, 880];
                notes.forEach((freq, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.type = 'sine';
                    o.frequency.value = freq;
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    g.gain.setValueAtTime(0, audioCtx.currentTime + i * 0.1);
                    g.gain.linearRampToValueAtTime(0.1, audioCtx.currentTime + i * 0.1 + 0.05);
                    g.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + i * 0.1 + 0.3);
                    o.start(audioCtx.currentTime + i * 0.1);
                    o.stop(audioCtx.currentTime + i * 0.1 + 0.3);
                });
            }
        }

        function showInterstitialAd() {
            let payload = { action: "showInterstitial" };
            Unity.call(JSON.stringify(payload));
        }

        function showRewardedAd() {
            let payload = { action: "showRewarded" };
            Unity.call(JSON.stringify(payload));
        }

        function closeGame() {
            let payload = { action: "close" };
            Unity.call(JSON.stringify(payload));
        }

        function goBack() {
            showInterstitialAd();
            closeGame();
        }

        // --- ЛОГИКА ТЕМЫ ---
        function toggleTheme() {
            const html = document.documentElement;
            const isDark = html.getAttribute('data-theme') === 'dark';
            const newTheme = isDark ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('brainGamesTheme', newTheme);
            updateThemeIcons(newTheme);
            playSound('merge');
        }

        function updateThemeIcons(theme) {
            document.getElementById('moonIcon').style.display = theme === 'dark' ? 'none' : 'block';
            document.getElementById('sunIcon').style.display = theme === 'dark' ? 'block' : 'none';
        }

        // Инициализация темы при загрузке
        const savedTheme = localStorage.getItem('brainGamesTheme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeIcons(savedTheme);


        // --- ЛОГИКА ИГРЫ 2048 ---
        const SIZE = 4;
        let board = [];
        let score = 0;
        let bestScore = 0;
        let hasWon = false;
        let isAnimating = false;
        let tileIdCounter = 0;
        let undoUsed = false;
        let history = null; // { board, score } — состояние до последнего хода

        const BEST_KEY = 'brainGames_2048_best';

        function loadBestScore() {
            try {
                const v = localStorage.getItem(BEST_KEY);
                if (v !== null) bestScore = parseInt(v, 10) || 0;
            } catch (_) { bestScore = 0; }
            document.getElementById('bestDisplay').innerText = bestScore;
        }

        function updateScore() {
            document.getElementById('scoreDisplay').innerText = score;
            if (score > bestScore) {
                bestScore = score;
                document.getElementById('bestDisplay').innerText = bestScore;
                try { localStorage.setItem(BEST_KEY, bestScore); } catch (_) { }
            }
        }

        // Читаем реальные позиции grid-ячеек из DOM (через getBoundingClientRect)
        // так позиции плиток гарантированно совпадают с сеткой при любом масштабе
        function getCellRects() {
            const container = document.getElementById('tileContainer');
            const gridCells = document.querySelectorAll('.board-grid .grid-cell');
            const containerRect = container.getBoundingClientRect();
            const rects = [];
            for (let i = 0; i < gridCells.length; i++) {
                const cr = gridCells[i].getBoundingClientRect();
                rects.push({
                    top: cr.top - containerRect.top,
                    left: cr.left - containerRect.left,
                    width: cr.width,
                    height: cr.height
                });
            }
            return rects; // 16 элементов, row-major
        }

        function initBoard() {
            board = [];
            for (let r = 0; r < SIZE; r++) {
                board[r] = [];
                for (let c = 0; c < SIZE; c++) {
                    board[r][c] = null;
                }
            }
            score = 0;
            hasWon = false;
            undoUsed = false;
            history = null;
            updateScore();
            document.getElementById('undoBtn').disabled = true;
            document.getElementById('tileContainer').innerHTML = '';
            addRandomTile();
            addRandomTile();
            renderBoard();
        }

        function addRandomTile() {
            let emptyCells = [];
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (board[r][c] === null) {
                        emptyCells.push({ r, c });
                    }
                }
            }
            if (emptyCells.length > 0) {
                let randomCell = emptyCells[Math.floor(Math.random() * emptyCells.length)];
                board[randomCell.r][randomCell.c] = {
                    id: tileIdCounter++,
                    val: Math.random() < 0.9 ? 2 : 4,
                    r: randomCell.r,
                    c: randomCell.c,
                    isNew: true
                };
            }
        }

        function renderBoard() {
            const container = document.getElementById('tileContainer');
            const rects = getCellRects();

            // Отрисовываем текущее состояние
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    let tile = board[r][c];
                    if (tile) {
                        let el = document.getElementById('tile-' + tile.id);
                        const idx = r * SIZE + c;
                        const cell = rects[idx];
                        if (!el) {
                            // Создаем новую плитку
                            el = document.createElement('div');
                            el.id = 'tile-' + tile.id;
                            el.className = `tile t-${tile.val > 2048 ? 'super' : tile.val}`;
                            if (tile.isNew) el.classList.add('new');
                            if (tile.isMerged) el.classList.add('merged');
                            el.innerText = tile.val;
                            el.style.width = cell.width + 'px';
                            el.style.height = cell.height + 'px';
                            container.appendChild(el);

                            // Сброс флагов анимации для следующих кадров
                            tile.isNew = false;
                            tile.isMerged = false;
                        } else {
                            // Обновляем позицию, значение и цвет существующей
                            if (tile.isMerged) {
                                // При слиянии: только двигаем, цвет/значение — после анимации
                                tile.isMerged = false;
                                el.classList.remove('new');
                            } else {
                                el.className = `tile t-${tile.val > 2048 ? 'super' : tile.val}`;
                                el.classList.remove('merged', 'new');
                                el.innerText = tile.val;
                            }
                            el.style.width = cell.width + 'px';
                            el.style.height = cell.height + 'px';
                        }

                        // Позиция — точные координаты grid-ячейки
                        el.style.top = cell.top + 'px';
                        el.style.left = cell.left + 'px';
                    }
                }
            }
        }

        function slide(row) {
            // Удаляем null
            let arr = row.filter(val => val !== null);
            // Сливаем одинаковые
            let merged = false;
            let removedTiles = [];
            for (let i = 0; i < arr.length - 1; i++) {
                if (arr[i].val === arr[i + 1].val) {
                    arr[i].val *= 2;
                    score += arr[i].val;
                    arr[i].isMerged = true;

                    // Сохраняем id удаляемой плитки и к какой она присоединяется
                    removedTiles.push({ removedId: arr[i + 1].id, mergedIntoId: arr[i].id });

                    arr.splice(i + 1, 1);
                    merged = true;

                    if (arr[i].val === 2048 && !hasWon) {
                        triggerWin();
                    }
                }
            }
            // Дополняем нулями
            while (arr.length < SIZE) {
                arr.push(null);
            }
            return { newRow: arr, merged, removedTiles };
        }

        function move(direction) {
            if (isAnimating) return;
            initAudio();

            // Снимок до хода — для отмены
            const prevBoard = JSON.parse(JSON.stringify(board));
            const prevScore = score;

            let hasMoved = false;
            let hasMerged = false;
            let newBoard = JSON.parse(JSON.stringify(board)); // глубокая копия для проверки изменений
            let allRemovedTiles = [];

            for (let i = 0; i < SIZE; i++) {
                let row = [];
                // Формируем ряд/колонку для сдвига
                for (let j = 0; j < SIZE; j++) {
                    if (direction === 'LEFT') row.push(board[i][j]);
                    if (direction === 'RIGHT') row.push(board[i][SIZE - 1 - j]);
                    if (direction === 'UP') row.push(board[j][i]);
                    if (direction === 'DOWN') row.push(board[SIZE - 1 - j][i]);
                }

                let result = slide(row);
                let newRow = result.newRow;
                if (result.merged) hasMerged = true;
                allRemovedTiles.push(...result.removedTiles);

                // Записываем обратно с обновлением координат (r, c)
                for (let j = 0; j < SIZE; j++) {
                    let tile = newRow[j];
                    let r, c;

                    if (direction === 'LEFT') { r = i; c = j; }
                    if (direction === 'RIGHT') { r = i; c = SIZE - 1 - j; }
                    if (direction === 'UP') { r = j; c = i; }
                    if (direction === 'DOWN') { r = SIZE - 1 - j; c = i; }

                    if (tile) {
                        // Если позиция изменилась, фиксируем движение
                        if (tile.r !== r || tile.c !== c) hasMoved = true;
                        tile.r = r;
                        tile.c = c;

                        // Прописываем конечные координаты для плитки, которая вливается в текущую
                        let removed = allRemovedTiles.find(rt => rt.mergedIntoId === tile.id);
                        if (removed) {
                            removed.r = r;
                            removed.c = c;
                        }
                    }
                    board[r][c] = tile;
                }
            }

            if (hasMoved || hasMerged) {
                // Сохраняем историю для отмены (один раз за игру)
                history = { board: prevBoard, score: prevScore };
                if (!undoUsed) {
                    document.getElementById('undoBtn').disabled = false;
                }

                isAnimating = true;
                updateScore();

                // Анимируем удаляемые плитки к их новой позиции
                const rects = getCellRects();
                allRemovedTiles.forEach(rt => {
                    let el = document.getElementById('tile-' + rt.removedId);
                    if (el) {
                        const idx = rt.r * SIZE + rt.c;
                        const cell = rects[idx];
                        el.style.top = cell.top + 'px';
                        el.style.left = cell.left + 'px';
                        el.style.width = cell.width + 'px';
                        el.style.height = cell.height + 'px';
                        el.classList.add('to-remove');
                        el.style.zIndex = '0'; // Прячем под основную плитку
                    }
                });

                renderBoard();

                if (hasMerged) playSound('merge');
                else playSound('slide');

                setTimeout(() => {
                    const elementsToRemove = document.querySelectorAll('.tile.to-remove');
                    elementsToRemove.forEach(el => el.remove());

                    addRandomTile();
                    renderBoard();
                    isAnimating = false;
                    checkGameOver();
                }, 150);
            }
        }

        function checkGameOver() {
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (board[r][c] === null) return;
                }
            }
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    let val = board[r][c].val;
                    if (r < SIZE - 1 && board[r + 1][c].val === val) return;
                    if (c < SIZE - 1 && board[r][c + 1].val === val) return;
                }
            }
            showInterstitialAd();
            showModal("You Lost", "");
        }

        function triggerWin() {
            hasWon = true;
            playSound('win');
            const boardEl = document.querySelector('.board-bg');
            const boardSz = boardEl ? boardEl.getBoundingClientRect().width : 400;
            confetti({
                particleCount: Math.round(boardSz * 0.35),
                spread: Math.round(boardSz * 0.16),
                origin: { y: 0.6 },
                colors: ['#06D6A0', '#FFD166', '#EF476F', '#118AB2']
            });
            setTimeout(() => {
                showInterstitialAd();
            }, 1000);
            showModal("You Win!", "");
        }

        function showModal(title, desc) {
            document.getElementById('modalTitle').innerText = title;
            document.getElementById('modalDesc').innerText = desc;
            document.getElementById('modalOverlay').classList.add('active');
        }

        function restartGame() {
            document.getElementById('modalOverlay').classList.remove('active');
            initAudio();
            initBoard();
        }

        function undoMove() {
            if (isAnimating || undoUsed || !history) return;
            initAudio();

            // Восстанавливаем доску и счёт
            board = history.board;
            score = history.score;
            undoUsed = true;
            history = null;

            document.getElementById('undoBtn').disabled = true;
            updateScore();

            // Пересоздаём все плитки заново
            const container = document.getElementById('tileContainer');
            container.innerHTML = '';
            tileIdCounter = 0;
            // Переназначаем id чтобы избежать конфликтов
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    if (board[r][c]) {
                        board[r][c].id = tileIdCounter++;
                        board[r][c].isNew = false;
                        board[r][c].isMerged = false;
                    }
                }
            }
            renderBoard();
        }

        // --- УПРАВЛЕНИЕ (Клавиатура и Свайпы) ---
        document.addEventListener('keydown', (e) => {
            if (e.key === 'ArrowUp') move('UP');
            if (e.key === 'ArrowDown') move('DOWN');
            if (e.key === 'ArrowLeft') move('LEFT');
            if (e.key === 'ArrowRight') move('RIGHT');

            // Предотвращение прокрутки окна стрелками
            if (["ArrowUp", "ArrowDown", "ArrowLeft", "ArrowRight"].indexOf(e.code) > -1) {
                e.preventDefault();
            }
        });

        let touchStartX = 0;
        let touchStartY = 0;

        const touchArea = document.getElementById('touchArea');

        touchArea.addEventListener('touchstart', (e) => {
            touchStartX = e.changedTouches[0].screenX;
            touchStartY = e.changedTouches[0].screenY;
            e.preventDefault(); // Убираем стандартные жесты браузера на доске
        }, { passive: false });

        touchArea.addEventListener('touchend', (e) => {
            if (isAnimating) return;
            let touchEndX = e.changedTouches[0].screenX;
            let touchEndY = e.changedTouches[0].screenY;

            let dx = touchEndX - touchStartX;
            let dy = touchEndY - touchStartY;

            // Защита от случайных кликов (свайп должен быть больше 30px)
            if (Math.abs(dx) > 30 || Math.abs(dy) > 30) {
                if (Math.abs(dx) > Math.abs(dy)) {
                    if (dx > 0) move('RIGHT');
                    else move('LEFT');
                } else {
                    if (dy > 0) move('DOWN');
                    else move('UP');
                }
            }
        }, { passive: false });

        // Перерасчёт плиток при ресайзе / повороте
        let resizeTimer;
        window.addEventListener('resize', () => {
            clearTimeout(resizeTimer);
            resizeTimer = setTimeout(() => {
                if (!isAnimating) renderBoard();
            }, 150);
        });

        window.onload = () => {
            loadBestScore();
            initBoard();
        };

    </script>
</body>
