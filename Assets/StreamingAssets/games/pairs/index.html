<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Pairs - Brain Games</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-color: #F8F9FA;
            --text-color: #1C2331;
            --text-secondary: #7A8294;
            --board-bg: #E8ECEF;
            --btn-bg: #E2E6EB;
            --btn-shadow: rgba(0,0,0,0.05);
            --primary: #06D6A0;
            --card-cover-bg: #A2C4C9;
            --card-cover-shadow: #8AB4B9;
            --card-face-bg: #FFFFFF;
            --icon-color: #FFFFFF;

            /* fallback */
            --margin: 16px;
            --gap: 12px;
            --header-h: 64px;
            --board-size: 320px;
            --btn-size: 44px;
            --icon-size: 22px;
            --title-size: 22px;
            --board-padding: 10px;
            --board-radius: 20px;
            --card-radius: 10px;
            --modal-padding: 24px;
            --modal-radius: 18px;
            --modal-title-size: 24px;
            --modal-text-size: 16px;
            --modal-btn-size: 18px;
        }

        [data-theme="dark"] {
            --bg-color: #12151A;
            --text-color: #E8ECEF;
            --text-secondary: #A0AABF;
            --board-bg: #1E252D;
            --btn-bg: #1E252D;
            --btn-shadow: rgba(0,0,0,0.3);
            --primary: #059669;
            --card-cover-bg: #52757C;
            --card-cover-shadow: #3E5A60;
            --card-face-bg: #2C3540;
            --icon-color: #E8ECEF;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body { width: 100%; height: 100%; }

        body {
            font-family: 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .app-container {
            position: fixed;
            inset: 0;
            padding-top: calc(var(--margin) + env(safe-area-inset-top, 0px));
            padding-bottom: calc(var(--margin) + env(safe-area-inset-bottom, 0px));
            padding-left: calc(var(--margin) + env(safe-area-inset-left, 0px));
            padding-right: calc(var(--margin) + env(safe-area-inset-right, 0px));
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--gap);
        }

        /* Header */
        .header {
            width: 100%;
            max-width: calc(var(--board-size) + 2px);
            height: var(--header-h);
            flex: 0 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            position: relative;
        }

        .back-btn {
            width: var(--btn-size); height: var(--btn-size); min-width: var(--btn-size);
            border-radius: 50%; background-color: var(--btn-bg);
            box-shadow: 0 4px 12px var(--btn-shadow);
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; border: none; outline: none; color: var(--text-color);
            transition: transform 0.1s, background-color 0.3s;
        }
        .back-btn:active { transform: scale(0.9); }
        .back-btn svg { width: var(--icon-size); height: var(--icon-size); }

        .header-title {
            position: absolute; left: 50%; transform: translateX(-50%);
            max-width: calc(100% - var(--btn-size) * 2 - 40px);
            font-size: var(--title-size); font-weight: 900; letter-spacing: 2px;
            line-height: 1; color: var(--text-color);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none;
        }

        .header-right { display: flex; align-items: center; gap: 6px; }

        .theme-toggle {
            width: var(--btn-size); height: var(--btn-size); min-width: var(--btn-size);
            border-radius: 50%; background-color: var(--btn-bg);
            box-shadow: 0 4px 12px var(--btn-shadow);
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; border: none; outline: none; color: var(--text-color);
            transition: transform 0.1s, background-color 0.3s;
        }
        .theme-toggle:active { transform: scale(0.9); }
        .theme-toggle svg { width: var(--icon-size); height: var(--icon-size); color: var(--text-color); }

        /* Game area */
        .game-area {
            flex: 1 1 auto; width: 100%;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            min-height: 0;
        }

        /* Board */
        .board-bg {
            background-color: var(--board-bg);
            border-radius: var(--board-radius);
            padding: var(--board-padding);
            box-shadow: inset 0 4px 10px var(--btn-shadow);
            width: var(--board-size); height: var(--board-size);
            flex: 0 0 auto;
        }

        .board {
            width: 100%; height: 100%;
            display: grid;
            grid-template-columns: repeat(var(--grid-cols), 1fr);
            grid-template-rows: repeat(var(--grid-rows), 1fr);
            gap: var(--card-gap);
        }

        /* Cards */
        .card { perspective: 1000px; cursor: pointer; width: 100%; height: 100%; padding: 2px; }
        .card-inner {
            position: relative; width: 100%; height: 100%;
            transition: transform 0.5s cubic-bezier(0.4, 0.0, 0.2, 1);
            transform-style: preserve-3d;
        }
        .card.flipped .card-inner, .card.matched .card-inner { transform: rotateY(180deg); }
        .card.matched .card-face { opacity: 0.8; transform: rotateY(180deg) scale(0.95); transition: transform 0.3s, opacity 0.3s; }

        .card-cover, .card-face {
            position: absolute; width: 100%; height: 100%;
            backface-visibility: hidden; border-radius: var(--card-radius);
            display: flex; align-items: center; justify-content: center;
            
        }

        .card-cover {
            background-color: var(--card-cover-bg);
            box-shadow: 0 0x 0 var(--card-cover-shadow);
        }
        .card-cover svg { width: 45%; height: 45%; fill: var(--icon-color); opacity: 0.8; }

        .card-face {
            background-color: var(--card-face-bg);
            box-shadow: 0 4px 0 rgba(0,0,0,0.1);
            transform: rotateY(180deg);
        }

        /* Modal */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6); backdrop-filter: blur(5px);
            display: flex; justify-content: center; align-items: center;
            opacity: 0; pointer-events: none; transition: opacity 0.3s; z-index: 100;
        }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }

        .modal-content {
            background: var(--bg-color); padding: var(--modal-padding);
            border-radius: var(--modal-radius); text-align: center;
            transform: translateY(50px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 20px 40px rgba(0,0,0,0.2); max-width: 90%;
        }
        .modal-overlay.active .modal-content { transform: translateY(0); }

        .modal-content h2 { font-size: var(--modal-title-size); margin-bottom: 10px; color: var(--text-color); }
        .modal-content p { color: var(--text-secondary); margin-bottom: 25px; font-size: var(--modal-text-size); }

        .play-btn {
            background: var(--primary); color: white; border: none;
            padding: var(--modal-padding) calc(var(--modal-padding) * 2);
            font-size: var(--modal-btn-size); font-weight: 800;
            border-radius: var(--modal-radius); cursor: pointer;
            transition: transform 0.1s; width: 100%;
        }
        .play-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <button class="back-btn" onclick="goBack()" title="Back">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <span class="header-title">Pairs</span>
        <div class="header-right">
            <button class="theme-toggle" id="themeBtn" title="Change theme">
                <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                <svg id="sunIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </button>
        </div>
    </div>

    <div class="game-area">
        <div class="board-bg">
            <div class="board" id="board"></div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="modal">
    <div class="modal-content">
        <h2 id="modalTitle">Brilliant!</h2>
        <p id="modalDesc">Level 1 completed</p>
        <button class="play-btn" id="modalBtn">Next Level</button>
    </div>
</div>

<script>
    // ================================================================
    // АДАПТИВНАЯ ВЁРСТКА
    // ================================================================
    const LAYOUT_CFG = {
        portrait: {
            marginRatio: 0.025, gapRatio: 0.018, headerRatio: 0.075,
            headerMinRatio: 0.05, headerMaxRatio: 0.10,
        },
        landscape: {
            marginRatio: 0.035, gapRatio: 0.03, headerRatio: 0.12,
            headerMinRatio: 0.06, headerMaxRatio: 0.14,
        }
    };

    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

    let safeInsetsCache = { top: 0, bottom: 0, left: 0, right: 0 };
    (function measureSafeInsets() {
        const probe = document.createElement('div');
        probe.style.cssText = 'position:fixed;top:0;left:0;width:0;height:0;' +
            'padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);' +
            'padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);visibility:hidden;';
        document.body.appendChild(probe);
        const cs = getComputedStyle(probe);
        safeInsetsCache = {
            top: parseFloat(cs.paddingTop) || 0, bottom: parseFloat(cs.paddingBottom) || 0,
            left: parseFloat(cs.paddingLeft) || 0, right: parseFloat(cs.paddingRight) || 0
        };
        probe.remove();
    })();

    function calcLayout() {
        const insets = safeInsetsCache;
        const availW = window.innerWidth - insets.left - insets.right;
        const availH = window.innerHeight - insets.top - insets.bottom;
        const isPortrait = availH >= availW;
        const cfg = isPortrait ? LAYOUT_CFG.portrait : LAYOUT_CFG.landscape;

        const margin = Math.round(availH * cfg.marginRatio);
        const gap = Math.round(availH * cfg.gapRatio);
        const headerH = Math.round(clamp(availH * cfg.headerRatio, availH * cfg.headerMinRatio, availH * cfg.headerMaxRatio));

        const usableH = availH - margin * 2 - headerH - gap;
        const usableW = availW - margin * 2;
        const boardSize = Math.max(180, Math.floor(Math.min(usableH, usableW)));

        return { margin, gap, headerH, boardSize };
    }

    function applyLayout() {
        const L = calcLayout();
        const root = document.documentElement;

        root.style.setProperty('--margin', L.margin + 'px');
        root.style.setProperty('--gap', L.gap + 'px');
        root.style.setProperty('--header-h', L.headerH + 'px');
        root.style.setProperty('--board-size', L.boardSize + 'px');

        root.style.setProperty('--btn-size', Math.round(L.headerH * 0.68) + 'px');
        root.style.setProperty('--icon-size', Math.round(L.headerH * 0.36) + 'px');
        root.style.setProperty('--title-size', Math.round(L.headerH * 0.34) + 'px');

        root.style.setProperty('--board-padding', Math.round(L.boardSize * 0.025) + 'px');
        root.style.setProperty('--board-radius', Math.round(L.boardSize * 0.06) + 'px');
        root.style.setProperty('--card-gap', Math.max(2, Math.round(L.boardSize * 0.015)) + 'px');
        root.style.setProperty('--card-radius', Math.round(L.boardSize * 0.025) + 'px');

        root.style.setProperty('--modal-padding', Math.round(L.boardSize * 0.07) + 'px');
        root.style.setProperty('--modal-radius', Math.round(L.boardSize * 0.05) + 'px');
        root.style.setProperty('--modal-title-size', Math.round(L.boardSize * 0.065) + 'px');
        root.style.setProperty('--modal-text-size', Math.round(L.boardSize * 0.04) + 'px');
        root.style.setProperty('--modal-btn-size', Math.round(L.boardSize * 0.042) + 'px');
    }

    applyLayout();
    window.addEventListener('resize', applyLayout);

    // ================================================================
    // ТЕМЫ
    // ================================================================
    const themeBtn = document.getElementById('themeBtn');
    const moonIcon = document.getElementById('moonIcon');
    const sunIcon = document.getElementById('sunIcon');
    let currentTheme = localStorage.getItem('brainGamesTheme') || 'light';

    function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        moonIcon.style.display = theme === 'dark' ? 'none' : '';
        sunIcon.style.display = theme === 'dark' ? '' : 'none';
        localStorage.setItem('brainGamesTheme', theme);
    }
    applyTheme(currentTheme);

    themeBtn.addEventListener('click', () => {
        currentTheme = currentTheme === 'light' ? 'dark' : 'light';
        applyTheme(currentTheme);
    });

    // ================================================================
    // АУДИО
    // ================================================================
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function initAudio() {
        if (!audioCtx) audioCtx = new AudioContext();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;
        if (type === 'click') {
            const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
            o.type = 'sine'; o.frequency.setValueAtTime(400, now);
            o.frequency.exponentialRampToValueAtTime(600, now + 0.1);
            g.gain.setValueAtTime(0.15, now); g.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(now); o.stop(now + 0.1);
        } else if (type === 'match') {
            const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
            o.type = 'triangle'; o.frequency.setValueAtTime(600, now);
            o.frequency.setValueAtTime(800, now + 0.1);
            g.gain.setValueAtTime(0.12, now); g.gain.linearRampToValueAtTime(0, now + 0.3);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(now); o.stop(now + 0.3);
        } else if (type === 'error') {
            const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
            o.type = 'triangle'; o.frequency.setValueAtTime(300, now);
            o.frequency.exponentialRampToValueAtTime(200, now + 0.2);
            g.gain.setValueAtTime(0.08, now); g.gain.linearRampToValueAtTime(0, now + 0.2);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(now); o.stop(now + 0.2);
        } else if (type === 'win') {
            const notes = [440, 554.37, 659.25, 880];
            notes.forEach((freq, i) => {
                const o = audioCtx.createOscillator(); const g = audioCtx.createGain();
                o.type = 'sine'; o.frequency.value = freq;
                o.connect(g); g.connect(audioCtx.destination);
                g.gain.setValueAtTime(0, now + i * 0.1);
                g.gain.linearRampToValueAtTime(0.1, now + i * 0.1 + 0.05);
                g.gain.exponentialRampToValueAtTime(0.001, now + i * 0.1 + 0.5);
                o.start(now + i * 0.1); o.stop(now + i * 0.1 + 0.5);
            });
        }
    }

    document.addEventListener('pointerdown', initAudio, { once: true });

    // ================================================================
    // ИГРА
    // ================================================================
    const board = document.getElementById('board');
    const modal = document.getElementById('modal');
    const modalTitle = document.getElementById('modalTitle');
    const modalDesc = document.getElementById('modalDesc');
    const modalBtn = document.getElementById('modalBtn');

    let currentLevel = 1;
    let flippedCards = [];
    let matchedPairs = 0;
    let isLocked = false;
    let totalPairs = 0;

    const premiumIcons = [
        '🍎','🍌','🍉','🍇','🍓','🍒','🍑','🍍',
        '🥝','🍅','🍆','🥑','🍔','🍕','🍟','🍩',
        '🍦','🍭','🍬','🍫','🍿','🎈','🎁','🧸',
        '🚗','🚀','🚁','⛵','⛺','🏝️','🌟','💎'
    ];

    function getLevelConfig(level) {
        const stageIndex = Math.floor((level - 1) / 3);
        const stages = [
            { cols: 2, rows: 2, pairs: 2 },
            { cols: 3, rows: 4, pairs: 6 },
            { cols: 4, rows: 4, pairs: 8 },
            { cols: 5, rows: 4, pairs: 10 },
            { cols: 6, rows: 6, pairs: 18 },
            { cols: 8, rows: 6, pairs: 24 },
            { cols: 8, rows: 8, pairs: 32 }
        ];
        return stages[Math.min(stageIndex, stages.length - 1)];
    }

    function generateDeck(pairsCount) {
        let availableIcons = premiumIcons.slice(0, pairsCount);
        let deck = [...availableIcons, ...availableIcons];
        for (let i = deck.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [deck[i], deck[j]] = [deck[j], deck[i]];
        }
        return deck;
    }

    function initGame() {
        const config = getLevelConfig(currentLevel);
        board.style.setProperty('--grid-cols', config.cols);
        board.style.setProperty('--grid-rows', config.rows);
        totalPairs = config.pairs;
        matchedPairs = 0;
        flippedCards = [];
        isLocked = false;

        const deck = generateDeck(totalPairs);
        board.innerHTML = '';

        deck.forEach((iconData) => {
            const card = document.createElement('div');
            card.className = 'card';
            card.dataset.icon = iconData;
            card.innerHTML = `
                <div class="card-inner">
                    <div class="card-cover">
                        <svg viewBox="0 0 100 100">
                            <polygon points="50,20 60,40 82,40 64,55 71,78 50,65 29,78 36,55 18,40 40,40"/>
                        </svg>
                    </div>
                    <div class="card-face">
                        <svg viewBox="0 0 100 100">
                            <text x="50" y="55" font-size="65" text-anchor="middle" dominant-baseline="middle">${iconData}</text>
                        </svg>
                    </div>
                </div>`;
            card.addEventListener('click', () => flipCard(card));
            board.appendChild(card);
        });
    }

    function flipCard(card) {
        if (isLocked) return;
        if (card.classList.contains('flipped') || card.classList.contains('matched')) return;
        initAudio();
        card.classList.add('flipped');
        playSound('click');
        flippedCards.push(card);
        if (flippedCards.length === 2) { isLocked = true; checkMatch(); }
    }

    function checkMatch() {
        const [card1, card2] = flippedCards;
        const isMatch = card1.dataset.icon === card2.dataset.icon;
        if (isMatch) {
            matchedPairs++;
            playSound('match');
            card1.classList.add('matched');
            card2.classList.add('matched');
            flippedCards = [];
            isLocked = false;
            if (matchedPairs === totalPairs) setTimeout(handleWin, 500);
        } else {
            playSound('error');
            setTimeout(() => {
                card1.classList.remove('flipped');
                card2.classList.remove('flipped');
                flippedCards = [];
                isLocked = false;
            }, 800);
        }
    }

    function handleWin() {
        playSound('win');
        const duration = 2000;
        const end = Date.now() + duration;
        (function frame() {
            confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: ['#A8D5BA','#A2C4C9','#F4D068','#F2A6A6','#C8B8D8'] });
            confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: ['#A8D5BA','#A2C4C9','#F4D068','#F2A6A6','#C8B8D8'] });
            if (Date.now() < end) requestAnimationFrame(frame);
        }());
        setTimeout(() => {
            modalTitle.innerText = "Brilliant!";
            modalDesc.innerText = `Level ${currentLevel} completed!`;
            modalBtn.innerText = "Next Level";
            modal.classList.add('active');
        }, 800);
    }

    modalBtn.addEventListener('click', () => {
        modal.classList.remove('active');
        currentLevel++;
        setTimeout(initGame, 300);
    });

    initGame();
</script>
</body>
</html>
