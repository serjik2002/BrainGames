<!DOCTYPE html>
<html lang="uk" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Snake - Brain Games</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@600;800&display=swap');

        :root {
            --bg-color: #F8F9FA;
            --text-color: #1C2331;
            --board-bg: #E9ECEF;
            --board-bg-alt: #DEE2E6;
            --border-color: #CED4DA;
            --primary: #06D6A0;
            --food: #EF476F;
            --shadow: rgba(0,0,0,0.1);

            /* Adaptive layout */
            --margin: 16px;
            --gap: 12px;
            --header-h: 64px;
            --board-size: 320px;
            --btn-size: 44px;
            --icon-size: 22px;
            --title-size: 22px;
            --score-size: 16px;
        }

        [data-theme="dark"] {
            --bg-color: #1a202c;
            --text-color: #f7fafc;
            --board-bg: #2d3748;
            --board-bg-alt: #252d3b;
            --border-color: #4A5568;
            --primary: #05b586;
            --food: #d63d60;
            --shadow: rgba(0,0,0,0.3);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        .app-container {
            position: fixed;
            inset: 0;
            padding-top: calc(var(--margin) + env(safe-area-inset-top, 0px));
            padding-bottom: calc(var(--margin) + env(safe-area-inset-bottom, 0px));
            padding-left: calc(var(--margin) + env(safe-area-inset-left, 0px));
            padding-right: calc(var(--margin) + env(safe-area-inset-right, 0px));
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--gap);
        }

        /* ── Header ── */
        .header {
            width: 100%;
            max-width: calc(var(--board-size) + 2px);
            height: var(--header-h);
            flex: 0 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            position: relative;
        }

        .back-btn {
            width: var(--btn-size); height: var(--btn-size); min-width: var(--btn-size);
            border-radius: 50%; background-color: var(--board-bg);
            box-shadow: 0 4px 12px var(--shadow);
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; border: none; outline: none; color: var(--text-color);
            transition: transform 0.1s, background-color 0.3s;
        }
        .back-btn:active { transform: scale(0.9); }
        .back-btn svg { width: var(--icon-size); height: var(--icon-size); }

        .header-title {
            position: absolute; left: 50%; transform: translateX(-50%);
            max-width: calc(100% - var(--btn-size) * 2 - 40px);
            font-size: var(--title-size); font-weight: 800; letter-spacing: 1px;
            line-height: 1; color: var(--text-color);
            white-space: nowrap; overflow: hidden; text-overflow: ellipsis; pointer-events: none;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .theme-toggle {
            width: var(--btn-size); height: var(--btn-size); min-width: var(--btn-size);
            border-radius: 50%; background-color: var(--board-bg);
            box-shadow: 0 4px 12px var(--shadow);
            display: flex; justify-content: center; align-items: center;
            cursor: pointer; border: none; outline: none; color: var(--text-color);
            transition: transform 0.1s, background-color 0.3s;
        }
        .theme-toggle:active { transform: scale(0.9); }
        .theme-toggle svg { width: var(--icon-size); height: var(--icon-size); color: var(--text-color); }

        .title {
            font-size: 28px;
            font-weight: 800;
            margin-bottom: 15px;
            text-align: center;
        }

        .board-wrapper {
            width: 100%;
            aspect-ratio: 1;
            background-color: var(--board-bg);
            border-radius: 12px;
            padding: 6px; /* Рамка */
            background: var(--border-color); /* Колір рамки */
            box-shadow: 0 10px 20px var(--shadow);
            position: relative;
        }

        canvas {
            width: 100%;
            height: 100%;
            background-color: var(--board-bg);
            border-radius: 6px;
            display: block;
        }

        .modal {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            z-index: 100;
        }

        .modal.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: var(--bg-color);
            padding: 30px;
            border-radius: 24px;
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transform: translateY(20px);
            transition: transform 0.3s;
        }

        .modal.active .modal-content {
            transform: translateY(0);
        }

        .modal h2 { margin-bottom: 15px; font-size: 26px; }
        
        .btn {
            background: var(--primary);
            color: #fff;
            border: none;
            padding: 15px 30px;
            border-radius: 16px;
            font-size: 18px;
            font-weight: 800;
            cursor: pointer;
            box-shadow: 0 6px 0 rgba(0,0,0,0.15);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 rgba(0,0,0,0.15);
        }

        /* D-Pad Джойстик для телефону */
        .controls {
            margin-top: 25px;
            display: grid;
            grid-template-columns: repeat(3, 65px);
            grid-template-rows: repeat(3, 65px);
            gap: 12px;
            justify-content: center;
        }

        .ctrl-btn {
            background: var(--board-bg);
            border: 2px solid var(--border-color);
            border-radius: 16px;
            font-size: 24px;
            color: var(--text-color);
            box-shadow: 0 6px 0 var(--border-color);
            cursor: pointer;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .ctrl-btn:active {
            transform: translateY(6px);
            box-shadow: 0 0px 0 var(--border-color);
        }

        #btnUp { grid-column: 2; grid-row: 1; }
        #btnLeft { grid-column: 1; grid-row: 2; }
        #btnDown { grid-column: 2; grid-row: 3; }
        #btnRight { grid-column: 3; grid-row: 2; }

    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <button class="back-btn" onclick="goBack()" title="Back">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <span class="header-title">Змійка</span>
        <div class="header-right">
            <!-- <div class="score-box"><span>★</span> <div id="highScore">0</div></div> -->
            <button class="theme-toggle" id="themeBtn" title="Change theme">
                <svg id="sunIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            </button>
        </div>
    </div>

    <div class="board-wrapper">
        <canvas id="gameCanvas" width="400" height="400"></canvas>
        <div class="modal" id="gameOverModal">
            <div class="modal-content">
                <h2 id="modalTitle" style="color: var(--food);">Поразка!</h2>
                <p style="margin-bottom: 5px; font-size: 18px;">Рахунок: <strong id="finalScore" style="font-size: 22px;">0</strong></p>
                <p id="newRecordBadge" style="display: none; color: var(--primary); font-size: 16px; font-weight: 800; margin-bottom: 15px;">Новий рекорд! 🏆</p>
                <button class="btn" id="restartBtn" style="margin-top: 10px;">Грати ще</button>
            </div>
        </div>
    </div>

    <!-- Візуальні кнопки управління -->
    <div class="controls">
        <button class="ctrl-btn" id="btnUp">▲</button>
        <button class="ctrl-btn" id="btnLeft">◀</button>
        <button class="ctrl-btn" id="btnDown">▼</button>
        <button class="ctrl-btn" id="btnRight">▶</button>
    </div>
</div>

<script>
    function showInterstitialAd() {
        let payload = { action: "showInterstitial" };
        Unity.call(JSON.stringify(payload));
    }

    function showRewardedAd() {
        let payload = { action: "showRewarded" };
        Unity.call(JSON.stringify(payload));
    }

    function closeGame() {
        let payload = { action: "close" };
        Unity.call(JSON.stringify(payload));
    }

    function goBack() {
        closeGame();
    }

    // ── Adaptive Layout ──
    let safeInsetsCache = { top: 0, bottom: 0, left: 0, right: 0 };
    (function measureSafeInsets() {
        const probe = document.createElement('div');
        probe.style.cssText = 'position:fixed;top:0;left:0;width:0;height:0;' +
            'padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);' +
            'padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);visibility:hidden;';
        document.body.appendChild(probe);
        const cs = getComputedStyle(probe);
        safeInsetsCache = {
            top: parseFloat(cs.paddingTop) || 0, bottom: parseFloat(cs.paddingBottom) || 0,
            left: parseFloat(cs.paddingLeft) || 0, right: parseFloat(cs.paddingRight) || 0
        };
        probe.remove();
    })();

    function applyLayout() {
        const insets = safeInsetsCache;
        const availW = window.innerWidth - insets.left - insets.right;
        const availH = window.innerHeight - insets.top - insets.bottom;
        const margin = Math.round(availH * 0.025);
        const gap = Math.round(availH * 0.018);
        const headerH = Math.round(Math.min(Math.max(availH * 0.075, availH * 0.05), availH * 0.10));
        const usableH = availH - margin * 2 - headerH - gap;
        const usableW = availW - margin * 2;
        const boardSize = Math.max(180, Math.floor(Math.min(usableH, usableW)));

        const root = document.documentElement;
        root.style.setProperty('--margin', margin + 'px');
        root.style.setProperty('--gap', gap + 'px');
        root.style.setProperty('--header-h', headerH + 'px');
        root.style.setProperty('--board-size', boardSize + 'px');
        root.style.setProperty('--btn-size', Math.round(headerH * 0.68) + 'px');
        root.style.setProperty('--icon-size', Math.round(headerH * 0.36) + 'px');
        root.style.setProperty('--title-size', Math.round(headerH * 0.34) + 'px');
    }
    applyLayout();
    window.addEventListener('resize', applyLayout);

    // ── Theme ──
    const themeBtn = document.getElementById('themeBtn');
    const sunIcon = document.getElementById('sunIcon');
    const moonIcon = document.getElementById('moonIcon');
    let isDark = localStorage.getItem('brainGamesTheme') === 'dark';

    function updateTheme() {
        document.documentElement.setAttribute('data-theme', isDark ? 'dark' : 'light');
        sunIcon.style.display = isDark ? 'block' : 'none';
        moonIcon.style.display = isDark ? 'none' : 'block';
        localStorage.setItem('brainGamesTheme', isDark ? 'dark' : 'light');
    }
    updateTheme();

    themeBtn.addEventListener('click', () => {
        isDark = !isDark;
        updateTheme();
    });

    // Аудіо рушій
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'eat') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(600, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(1200, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start(); osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'win') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(440, audioCtx.currentTime);
            osc.frequency.setValueAtTime(554, audioCtx.currentTime + 0.1);
            osc.frequency.setValueAtTime(659, audioCtx.currentTime + 0.2);
            gain.gain.setValueAtTime(0.5, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.4);
            osc.start(); osc.stop(audioCtx.currentTime + 0.4);
        } else if (type === 'die') {
            // Змінили тип хвилі на більш м'який, щоб не різало слух на колонках
            osc.type = 'triangle'; 
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.3);
            // Зменшили гучність ще сильніше (з 0.15 до 0.05)
            gain.gain.setValueAtTime(0.05, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start(); osc.stop(audioCtx.currentTime + 0.3);
        }
    }

    // Логіка гри
    const canvas = document.getElementById('gameCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = document.getElementById('score');
    const highScoreEl = document.getElementById('highScore');
    const modal = document.getElementById('gameOverModal');
    const finalScoreEl = document.getElementById('finalScore');
    
    const gridSize = 20; // Розмір клітинки
    const tileCount = canvas.width / gridSize; // 20x20 сітка
    
    let snake, food, dx, dy, score, gameLoop, isGameOver;
    let changingDirection = false; // Захист від подвійного кліку (самогубства)
    let highScore = Number(localStorage.getItem('snakeHighScore')) || 0;
    highScoreEl.textContent = highScore;

    function initGame() {
        // Початкова позиція (3 сегменти)
        snake = [{x: 10, y: 10}, {x: 10, y: 11}, {x: 10, y: 12}];
        dx = 0; dy = -1; // Рух вгору
        score = 0;
        scoreEl.textContent = score;
        isGameOver = false;
        changingDirection = false;
        modal.classList.remove('active');
        placeFood();
        if (gameLoop) clearInterval(gameLoop);
        gameLoop = setInterval(update, 150); // Швидкість гри (150мс на крок)
    }

    function placeFood() {
        food = {
            x: Math.floor(Math.random() * tileCount),
            y: Math.floor(Math.random() * tileCount)
        };
        // Перевірка, щоб їжа не з'явилася на самій змійці
        if (snake.some(segment => segment.x === food.x && segment.y === food.y)) {
            placeFood();
        }
    }

    function update() {
        if (isGameOver) return;

        changingDirection = false; // Дозволяємо новий хід у поточному кадрі
        const head = { x: snake[0].x + dx, y: snake[0].y + dy };

        // Зіткнення зі стінами (чіткі межі)
        if (head.x < 0 || head.x >= tileCount || head.y < 0 || head.y >= tileCount) return gameOver();
        // Зіткнення з собою
        if (snake.some(segment => segment.x === head.x && segment.y === head.y)) return gameOver();

        snake.unshift(head);

        // Поїдання яблука
        if (head.x === food.x && head.y === food.y) {
            score++;
            scoreEl.textContent = score;
            playSound('eat');
            placeFood();
        } else {
            snake.pop();
        }

        draw();
    }

    function draw() {
        // Отримуємо кольори для шахівниці
        const color1 = getComputedStyle(document.documentElement).getPropertyValue('--board-bg').trim();
        const color2 = getComputedStyle(document.documentElement).getPropertyValue('--board-bg-alt').trim();

        // Малювання ідеальної шахівниці
        for (let row = 0; row < tileCount; row++) {
            for (let col = 0; col < tileCount; col++) {
                ctx.fillStyle = (row + col) % 2 === 0 ? color1 : color2;
                ctx.fillRect(col * gridSize, row * gridSize, gridSize, gridSize);
            }
        }

        // Малювання їжі
        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--food').trim();
        ctx.beginPath();
        ctx.arc(food.x * gridSize + gridSize/2, food.y * gridSize + gridSize/2, gridSize/2 - 2, 0, Math.PI * 2);
        ctx.fill();

        // Малювання змійки
        ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue('--primary').trim();
        snake.forEach((segment, index) => {
            // Легкий відступ (1px) для красивих сегментів
            ctx.fillRect(segment.x * gridSize + 1, segment.y * gridSize + 1, gridSize - 2, gridSize - 2);
        });
    }

    function gameOver() {
        isGameOver = true;
        clearInterval(gameLoop);
        playSound('die');
        finalScoreEl.textContent = score;
        
        const recordBadge = document.getElementById('newRecordBadge');
        if (score > highScore && score > 0) {
            highScore = score;
            localStorage.setItem('snakeHighScore', highScore);
            highScoreEl.textContent = highScore;
            recordBadge.style.display = 'block'; // Акуратно показуємо бейдж рекорду
        } else {
            recordBadge.style.display = 'none';
        }
        
        showInterstitialAd();
        modal.classList.add('active');
    }

    // УПРАВЛІННЯ (Логіка зміни напрямку)
    function changeDirection(newDx, newDy) {
        if (isGameOver || changingDirection) return;
        
        // Запобігання розвороту на 180 градусів
        const goingUp = dy === -1;
        const goingDown = dy === 1;
        const goingRight = dx === 1;
        const goingLeft = dx === -1;

        if (newDx === 1 && !goingLeft) { dx = 1; dy = 0; changingDirection = true; }
        if (newDx === -1 && !goingRight) { dx = -1; dy = 0; changingDirection = true; }
        if (newDy === -1 && !goingDown) { dx = 0; dy = -1; changingDirection = true; }
        if (newDy === 1 && !goingUp) { dx = 0; dy = 1; changingDirection = true; }
    }

    // Прив'язка екранних кнопок (pointerdown реагує миттєво і на тач, і на мишку)
    const bindBtn = (id, newDx, newDy) => {
        document.getElementById(id).addEventListener('pointerdown', (e) => {
            e.preventDefault(); // Блокуємо скрол
            changeDirection(newDx, newDy);
        });
    };
    bindBtn('btnUp', 0, -1);
    bindBtn('btnDown', 0, 1);
    bindBtn('btnLeft', -1, 0);
    bindBtn('btnRight', 1, 0);

    // Управління клавіатурою (для ПК)
    window.addEventListener('keydown', e => {
        if(isGameOver) return;
        switch (e.key) {
            case 'ArrowUp': changeDirection(0, -1); break;
            case 'ArrowDown': changeDirection(0, 1); break;
            case 'ArrowLeft': changeDirection(-1, 0); break;
            case 'ArrowRight': changeDirection(1, 0); break;
        }
    });

    // Рестарт
    document.getElementById('restartBtn').addEventListener('click', initGame);

    // Перший запуск
    initGame();
</script>
</body>
</html>
