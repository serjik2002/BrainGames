<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Zip - Brain Games</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@700;800;900&display=swap');

        :root {
            --bg-color: #F8F9FA;
            --text-color: #1C2331;
            --board-bg: #E2E8F0;
            --cell-bg: rgba(0, 0, 0, 0.04);
            --node-bg: #FFFFFF;
            --node-text: #1C2331;
            --btn-bg: #E2E6EB;
            --shadow: rgba(0, 0, 0, 0.1);
            --accent: #E83F6F;

            /* Выставляется в JS функцией applyLayout() */
            --margin: 16px;
            --gap: 10px;
            --header-h: 64px;
            --board-size: 340px;
            --btn-size: 44px;
            --icon-size: 22px;
            --title-size: 22px;
            --score-size: 16px;
            --ctrl-btn-size: 18px;
        }

        [data-theme="dark"] {
            --bg-color: #121418;
            --text-color: #F8F9FA;
            --board-bg: #1A1D24;
            --cell-bg: rgba(255, 255, 255, 0.03);
            --node-bg: #FFFFFF;
            --node-text: #1C2331;
            --btn-bg: #2B2F3A;
            --shadow: rgba(0, 0, 0, 0.5);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            user-select: none;
            -webkit-user-select: none;
            -webkit-tap-highlight-color: transparent;
            touch-action: none;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            background: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }

        .app-container {
            position: fixed;
            inset: 0;
            padding-top: calc(var(--margin) + env(safe-area-inset-top, 0px));
            padding-bottom: calc(var(--margin) + env(safe-area-inset-bottom, 0px));
            padding-left: calc(var(--margin) + env(safe-area-inset-left, 0px));
            padding-right: calc(var(--margin) + env(safe-area-inset-right, 0px));
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--gap);
        }

        /* ── Header ── */
        .header {
            width: 100%;
            max-width: calc(var(--board-size) + 2px);
            height: var(--header-h);
            flex: 0 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            position: relative;
        }

        .back-btn {
            width: var(--btn-size);
            height: var(--btn-size);
            min-width: var(--btn-size);
            border-radius: 50%;
            border: none;
            background: var(--btn-bg);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 12px var(--shadow);
            transition: transform 0.1s, background 0.3s;
            -webkit-tap-highlight-color: transparent;
        }

        .back-btn:active { transform: scale(0.9); }

        .back-btn svg {
            width: var(--icon-size);
            height: var(--icon-size);
        }

        .header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: var(--title-size);
            font-weight: 800;
            letter-spacing: 2px;
            line-height: 1;
            color: var(--text-color);
            white-space: nowrap;
            pointer-events: none;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .score-panel {
            display: flex;
            align-items: center;
            gap: 5px;
            background: var(--btn-bg);
            padding: 0.35em 0.7em;
            border-radius: 1.5em;
            box-shadow: 0 4px 12px var(--shadow);
            font-size: var(--score-size);
            font-weight: 700;
            white-space: nowrap;
            transition: background 0.3s;
        }

        .theme-toggle {
            width: var(--btn-size);
            height: var(--btn-size);
            min-width: var(--btn-size);
            border-radius: 50%;
            border: none;
            background: var(--btn-bg);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 12px var(--shadow);
            transition: transform 0.1s, background 0.3s;
            -webkit-tap-highlight-color: transparent;
        }

        .theme-toggle:active { transform: scale(0.9); }

        .theme-toggle svg {
            width: var(--icon-size);
            height: var(--icon-size);
            color: var(--text-color);
        }

        /* ── Game Area ── */
        .game-area {
            flex: 1 1 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--gap);
            min-height: 0;
        }

        .board-container {
            position: relative;
            width: var(--board-size);
            height: var(--board-size);
            background-color: var(--board-bg);
            border-radius: 24px;
            padding: 2%;
            box-shadow: 0 10px 30px var(--shadow);
            flex: 0 0 auto;
        }

        .board {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            grid-template-rows: repeat(6, 1fr);
            width: 100%;
            height: 100%;
            position: relative;
            z-index: 2;
        }

        .cell {
            display: flex;
            justify-content: center;
            align-items: center;
            position: relative;
            background-color: var(--cell-bg);
            border-radius: 12px;
            margin: 2px;
        }

        .node {
            width: 65%;
            height: 65%;
            background-color: var(--node-bg);
            color: var(--node-text);
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: clamp(16px, 5vw, 26px);
            font-weight: 900;
            z-index: 3;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
            pointer-events: none;
            transition: transform 0.2s;
        }

        #svg-layer {
            position: absolute;
            top: 2%;
            left: 2%;
            width: 96%;
            height: 96%;
            pointer-events: none;
            z-index: 1;
        }

        /* ── Controls ── */
        .controls {
            width: var(--board-size);
            display: flex;
            gap: 12px;
            flex: 0 0 auto;
        }

        .btn {
            flex: 1;
            padding: 0.7em 0;
            border: none;
            border-radius: 20px;
            font-size: var(--ctrl-btn-size);
            font-weight: 800;
            font-family: inherit;
            cursor: pointer;
            background-color: var(--btn-bg);
            color: var(--text-color);
            box-shadow: 0 4px 10px var(--shadow);
            transition: transform 0.1s, background 0.3s;
        }

        .btn:active { transform: scale(0.95); }

        /* ── Modal ── */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: auto;
        }

        .modal-content {
            background: var(--bg-color);
            padding: 40px;
            border-radius: 30px;
            text-align: center;
            box-shadow: 0 20px 50px rgba(0,0,0,0.5);
            transform: translateY(50px);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            width: 90%;
            max-width: 400px;
        }

        .modal-overlay.active .modal-content { transform: translateY(0); }

        .modal-content h2 {
            margin: 0 0 15px 0;
            font-size: 32px;
            color: var(--text-color);
        }

        .modal-content p {
            font-size: 18px;
            color: gray;
            margin-bottom: 25px;
        }

        .btn-primary {
            background-color: var(--accent);
            color: #fff;
            transition: background-color 0.5s;
        }

        /* ── Toast ── */
        .toast {
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%) translateY(100px);
            background: var(--btn-bg);
            color: var(--text-color);
            padding: 14px 28px;
            border-radius: 20px;
            font-size: 16px;
            font-weight: 800;
            box-shadow: 0 10px 30px var(--shadow);
            opacity: 0;
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275), opacity 0.3s;
            z-index: 200;
            pointer-events: none;
            white-space: nowrap;
        }

        .toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }
    </style>
</head>
<body>

<div class="app-container" id="appContainer">
    <!-- Header -->
    <div class="header">
        <button class="back-btn" onclick="goBack()" title="Back">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </button>
        <span class="header-title">Zip</span>
        <div class="header-right">
            <!-- <div class="score-panel">
                ★ <span id="scoreDisplay">0</span>
            </div> -->
            <button class="theme-toggle" id="themeBtn" title="Change theme">
                <svg id="sunIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    style="display: none;">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- Game area: board + controls -->
    <div class="game-area">
        <div class="board-container" id="board-container">
            <svg id="svg-layer" viewBox="0 0 600 600" preserveAspectRatio="xMidYMid meet">
                <defs>
                    <linearGradient id="pathGradient" x1="0" y1="0" x2="600" y2="600" gradientUnits="userSpaceOnUse">
                        <stop id="grad-start" offset="0%" stop-color="#C724B1" />
                        <stop id="grad-end" offset="100%" stop-color="#E83F6F" />
                    </linearGradient>
                </defs>
                <path id="path-line" fill="none" stroke="url(#pathGradient)" stroke-width="50" stroke-linecap="round" stroke-linejoin="round" />
            </svg>
            <div class="board" id="board"></div>
        </div>

        <div class="controls">
            <button class="btn" onclick="resetPath()">Reset</button>
        </div>
    </div>
</div>

<div class="modal-overlay" id="winModal">
    <div class="modal-content">
        <h2>You Win!</h2>
        <p>Perfect path found.</p>
        <button class="btn btn-primary" style="width: 100%;" onclick="nextLevel()">Next Level</button>
    </div>
</div>

<div class="toast" id="toast"></div>

<script>

    function showInterstitialAd() {
        let payload = { action: "showInterstitial" };
        Unity.call(JSON.stringify(payload));
    }

    function showRewardedAd() {
        let payload = { action: "showRewarded" };
        Unity.call(JSON.stringify(payload));
    }

    function closeGame() {
        let payload = { action: "close" };
        Unity.call(JSON.stringify(payload));
    }

    function goBack() {
        closeGame();
    }

    // ── Theme ──
    const themeBtn = document.getElementById('themeBtn');
    const sunIcon = document.getElementById('sunIcon');
    const moonIcon = document.getElementById('moonIcon');

    function updateThemeIcons(theme) {
        sunIcon.style.display = theme === 'dark' ? 'block' : 'none';
        moonIcon.style.display = theme === 'dark' ? 'none' : 'block';
    }

    const savedTheme = localStorage.getItem('brainGamesTheme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeIcons(savedTheme);

    themeBtn.addEventListener('click', () => {
        const html = document.documentElement;
        const isDark = html.getAttribute('data-theme') === 'dark';
        const newTheme = isDark ? 'light' : 'dark';
        html.setAttribute('data-theme', newTheme);
        localStorage.setItem('brainGamesTheme', newTheme);
        updateThemeIcons(newTheme);
    });

    // ── Adaptive Layout ──
    let safeInsetsCache = { top: 0, bottom: 0, left: 0, right: 0 };
    (function measureSafeInsets() {
        const probe = document.createElement('div');
        probe.style.cssText = 'position:fixed;top:0;left:0;width:0;height:0;' +
            'padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);' +
            'padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);' +
            'visibility:hidden;';
        document.body.appendChild(probe);
        const cs = getComputedStyle(probe);
        safeInsetsCache = {
            top: parseFloat(cs.paddingTop) || 0,
            bottom: parseFloat(cs.paddingBottom) || 0,
            left: parseFloat(cs.paddingLeft) || 0,
            right: parseFloat(cs.paddingRight) || 0
        };
        probe.remove();
    })();

    function applyLayout() {
        const insets = safeInsetsCache;
        const availW = window.innerWidth - insets.left - insets.right;
        const availH = window.innerHeight - insets.top - insets.bottom;

        const margin = Math.round(availH * 0.025);
        const gap = Math.round(availH * 0.015);
        const headerH = Math.round(Math.min(Math.max(availH * 0.075, availH * 0.05), availH * 0.10));
        const ctrlH = Math.round(availH * 0.06); // height for the controls row
        const usableH = availH - margin * 2 - headerH - ctrlH - gap * 2;
        const usableW = availW - margin * 2;
        const boardSize = Math.max(180, Math.floor(Math.min(usableH, usableW)));

        const root = document.documentElement;
        root.style.setProperty('--margin', margin + 'px');
        root.style.setProperty('--gap', gap + 'px');
        root.style.setProperty('--header-h', headerH + 'px');
        root.style.setProperty('--board-size', boardSize + 'px');

        root.style.setProperty('--btn-size', Math.round(headerH * 0.68) + 'px');
        root.style.setProperty('--icon-size', Math.round(headerH * 0.36) + 'px');
        root.style.setProperty('--title-size', Math.round(headerH * 0.34) + 'px');
        root.style.setProperty('--score-size', Math.round(headerH * 0.26) + 'px');
        root.style.setProperty('--ctrl-btn-size', Math.round(headerH * 0.28) + 'px');
    }

    let layoutTimeout;
    function scheduleLayout() {
        clearTimeout(layoutTimeout);
        layoutTimeout = setTimeout(applyLayout, 30);
    }
    if (window.ResizeObserver) {
        new ResizeObserver(scheduleLayout).observe(document.documentElement);
    } else {
        window.addEventListener('resize', scheduleLayout);
        window.addEventListener('orientationchange', scheduleLayout);
    }
    applyLayout();

    // ── Audio ──
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSound(type) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'move') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400 + (path.length * 20), audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(600 + (path.length * 20), audioCtx.currentTime + 0.05);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'back') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'win') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(440, audioCtx.currentTime);
            osc.frequency.setValueAtTime(554.37, audioCtx.currentTime + 0.1);
            osc.frequency.setValueAtTime(659.25, audioCtx.currentTime + 0.2);
            osc.frequency.setValueAtTime(880, audioCtx.currentTime + 0.3);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.linearRampToValueAtTime(0, audioCtx.currentTime + 0.6);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.6);
        }
    }

    // ── Color palettes ──
    const palettes = [
        ['#C724B1', '#E83F6F'],
        ['#4A00E0', '#8E2DE2'],
        ['#11998e', '#38ef7d'],
        ['#FF512F', '#F09819'],
        ['#00c6ff', '#0072ff'],
        ['#f12711', '#f5af19'],
        ['#833ab4', '#fd1d1d'],
    ];

    let currentPalette = palettes[0];

    // ── Game variables ──
    const boardEl = document.getElementById('board');
    const pathLine = document.getElementById('path-line');
    const gradStart = document.getElementById('grad-start');
    const gradEnd = document.getElementById('grad-end');

    let score = parseInt(localStorage.getItem('zipScore') || '0');
    // document.getElementById('scoreDisplay').innerText = score;

    const gridSize = 6;
    let levelData = [];
    let maxNumber = 0;
    const totalCells = gridSize * gridSize;

    let path = [];
    let isPointerDown = false;
    let nextExpectedNumber = 2;

    // ── Hamiltonian path generator (DFS with Warnsdorff heuristic) ──
    function generateLevel() {
        let grid, finalMaxNum, finalPath;
        let success = false;

        while (!success) {
            let tempPath = [];
            let visited = Array(totalCells).fill(false);
            let found = false;

            function dfs(r, c) {
                if (found) return;
                tempPath.push({ r, c });
                visited[r * gridSize + c] = true;

                if (tempPath.length === totalCells) {
                    found = true;
                    return;
                }

                let neighbors = [];
                let dirs = [[0, 1], [1, 0], [0, -1], [-1, 0]];

                for (let [dr, dc] of dirs) {
                    let nr = r + dr, nc = c + dc;
                    if (nr >= 0 && nr < gridSize && nc >= 0 && nc < gridSize && !visited[nr * gridSize + nc]) {
                        let unv = 0;
                        for (let [ddr, ddc] of dirs) {
                            let nnr = nr + ddr, nnc = nc + ddc;
                            if (nnr >= 0 && nnr < gridSize && nnc >= 0 && nnc < gridSize && !visited[nnr * gridSize + nnc]) unv++;
                        }
                        neighbors.push({ r: nr, c: nc, count: unv });
                    }
                }

                neighbors.sort(() => Math.random() - 0.5);
                neighbors.sort((a, b) => a.count - b.count);

                for (let n of neighbors) {
                    dfs(n.r, n.c);
                    if (found) return;
                }

                tempPath.pop();
                visited[r * gridSize + c] = false;
            }

            dfs(Math.floor(Math.random() * gridSize), Math.floor(Math.random() * gridSize));

            if (found && tempPath.length === totalCells) {
                success = true;
                finalPath = tempPath;
            }
        }

        finalMaxNum = Math.floor(Math.random() * 8) + 8; // 8–15 checkpoints
        grid = Array(gridSize).fill(0).map(() => Array(gridSize).fill(0));

        grid[finalPath[0].r][finalPath[0].c] = 1;
        grid[finalPath[totalCells - 1].r][finalPath[totalCells - 1].c] = finalMaxNum;

        let internalIndices = [];
        for (let i = 1; i < totalCells - 1; i++) internalIndices.push(i);
        internalIndices.sort(() => Math.random() - 0.5);

        let selected = internalIndices.slice(0, finalMaxNum - 2).sort((a, b) => a - b);
        for (let i = 0; i < selected.length; i++) {
            let pt = finalPath[selected[i]];
            grid[pt.r][pt.c] = i + 2;
        }

        return { grid, maxNumber: finalMaxNum };
    }

    function applyNewLevel() {
        const generated = generateLevel();
        levelData = generated.grid;
        maxNumber = generated.maxNumber;

        currentPalette = palettes[Math.floor(Math.random() * palettes.length)];
        gradStart.setAttribute('stop-color', currentPalette[0]);
        gradEnd.setAttribute('stop-color', currentPalette[1]);

        document.documentElement.style.setProperty('--accent', currentPalette[1]);

        initBoard();
    }

    function initBoard() {
        boardEl.innerHTML = '';
        path = [];
        nextExpectedNumber = 2;
        pathLine.setAttribute('d', '');

        for (let r = 0; r < gridSize; r++) {
            for (let c = 0; c < gridSize; c++) {
                const cell = document.createElement('div');
                cell.className = 'cell';
                cell.id = `cell-${r}-${c}`;

                const nodeVal = levelData[r][c];
                if (nodeVal > 0) {
                    const node = document.createElement('div');
                    node.className = 'node';
                    node.innerText = nodeVal;
                    if (nodeVal === 1) node.style.color = 'var(--accent)';
                    cell.appendChild(node);
                }
                boardEl.appendChild(cell);
            }
        }
    }

    function getCellCoords(clientX, clientY) {
        const rect = boardEl.getBoundingClientRect();
        const x = clientX - rect.left;
        const y = clientY - rect.top;

        if (x < 0 || x > rect.width || y < 0 || y > rect.height) return null;

        const c = Math.floor((x / rect.width) * gridSize);
        const r = Math.floor((y / rect.height) * gridSize);

        if (c < 0 || c >= gridSize || r < 0 || r >= gridSize) return null;
        return { r, c };
    }

    function getPathIndex(r, c) {
        return path.findIndex(p => p.r === r && p.c === c);
    }

    function truncatePathTo(index) {
        if (index < 0 || index >= path.length - 1) return;

        path.splice(index + 1);

        let maxInPath = 1;
        for (let i = 0; i < path.length; i++) {
            let p = path[i];
            let val = levelData[p.r][p.c];
            if (val > maxInPath) maxInPath = val;
        }
        nextExpectedNumber = maxInPath + 1;

        playSound('back');
        drawSVG();
    }

    function isValidStep(r, c) {
        if (r < 0 || r >= gridSize || c < 0 || c >= gridSize) return false;
        if (getPathIndex(r, c) !== -1) return false;
        const val = levelData[r][c];
        if (val > 0 && val !== nextExpectedNumber) return false;
        return true;
    }

    function tryDrawLineTo(targetR, targetC) {
        const last = path[path.length - 1];
        if (!last) return false;

        if (levelData[last.r][last.c] === maxNumber) return false;

        // Straight line (horizontal or vertical)
        if (last.r === targetR || last.c === targetC) {
            const dr = Math.sign(targetR - last.r);
            const dc = Math.sign(targetC - last.c);
            const steps = Math.max(Math.abs(targetR - last.r), Math.abs(targetC - last.c));

            let added = false;
            for (let i = 1; i <= steps; i++) {
                const r = last.r + dr * i;
                const c = last.c + dc * i;

                if (!isValidStep(r, c)) break;

                const val = levelData[r][c];
                if (val > 0) nextExpectedNumber++;

                path.push({ r, c });
                added = true;

                if (val === maxNumber) break;
            }

            if (added) {
                playSound('move');
                drawSVG();
                return true;
            }
            return false;
        }
        // Smart diagonal compensation
        else if (Math.abs(targetR - last.r) <= 2 && Math.abs(targetC - last.c) <= 2) {
            const dr = Math.sign(targetR - last.r);
            const dc = Math.sign(targetC - last.c);

            if (isValidStep(last.r + dr, last.c)) {
                const val = levelData[last.r + dr][last.c];
                if (val > 0) nextExpectedNumber++;
                path.push({ r: last.r + dr, c: last.c });
                playSound('move');
                drawSVG();
                tryDrawLineTo(targetR, targetC);
                return true;
            } else if (isValidStep(last.r, last.c + dc)) {
                const val = levelData[last.r][last.c + dc];
                if (val > 0) nextExpectedNumber++;
                path.push({ r: last.r, c: last.c + dc });
                playSound('move');
                drawSVG();
                tryDrawLineTo(targetR, targetC);
                return true;
            }
        }
        return false;
    }

    function handlePointer(e) {
        const coords = getCellCoords(e.clientX, e.clientY);
        if (!coords) return;

        const val = levelData[coords.r][coords.c];
        const idx = getPathIndex(coords.r, coords.c);

        if (path.length === 0) {
            if (val === 1) {
                path.push({ r: coords.r, c: coords.c });
                playSound('move');
                drawSVG();
            }
            return;
        }

        if (idx !== -1) {
            if (idx < path.length - 1) {
                truncatePathTo(idx);
            }
        } else {
            tryDrawLineTo(coords.r, coords.c);
        }
    }

    function handlePointerDown(e) {
        isPointerDown = true;
        handlePointer(e);
    }

    function handlePointerMove(e) {
        if (isPointerDown) {
            handlePointer(e);
        }
    }

    function handlePointerUp() {
        isPointerDown = false;
        checkWinCondition();
    }

    function drawSVG() {
        if (path.length === 0) {
            pathLine.setAttribute('d', '');
            return;
        }

        if (path.length === 1) {
            const x = path[0].c * 100 + 50;
            const y = path[0].r * 100 + 50;
            pathLine.setAttribute('d', `M ${x} ${y} L ${x + 0.1} ${y}`);
            return;
        }

        let d = '';
        path.forEach((p, index) => {
            const x = p.c * 100 + 50;
            const y = p.r * 100 + 50;
            if (index === 0) d += `M ${x} ${y} `;
            else d += `L ${x} ${y} `;
        });
        pathLine.setAttribute('d', d);
    }

    function resetPath() {
        initBoard();
        playSound('back');
    }

    let toastTimeout;
    function showToast(message) {
        const toast = document.getElementById('toast');
        toast.innerText = message;
        toast.classList.add('show');
        if (toastTimeout) clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
            toast.classList.remove('show');
        }, 2000);
    }

    function checkWinCondition() {
        if (path.length > 0) {
            const lastCell = path[path.length - 1];
            if (levelData[lastCell.r][lastCell.c] === maxNumber) {
                if (path.length === totalCells) {
                    playSound('win');
                    triggerConfetti();
                    showInterstitialAd();
                    document.getElementById('winModal').classList.add('active');
                    score += 100;
                    localStorage.setItem('zipScore', score);
                    document.getElementById('scoreDisplay').innerText = score;
                } else if (path.length > 1) {
                    showToast("Fill all empty cells!");
                }
            }
        }
    }

    let confettiAnimationId = null;

    function triggerConfetti() {
        const duration = 2500;
        const end = Date.now() + duration;
        const colors = [currentPalette[0], currentPalette[1], '#FFD166'];

        (function frame() {
            confetti({ particleCount: 5, angle: 60, spread: 55, origin: { x: 0 }, colors: colors });
            confetti({ particleCount: 5, angle: 120, spread: 55, origin: { x: 1 }, colors: colors });
            if (Date.now() < end) {
                confettiAnimationId = requestAnimationFrame(frame);
            }
        }());
    }

    function nextLevel() {
        document.getElementById('winModal').classList.remove('active');
        if (confettiAnimationId) cancelAnimationFrame(confettiAnimationId);
        if (window.confetti) confetti.reset();

        applyNewLevel();
    }

    // ── Event listeners ──
    boardEl.addEventListener('pointerdown', handlePointerDown);
    document.addEventListener('pointermove', handlePointerMove);
    document.addEventListener('pointerup', handlePointerUp);
    boardEl.addEventListener('touchstart', (e) => e.preventDefault(), { passive: false });

    // ── Start first level ──
    applyNewLevel();
</script>
</body>
</html>
