<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Fifteen - Brain Games</title>
    <style>
        /* ================================================================
           CSS-only адаптивная вёрстка: clamp / dvh / aspect-ratio / cqw
           ================================================================ */

        :root {
            --bg-color: #F8F9FA;
            --text-color: #1C2331;
            --text-secondary: #7A8294;
            --board-bg: #E2E8F0;
            --cell-bg: #F1F5F9;
            --tile-shadow: #CBD5E1;
            --btn-bg: #E2E8F0;
            --btn-shadow: rgba(0, 0, 0, 0.05);
            --primary: #06D6A0;

            /* Геометрия (vh-фолбек) */
            --margin: clamp(8px, 2.5vh, 24px);
            --gap: clamp(4px, 1.8vh, 16px);
            --header-h: clamp(32px, 7.5vh, 64px);
            --score-row-h: clamp(44px, 9vh, 64px);

            /* Производные от шапки */
            --btn-size: calc(var(--header-h) * 0.68);
            --icon-size: calc(var(--header-h) * 0.36);
            --title-size: calc(var(--header-h) * 0.34);

            /* Модальное окно */
            --modal-padding: clamp(10px, 3vh, 28px);
            --modal-radius: clamp(8px, 2vh, 18px);
            --modal-title-size: clamp(16px, 3vh, 32px);
            --modal-text-size: clamp(12px, 2vh, 20px);
            --modal-btn-size: clamp(12px, 2vh, 20px);
        }

        @supports (height: 100dvh) {
            :root {
                --margin: clamp(8px, 2.5dvh, 24px);
                --gap: clamp(4px, 1.8dvh, 16px);
                --header-h: clamp(32px, 7.5dvh, 64px);
                --score-row-h: clamp(44px, 9dvh, 64px);
                --modal-padding: clamp(10px, 3dvh, 28px);
                --modal-radius: clamp(8px, 2dvh, 18px);
                --modal-title-size: clamp(16px, 3dvh, 32px);
                --modal-text-size: clamp(12px, 2dvh, 20px);
                --modal-btn-size: clamp(12px, 2dvh, 20px);
            }
        }

        @media (orientation: landscape) {
            :root {
                --margin: clamp(12px, 3.5vh, 32px);
                --gap: clamp(6px, 3vh, 20px);
                --header-h: clamp(40px, 12vh, 80px);
                --score-row-h: clamp(36px, 9vh, 52px);
            }
        }

        @media (orientation: landscape) {
            @supports (height: 100dvh) {
                :root {
                    --margin: clamp(12px, 3.5dvh, 32px);
                    --gap: clamp(6px, 3dvh, 20px);
                    --header-h: clamp(40px, 12dvh, 80px);
                    --score-row-h: clamp(36px, 9dvh, 52px);
                }
            }
        }

        [data-theme="dark"] {
            --bg-color: #1A1A24;
            --text-color: #F8F9FA;
            --text-secondary: #A0AABF;
            --board-bg: #2A2A38;
            --cell-bg: #334155;
            --tile-shadow: #0F172A;
            --btn-bg: #2A2A38;
            --btn-shadow: rgba(0, 0, 0, 0.2);
            --primary: #059669;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .app-container {
            height: 100vh;
            height: 100dvh;
            padding-top: calc(var(--margin) + env(safe-area-inset-top, 0px));
            padding-bottom: calc(var(--margin) + env(safe-area-inset-bottom, 0px));
            padding-left: calc(var(--margin) + env(safe-area-inset-left, 0px));
            padding-right: calc(var(--margin) + env(safe-area-inset-right, 0px));
            display: flex;
            flex-direction: column;
            align-items: stretch;
            gap: var(--gap);
        }

        .header {
            width: 100%;
            height: var(--header-h);
            flex: 0 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            position: relative;
        }

        .back-btn {
            width: var(--btn-size);
            height: var(--btn-size);
            min-width: var(--btn-size);
            border-radius: 50%;
            background-color: var(--btn-bg);
            box-shadow: 0 4px 12px var(--btn-shadow);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: none;
            outline: none;
            color: var(--text-color);
            transition: transform 0.1s, background-color 0.3s;
            -webkit-tap-highlight-color: transparent;
        }

        .back-btn:active { transform: scale(0.9); }
        .back-btn svg { width: var(--icon-size); height: var(--icon-size); }

        .header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            max-width: calc(100% - var(--btn-size) * 2 - 40px);
            font-size: var(--title-size);
            font-weight: 900;
            letter-spacing: 2px;
            line-height: 1;
            color: var(--text-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            pointer-events: none;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .theme-toggle {
            width: var(--btn-size);
            height: var(--btn-size);
            min-width: var(--btn-size);
            border-radius: 50%;
            background-color: var(--btn-bg);
            box-shadow: 0 4px 12px var(--btn-shadow);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: none;
            outline: none;
            color: var(--text-color);
            transition: transform 0.1s, background-color 0.3s;
            -webkit-tap-highlight-color: transparent;
        }

        .theme-toggle:active { transform: scale(0.9); }
        .theme-toggle svg { width: var(--icon-size); height: var(--icon-size); color: var(--text-color); }

        .game-area {
            flex: 1 1 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--gap);
            min-height: 0;
        }

        /* Обёртка: доска + плашки + кнопка, выровнены по левому краю */
        .board-col {
            --avail-h: calc(100vh - var(--header-h) - var(--score-row-h) - var(--gap) - var(--gap) - 2 * var(--margin)
                - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
            --max-w: calc(100vw - 2 * var(--margin)
                - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
            --board-size: min(var(--max-w), calc(var(--avail-h) * 0.85));
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: calc(var(--board-size) * 0.0256);
        }

        @supports (height: 100dvh) {
            .board-col {
                --avail-h: calc(100dvh - var(--header-h) - var(--score-row-h) - var(--gap) - var(--gap) - 2 * var(--margin)
                    - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
            }
        }

        @supports (width: 100dvw) {
            .board-col {
                --max-w: calc(100dvw - 2 * var(--margin)
                    - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
            }
        }

        /* Плашки MOVES / BEST */
        .score-row {
            width: 100%;
            display: flex;
            gap: calc(var(--board-size) * 0.0256);
        }

        .score-box {
            flex: 1 1 50%;
            background-color: var(--board-bg);
            border-radius: calc(var(--board-size) * 0.02);
            padding: 0 clamp(8px, 2vw, 16px);
            height: calc(var(--board-size) * 0.15);
            display: flex;
            flex-direction: column;
            justify-content: center;
            text-align: center;
            box-shadow: 0 4px 12px var(--btn-shadow);
            transition: background-color 0.3s;
        }

        .score-label {
            display: block;
            font-size: clamp(1px, calc(var(--board-size) * 0.032), 13px);
            font-weight: 700;
            letter-spacing: 1px;
            color: var(--text-secondary);
            text-transform: uppercase;
        }

        .score-value {
            display: block;
            font-size: clamp(1px, calc(var(--board-size) * 0.05), 20px);
            font-weight: 600;
            color: var(--text-color);
            line-height: 1;
        }

        .board-wrapper {
            --avail-h: calc(100vh - var(--header-h) - var(--score-row-h) - var(--gap) - var(--gap) - 2 * var(--margin)
                - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
            --max-w: calc(100vw - 2 * var(--margin)
                - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
            width: min(var(--max-w), calc(var(--avail-h) * 0.85));
            aspect-ratio: 1 / 1;
            flex: 0 0 auto;
            container-type: size;
            background: var(--board-bg);
            border-radius: 2cqw;
            padding: 1cqw;
            box-shadow: inset 0 6px 15px rgba(0,0,0,0.1);
            position: relative;
        }

        @supports (height: 100dvh) {
            .board-wrapper {
                --avail-h: calc(100dvh - var(--header-h) - var(--score-row-h) - var(--gap) - var(--gap) - 2 * var(--margin)
                    - env(safe-area-inset-top, 0px) - env(safe-area-inset-bottom, 0px));
            }
        }

        @supports (width: 100dvw) {
            .board-wrapper {
                --max-w: calc(100dvw - 2 * var(--margin)
                    - env(safe-area-inset-left, 0px) - env(safe-area-inset-right, 0px));
            }
        }

        .restart-btn {
            width: calc(var(--board-size) * 0.1);
            height: calc(var(--board-size) * 0.1);
            border-radius: calc(var(--board-size) * 0.02);
            background-color: var(--btn-bg);
            box-shadow: 0 4px 12px var(--btn-shadow);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: none;
            outline: none;
            color: var(--text-color);
            transition: transform 0.1s, background-color 0.3s;
            -webkit-tap-highlight-color: transparent;
        }

        .restart-btn:active { transform: scale(0.9); }
        .restart-btn svg {
            width: calc(var(--board-size) * 0.05);
            height: calc(var(--board-size) * 0.05);
        }

        .board {
            width: 100%;
            height: 100%;
            position: relative;
        }

        .tile-container {
            position: absolute;
            transition: transform 0.15s cubic-bezier(0.2, 0.8, 0.2, 1);
        }

        .tile {
            width: 100%;
            height: 100%;
            padding: 1cqw;
        }

        .tile-inner {
            width: 100%;
            height: 100%;
            border-radius: 2cqw;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 9cqw;
            font-weight: 800;
            line-height: 1;
            color: var(--text-color);
            background: var(--cell-bg);
            cursor: pointer;
            transition: filter 0.2s, transform 0.1s;
        }

        .no-transition {
            transition: none !important;
        }

        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: var(--bg-color);
            padding: var(--modal-padding);
            border-radius: var(--modal-radius);
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            transform: translateY(50px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 90%;
        }

        .modal-overlay.active .modal-content { transform: translateY(0); }

        .modal-content h2 {
            font-size: var(--modal-title-size);
            margin-bottom: 10px;
            color: var(--text-color);
        }

        .modal-content p {
            color: var(--text-secondary);
            margin-bottom: 30px;
            font-size: var(--modal-text-size);
        }

        .play-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: var(--modal-padding) calc(var(--modal-padding) * 2);
            font-size: var(--modal-btn-size);
            font-weight: 800;
            border-radius: var(--modal-radius);
            cursor: pointer;
            transition: transform 0.1s;
            font-family: 'Nunito', sans-serif;
        }

        .play-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

    <div class="app-container">
        <div class="header">
            <button class="back-btn" onclick="goBack()" title="Back">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
            </button>
            <span class="header-title">15 Puzzle</span>
            <div class="header-right">
                <button class="theme-toggle" id="themeBtn" title="Change theme">
                    <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                    <svg id="sunIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                </button>
            </div>
        </div>

        <div class="game-area">
            <div class="board-col">
                <div class="score-row">
                    <div class="score-box">
                        <span class="score-label">MOVES</span>
                        <span class="score-value" id="movesDisplay">0</span>
                    </div>
                    <div class="score-box">
                        <span class="score-label">BEST</span>
                        <span class="score-value" id="bestDisplay">-</span>
                    </div>
                </div>

                <div class="board-wrapper">
                    <div class="board" id="board"></div>
                </div>

                <button class="restart-btn" id="restartBtn" title="Restart">
                    <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="currentColor"><path d="M 20.3 13.43 a 1 1 0 0 0 -1.25 0.65 A 7.14 7.14 0 0 1 12.18 19 A 7.1 7.1 0 0 1 5 12 a 7.1 7.1 0 0 1 7.18 -7 a 7.26 7.26 0 0 1 4.65 1.67 l -2.17 -0.36 a 1 1 0 0 0 -1.15 0.83 a 1 1 0 0 0 0.83 1.15 l 4.24 0.7 h 0.17 a 1 1 0 0 0 0.34 -0.06 a 0.33 0.33 0 0 0 0.1 -0.06 a 0.78 0.78 0 0 0 0.2 -0.11 l 0.09 -0.11 c 0 -0.05 0.09 -0.09 0.13 -0.15 s 0 -0.1 0.05 -0.14 a 1.34 1.34 0 0 0 0.07 -0.18 l 0.75 -4 a 1 1 0 0 0 -2 -0.38 l -0.27 1.45 A 9.21 9.21 0 0 0 12.18 3 A 9.1 9.1 0 0 0 3 12 a 9.1 9.1 0 0 0 9.18 9 A 9.12 9.12 0 0 0 21 14.68 A 1 1 0 0 0 20.3 13.43 Z"/></svg>
                </button>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="winModal">
        <div class="modal-content">
            <h2>Perfect! 🎉</h2>
            <p id="modalDesc">You solved the puzzle.</p>
            <button class="play-btn" id="nextLevelBtn">Play Again</button>
        </div>
    </div>

    <script>
        // ================================================================
        // ТЕМЫ
        // ================================================================
        const themeBtn = document.getElementById('themeBtn');
        const moonIcon = document.getElementById('moonIcon');
        const sunIcon = document.getElementById('sunIcon');
        let currentTheme = localStorage.getItem('brainGamesTheme') || 'light';

        function applyTheme(theme) {
            document.documentElement.setAttribute('data-theme', theme);
            moonIcon.style.display = theme === 'dark' ? 'none' : '';
            sunIcon.style.display = theme === 'dark' ? '' : 'none';
            localStorage.setItem('brainGamesTheme', theme);
        }
        applyTheme(currentTheme);

        themeBtn.addEventListener('pointerdown', () => {
            currentTheme = currentTheme === 'light' ? 'dark' : 'light';
            applyTheme(currentTheme);
        });

        // ================================================================
        // АУДИО ДВИЖОК
        // ================================================================
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (!audioCtx) return;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            if (type === 'click') {
                osc.type = 'triangle';
                osc.frequency.setValueAtTime(300, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(100, audioCtx.currentTime + 0.1);
                gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.1);
            } else if (type === 'win') {
                const now = audioCtx.currentTime;
                const freqs = [440, 554.37, 659.25, 880];
                freqs.forEach((freq, i) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.type = 'sine';
                    o.frequency.value = freq;
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    g.gain.setValueAtTime(0, now + i * 0.1);
                    g.gain.linearRampToValueAtTime(0.1, now + i * 0.1 + 0.05);
                    g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.1 + 0.4);
                    o.start(now + i * 0.1);
                    o.stop(now + i * 0.1 + 0.5);
                });
            }
        }

        // ================================================================
        // ЛОГИКА ИГРЫ
        // ================================================================
        const board = document.getElementById('board');
        const winModal = document.getElementById('winModal');
        const nextLevelBtn = document.getElementById('nextLevelBtn');
        const restartBtn = document.getElementById('restartBtn');

        const GRID_SIZE = 4;
        let tiles = [];
        let emptyPos = { x: 0, y: 0 };
        let isLocked = false;
        let moves = 0;
        let bestMoves = Infinity;

        const BEST_KEY = 'brainGames_fifteens_best';

        function loadBestMoves() {
            try {
                const v = localStorage.getItem(BEST_KEY);
                if (v !== null) bestMoves = parseInt(v, 10) || Infinity;
            } catch (_) { bestMoves = Infinity; }
            updateBestDisplay();
        }

        function updateMovesDisplay() {
            document.getElementById('movesDisplay').innerText = moves;
        }

        function updateBestDisplay() {
            const el = document.getElementById('bestDisplay');
            el.innerText = bestMoves === Infinity ? '-' : bestMoves;
        }

        function saveBestIfBetter() {
            if (moves < bestMoves) {
                bestMoves = moves;
                updateBestDisplay();
                try { localStorage.setItem(BEST_KEY, bestMoves); } catch (_) { }
            }
        }

        function initGame() {
            board.innerHTML = '';
            tiles = [];
            moves = 0;
            updateMovesDisplay();
            isLocked = true;
            emptyPos = { x: GRID_SIZE - 1, y: GRID_SIZE - 1 };

            for (let i = 0; i < GRID_SIZE * GRID_SIZE - 1; i++) {
                const x = i % GRID_SIZE;
                const y = Math.floor(i / GRID_SIZE);

                const tileContainer = document.createElement('div');
                tileContainer.className = 'tile-container no-transition';
                tileContainer.style.width = (100 / GRID_SIZE) + '%';
                tileContainer.style.height = (100 / GRID_SIZE) + '%';

                const tile = document.createElement('div');
                tile.className = 'tile';

                const inner = document.createElement('div');
                inner.className = 'tile-inner';
                inner.textContent = i + 1;

                tile.appendChild(inner);
                tileContainer.appendChild(tile);
                board.appendChild(tileContainer);

                const tileObj = {
                    element: tileContainer,
                    id: i + 1,
                    x: x, y: y,
                    correctX: x, correctY: y
                };

                tileContainer.addEventListener('pointerdown', () => moveTile(tileObj));
                tiles.push(tileObj);
                updateTilePosition(tileObj);
            }

            shuffleBoard();
        }

        function updateTilePosition(tileObj) {
            tileObj.element.style.transform = `translate(${tileObj.x * 100}%, ${tileObj.y * 100}%)`;
        }

        function getNeighbors(pos) {
            const n = [];
            if (pos.y > 0) n.push({ x: pos.x, y: pos.y - 1 });
            if (pos.y < GRID_SIZE - 1) n.push({ x: pos.x, y: pos.y + 1 });
            if (pos.x > 0) n.push({ x: pos.x - 1, y: pos.y });
            if (pos.x < GRID_SIZE - 1) n.push({ x: pos.x + 1, y: pos.y });
            return n;
        }

        function shuffleBoard() {
            let prevEmpty = { x: -1, y: -1 };
            const moves = GRID_SIZE * GRID_SIZE * 10;

            for (let i = 0; i < moves; i++) {
                const neighbors = getNeighbors(emptyPos);
                const valid = neighbors.filter(n => !(n.x === prevEmpty.x && n.y === prevEmpty.y));
                const nextEmpty = valid[Math.floor(Math.random() * valid.length)];

                const tileToMove = tiles.find(t => t.x === nextEmpty.x && t.y === nextEmpty.y);
                if (tileToMove) {
                    tileToMove.x = emptyPos.x;
                    tileToMove.y = emptyPos.y;
                    updateTilePosition(tileToMove);
                }

                prevEmpty = { ...emptyPos };
                emptyPos = { ...nextEmpty };
            }

            setTimeout(() => {
                tiles.forEach(t => t.element.classList.remove('no-transition'));
                isLocked = false;
            }, 50);
        }

        function moveTile(tileObj) {
            if (isLocked) return;

            const dx = Math.abs(tileObj.x - emptyPos.x);
            const dy = Math.abs(tileObj.y - emptyPos.y);

            if (dx + dy === 1) {
                initAudio();
                playSound('click');

                const tx = tileObj.x, ty = tileObj.y;
                tileObj.x = emptyPos.x;
                tileObj.y = emptyPos.y;
                emptyPos.x = tx;
                emptyPos.y = ty;

                updateTilePosition(tileObj);
                moves++;
                updateMovesDisplay();
                checkWin();
            }
        }

        function checkWin() {
            if (emptyPos.x !== GRID_SIZE - 1 || emptyPos.y !== GRID_SIZE - 1) return;
            const isWin = tiles.every(t => t.x === t.correctX && t.y === t.correctY);
            if (isWin) {
                isLocked = true;
                saveBestIfBetter();
                playSound('win');

                showInterstitialAd();
                setTimeout(() => winModal.classList.add('active'), 800);
            }
        }

        nextLevelBtn.addEventListener('pointerdown', () => {
            winModal.classList.remove('active');
            setTimeout(initGame, 300);
        });

        restartBtn.addEventListener('pointerdown', () => {
            if (isLocked) return;
            initAudio();
            playSound('click');
            initGame();
        });

        loadBestMoves();
        initGame();

        function showInterstitialAd() {
            let payload = { action: "showInterstitial" };
            Unity.call(JSON.stringify(payload));
        }

        function showRewardedAd() {
            let payload = { action: "showRewarded" };
            Unity.call(JSON.stringify(payload));
        }

        function closeGame() {
            let payload = { action: "close" };
            Unity.call(JSON.stringify(payload));
        }

        function goBack() {
            closeGame();
        }
    </script>
</body>
</html>
