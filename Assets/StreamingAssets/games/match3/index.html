<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Match 3 - Brain Games</title>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root {
            --bg-color: #F8F9FA;
            --text-color: #1C2331;
            --text-secondary: #7A8294;
            --board-bg: #F0F2F5;
            --surface-color: #FFFFFF;
            --btn-bg: #E2E6EB;
            --btn-shadow: rgba(0,0,0,0.06);
            --primary: #06D6A0;

            --color-green: #A5D6B6;
            --color-blue: #B5CBEB;
            --color-yellow: #FCE199;
            --color-pink: #F8C8C9;
            --color-purple: #D7D0F1;
            --tile-icon-color: rgba(0,0,0,0.15);

            /* fallback */
            --margin: 16px;
            --gap: 12px;
            --header-h: 64px;
            --board-size: 320px;
            --btn-size: 44px;
            --icon-size: 22px;
            --title-size: 22px;
            --tile-gap: 3px;
            --tile-radius: 20px;
            --board-padding: 8px;
            --board-radius: 20px;
            --modal-padding: 24px;
            --modal-radius: 18px;
            --modal-title-size: 24px;
            --modal-text-size: 16px;
            --modal-btn-size: 18px;
        }

        [data-theme="dark"] {
            --bg-color: #161821;
            --text-color: #FFFFFF;
            --text-secondary: #8A92A6;
            --board-bg: #1A1D28;
            --surface-color: #242735;
            --btn-bg: #242735;
            --btn-shadow: rgba(0,0,0,0.3);
            --primary: #059669;

            --color-green: #7BA88B;
            --color-blue: #869BC2;
            --color-yellow: #D6BD7A;
            --color-pink: #D1A3A4;
            --color-purple: #B2ABC9;
            --tile-icon-color: rgba(0,0,0,0.25);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-user-select: none;
            -webkit-touch-callout: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: 'Nunito', 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            touch-action: none;
            transition: background-color 0.3s ease, color 0.3s ease;
        }

        .app-container {
            position: fixed;
            inset: 0;
            padding-top: calc(var(--margin) + env(safe-area-inset-top, 0px));
            padding-bottom: calc(var(--margin) + env(safe-area-inset-bottom, 0px));
            padding-left: calc(var(--margin) + env(safe-area-inset-left, 0px));
            padding-right: calc(var(--margin) + env(safe-area-inset-right, 0px));
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--gap);
        }

        /* Header */
        .header {
            width: 100%;
            max-width: calc(var(--board-size) + 2px);
            height: var(--header-h);
            flex: 0 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            position: relative;
        }

        .back-btn {
            width: var(--btn-size);
            height: var(--btn-size);
            min-width: var(--btn-size);
            border-radius: 50%;
            background-color: var(--btn-bg);
            box-shadow: 0 4px 12px var(--btn-shadow);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: none;
            outline: none;
            color: var(--text-color);
            transition: transform 0.1s, background-color 0.3s;
        }

        .back-btn:active { transform: scale(0.9); }
        .back-btn svg { width: var(--icon-size); height: var(--icon-size); }

        .header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            max-width: calc(100% - var(--btn-size) * 2 - 40px);
            font-size: var(--title-size);
            font-weight: 900;
            letter-spacing: 2px;
            line-height: 1;
            color: var(--text-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            pointer-events: none;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        /* Очки закомментированы
        .score-pill {
            background: var(--btn-bg);
            padding: calc(var(--header-h) * 0.12) calc(var(--header-h) * 0.2);
            border-radius: calc(var(--header-h) * 0.4);
            box-shadow: 0 4px 12px var(--btn-shadow);
            display: flex;
            align-items: center;
            gap: 6px;
            font-weight: 800;
            font-size: var(--score-size);
            color: var(--text-color);
            white-space: nowrap;
        }

        .score-pill svg { width: var(--icon-size); height: var(--icon-size); }
        */

        .theme-toggle {
            width: var(--btn-size);
            height: var(--btn-size);
            min-width: var(--btn-size);
            border-radius: 50%;
            background-color: var(--btn-bg);
            box-shadow: 0 4px 12px var(--btn-shadow);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: none;
            outline: none;
            color: var(--text-color);
            transition: transform 0.1s, background-color 0.3s;
        }

        .theme-toggle:active { transform: scale(0.9); }
        .theme-toggle svg { width: var(--icon-size); height: var(--icon-size); color: var(--text-color); }

        /* Game area */
        .game-area {
            flex: 1 1 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 0;
        }

        /* Board */
        .game-wrapper {
            width: var(--board-size);
            height: var(--board-size);
            flex: 0 0 auto;
            background: var(--surface-color);
            border-radius: var(--board-radius);
            box-shadow: 0 8px 24px var(--btn-shadow);
            padding: var(--board-padding);
        }

        .board-bg {
            width: 100%;
            height: 100%;
            background: var(--board-bg);
            border-radius: calc(var(--board-radius) - var(--board-padding));
            padding: var(--tile-gap);
            overflow: hidden;
        }

        .board {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Tiles */
        .tile {
            position: absolute;
            display: flex;
            justify-content: center;
            align-items: center;
            border-radius: 25%;
            cursor: pointer;
            transition: transform 0.2s ease, top 0.3s ease, left 0.3s ease, opacity 0.2s ease;
            box-shadow: inset 0 -4px 0 rgba(0,0,0,0.1);
        }

        .tile.selected {
            transform: scale(1.1);
            z-index: 10;
            box-shadow: 0 8px 16px var(--btn-shadow), inset 0 -4px 0 rgba(0,0,0,0.1);
        }

        .tile.matched {
            transform: scale(0);
            opacity: 0;
        }

        .tile svg {
            width: 50%;
            height: 50%;
            fill: var(--tile-icon-color);
            display: block;
        }

        .type-0 { background-color: var(--color-green); }
        .type-1 { background-color: var(--color-blue); }
        .type-2 { background-color: var(--color-yellow); }
        .type-3 { background-color: var(--color-pink); }
        .type-4 { background-color: var(--color-purple); }

        /* Modal */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(0,0,0,0.6);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .modal-overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal-content {
            background: var(--bg-color);
            padding: var(--modal-padding);
            border-radius: var(--modal-radius);
            text-align: center;
            box-shadow: 0 20px 40px rgba(0,0,0,0.2);
            transform: translateY(50px);
            transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 90%;
        }

        .modal-overlay.active .modal-content {
            transform: translateY(0);
        }

        .modal-content h2 {
            font-size: var(--modal-title-size);
            margin-bottom: 10px;
            color: var(--primary);
        }

        .modal-content p {
            color: var(--text-secondary);
            margin-bottom: 25px;
            font-size: var(--modal-text-size);
        }

        .play-again-btn {
            background: var(--primary);
            color: white;
            border: none;
            padding: var(--modal-padding) calc(var(--modal-padding) * 2);
            font-size: var(--modal-btn-size);
            font-weight: 800;
            border-radius: var(--modal-radius);
            cursor: pointer;
            width: 100%;
            transition: transform 0.1s ease;
        }

        .play-again-btn:active { transform: scale(0.95); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <button class="back-btn" onclick="goBack()" title="Back">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <span class="header-title">Match 3</span>
        <div class="header-right">
            <!-- Очки закомментированы
            <div class="score-pill">
                <svg viewBox="0 0 24 24" fill="#FCE199"><path d="M12 2L15.09 8.26L22 9.27L17 14.14L18.18 21.02L12 17.77L5.82 21.02L7 14.14L2 9.27L8.91 8.26L12 2Z"/></svg>
                <span id="scoreText">0 / 1000</span>
            </div>
            -->
            <button class="theme-toggle" id="themeBtn" title="Change theme">
                <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                <svg id="sunIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
            </button>
        </div>
    </div>

    <div class="game-area">
        <div class="game-wrapper">
            <div class="board-bg">
                <div class="board" id="board"></div>
            </div>
        </div>
    </div>
</div>

<div class="modal-overlay" id="winModal">
    <div class="modal-content">
        <h2>YOU WIN!</h2>
        <p>Target of 1000 points reached!</p>
        <button class="play-again-btn" onclick="restartGame()">Play Again</button>
    </div>
</div>

<script>
    // ================================================================
    // АДАПТИВНАЯ ВЁРСТКА
    // ================================================================
    const BOARD_SIZE = 8;
    const TILE_TYPES = 5;
    const TARGET_SCORE = 1000;
    let grid = [];
    let domTiles = {};
    let idCounter = 0;
    let score = 0;
    let isAnimating = false;
    let isGameWon = false;

    const LAYOUT_CFG = {
        portrait: {
            marginRatio: 0.025,
            gapRatio: 0.018,
            headerRatio: 0.075,
            headerMinRatio: 0.05, headerMaxRatio: 0.10,
        },
        landscape: {
            marginRatio: 0.035,
            gapRatio: 0.03,
            headerRatio: 0.12,
            headerMinRatio: 0.06, headerMaxRatio: 0.14,
        }
    };

    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

    let safeInsetsCache = { top: 0, bottom: 0, left: 0, right: 0 };
    (function measureSafeInsets() {
        const probe = document.createElement('div');
        probe.style.cssText = 'position:fixed;top:0;left:0;width:0;height:0;' +
            'padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);' +
            'padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);' +
            'visibility:hidden;';
        document.body.appendChild(probe);
        const cs = getComputedStyle(probe);
        safeInsetsCache = {
            top: parseFloat(cs.paddingTop) || 0,
            bottom: parseFloat(cs.paddingBottom) || 0,
            left: parseFloat(cs.paddingLeft) || 0,
            right: parseFloat(cs.paddingRight) || 0
        };
        probe.remove();
    })();

    function calcLayout() {
        const insets = safeInsetsCache;
        const availW = window.innerWidth - insets.left - insets.right;
        const availH = window.innerHeight - insets.top - insets.bottom;
        const isPortrait = availH >= availW;
        const cfg = isPortrait ? LAYOUT_CFG.portrait : LAYOUT_CFG.landscape;

        const margin = Math.round(availH * cfg.marginRatio);
        const gap = Math.round(availH * cfg.gapRatio);
        const headerH = Math.round(clamp(availH * cfg.headerRatio, availH * cfg.headerMinRatio, availH * cfg.headerMaxRatio));

        const usableH = availH - margin * 2 - headerH - gap;
        const usableW = availW - margin * 2;
        const boardSize = Math.max(180, Math.floor(Math.min(usableH, usableW)));

        return { margin, gap, headerH, boardSize };
    }

    function applyLayout() {
        const L = calcLayout();
        const root = document.documentElement;

        root.style.setProperty('--margin', L.margin + 'px');
        root.style.setProperty('--gap', L.gap + 'px');
        root.style.setProperty('--header-h', L.headerH + 'px');
        root.style.setProperty('--board-size', L.boardSize + 'px');

        root.style.setProperty('--btn-size', Math.round(L.headerH * 0.68) + 'px');
        root.style.setProperty('--icon-size', Math.round(L.headerH * 0.36) + 'px');
        root.style.setProperty('--title-size', Math.round(L.headerH * 0.34) + 'px');
        root.style.setProperty('--score-size', Math.round(L.headerH * 0.28) + 'px');

        root.style.setProperty('--board-padding', Math.round(L.boardSize * 0.02) + 'px');
        root.style.setProperty('--board-radius', Math.round(L.boardSize * 0.06) + 'px');
        root.style.setProperty('--tile-gap', Math.max(2, Math.round(L.boardSize * 0.008)) + 'px');

        root.style.setProperty('--modal-padding', Math.round(L.boardSize * 0.07) + 'px');
        root.style.setProperty('--modal-radius', Math.round(L.boardSize * 0.05) + 'px');
        root.style.setProperty('--modal-title-size', Math.round(L.boardSize * 0.065) + 'px');
        root.style.setProperty('--modal-text-size', Math.round(L.boardSize * 0.04) + 'px');
        root.style.setProperty('--modal-btn-size', Math.round(L.boardSize * 0.042) + 'px');

        updateTilePositions();
    }

    applyLayout();
    window.addEventListener('resize', applyLayout);

    // ================================================================
    // ТЕМЫ
    // ================================================================
    const themeBtn = document.getElementById('themeBtn');
    const moonIcon = document.getElementById('moonIcon');
    const sunIcon = document.getElementById('sunIcon');
    let currentTheme = localStorage.getItem('brainGamesTheme') || 'light';

    function applyTheme(theme) {
        document.documentElement.setAttribute('data-theme', theme);
        moonIcon.style.display = theme === 'dark' ? 'none' : '';
        sunIcon.style.display = theme === 'dark' ? '' : 'none';
        localStorage.setItem('brainGamesTheme', theme);
    }
    applyTheme(currentTheme);

    themeBtn.addEventListener('click', () => {
        currentTheme = currentTheme === 'light' ? 'dark' : 'light';
        applyTheme(currentTheme);
    });

    // ================================================================
    // АУДИО
    // ================================================================
    let audioCtx;
    function initAudio() {
        if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        if (audioCtx.state === 'suspended') audioCtx.resume();
    }

    function playSound(type) {
        if (!audioCtx) return;
        const now = audioCtx.currentTime;

        if (type === 'swipe') {
            // Мягкий щелчок
            const o = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            o.type = 'sine';
            o.frequency.setValueAtTime(600, now);
            o.frequency.exponentialRampToValueAtTime(300, now + 0.06);
            g.gain.setValueAtTime(0.12, now);
            g.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
            o.connect(g); g.connect(audioCtx.destination);
            o.start(now); o.stop(now + 0.08);
        } else if (type === 'match') {
            // Приятный перезвон — три быстрых ноты
            [0, 0.05, 0.1].forEach((delay, i) => {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = 'triangle';
                const freqs = [660, 880, 1100];
                o.frequency.value = freqs[i];
                g.gain.setValueAtTime(0, now + delay);
                g.gain.linearRampToValueAtTime(0.1, now + delay + 0.02);
                g.gain.exponentialRampToValueAtTime(0.001, now + delay + 0.15);
                o.connect(g); g.connect(audioCtx.destination);
                o.start(now + delay); o.stop(now + delay + 0.15);
            });
        } else if (type === 'win') {
            // Мелодичный арпеджио мажорного аккорда
            const notes = [523, 659, 784, 1047, 1319];
            notes.forEach((freq, i) => {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.type = 'sine';
                o.frequency.value = freq;
                o.connect(g); g.connect(audioCtx.destination);
                const t = now + i * 0.12;
                g.gain.setValueAtTime(0, t);
                g.gain.linearRampToValueAtTime(0.08, t + 0.04);
                g.gain.exponentialRampToValueAtTime(0.001, t + 0.5);
                o.start(t); o.stop(t + 0.6);
            });
            // Добавляем мягкий басовый фон
            const ob = audioCtx.createOscillator();
            const gb = audioCtx.createGain();
            ob.type = 'sine';
            ob.frequency.value = 262;
            gb.gain.setValueAtTime(0, now);
            gb.gain.linearRampToValueAtTime(0.04, now + 0.1);
            gb.gain.exponentialRampToValueAtTime(0.001, now + 0.7);
            ob.connect(gb); gb.connect(audioCtx.destination);
            ob.start(now); ob.stop(now + 0.8);
        }
    }

    document.addEventListener('pointerdown', initAudio, { once: true });

    // ================================================================
    // ИГРА
    // ================================================================

    const boardEl = document.getElementById('board');
    const winModal = document.getElementById('winModal');
    const scoreText = document.getElementById('scoreText');

    const icons = [
            '<circle cx="50" cy="50" r="35" />', 
            '<rect x="15" y="15" width="70" height="70" rx="18" />', 
            '<path d="M50 10 L62 38 L92 38 L68 56 L78 86 L50 68 L22 86 L32 56 L8 38 L38 38 Z" />', 
            '<path d="M50 15 L85 80 L15 80 Z" stroke-linejoin="round" />', 
            '<polygon points="50,10 90,50 50,90 10,50" />' 
        ];

    function updateScore(points) {
        score += points;
        // Очки закомментированы
        // if (scoreText) scoreText.textContent = `${score} / ${TARGET_SCORE}`;
    }

    function initGame() {
        grid = [];
        domTiles = {};
        boardEl.innerHTML = '';
        idCounter = 0;
        score = 0;
        isGameWon = false;
        winModal.classList.remove('active');
        updateScore(0);

        for (let r = 0; r < BOARD_SIZE; r++) {
            grid[r] = [];
            for (let c = 0; c < BOARD_SIZE; c++) {
                let type;
                do {
                    type = Math.floor(Math.random() * TILE_TYPES);
                } while (
                    (c >= 2 && grid[r][c-1]?.type === type && grid[r][c-2]?.type === type) ||
                    (r >= 2 && grid[r-1]?.[c]?.type === type && grid[r-2]?.[c]?.type === type)
                );
                let tile = { id: idCounter++, r, c, type };
                grid[r][c] = tile;
                createDOMTile(tile);
            }
        }
        updateTilePositions();
    }

    function createDOMTile(tile) {
        const el = document.createElement('div');
        el.className = `tile type-${tile.type}`;
        el.innerHTML = `<svg viewBox="0 0 100 100">${icons[tile.type]}</svg>`;
        el.dataset.id = tile.id;
        boardEl.appendChild(el);
        domTiles[tile.id] = el;
        return el;
    }

    function updateTilePositions() {
        const padding = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--tile-gap')) || 3;
        for (let r = 0; r < BOARD_SIZE; r++) {
            for (let c = 0; c < BOARD_SIZE; c++) {
                const tile = grid[r]?.[c];
                if (tile) {
                    const el = domTiles[tile.id];
                    if (!el) continue;
                    el.style.width = `calc(${100 / BOARD_SIZE}% - ${padding * 2}px)`;
                    el.style.height = `calc(${100 / BOARD_SIZE}% - ${padding * 2}px)`;
                    el.style.left = `calc(${c * (100 / BOARD_SIZE)}% + ${padding}px)`;
                    el.style.top = `calc(${r * (100 / BOARD_SIZE)}% + ${padding}px)`;
                }
            }
        }
    }

    // --- Swipe & click logic ---
    let startX, startY;
    let swipeTileId = null;

    boardEl.addEventListener('pointerdown', (e) => {
        if(isAnimating || isGameWon) return;
        initAudio();
        startX = e.clientX; startY = e.clientY;
        const el = e.target.closest('.tile');
        if(el) swipeTileId = parseInt(el.dataset.id);
    });

    boardEl.addEventListener('pointermove', (e) => {
        if(!swipeTileId) return;
        e.preventDefault();
    });

    boardEl.addEventListener('pointerup', (e) => {
        if(!swipeTileId) return;
        const dx = e.clientX - startX;
        const dy = e.clientY - startY;
        const absDx = Math.abs(dx), absDy = Math.abs(dy);

        if(Math.max(absDx, absDy) > 15) {
            let dir;
            if(absDx > absDy) dir = dx > 0 ? 'right' : 'left';
            else dir = dy > 0 ? 'down' : 'up';
            trySwipe(swipeTileId, dir);
        }
        swipeTileId = null;
    });

    function getTileById(id) {
        for (let r = 0; r < BOARD_SIZE; r++)
            for (let c = 0; c < BOARD_SIZE; c++)
                if (grid[r][c]?.id === id) return { tile: grid[r][c], r, c };
        return null;
    }

    function trySwipe(id, dir) {
        if(isAnimating || isGameWon) return;
        const src = getTileById(id);
        if(!src) return;
        let tr = src.r, tc = src.c;
        if(dir === 'up') tr--; else if(dir === 'down') tr++;
        else if(dir === 'left') tc--; else if(dir === 'right') tc++;
        if(tr < 0 || tr >= BOARD_SIZE || tc < 0 || tc >= BOARD_SIZE) return;

        const other = grid[tr][tc];
        if(!other) return;

        // Swap
        grid[src.r][src.c] = other; other.r = src.r; other.c = src.c;
        grid[tr][tc] = src.tile; src.tile.r = tr; src.tile.c = tc;
        updateTilePositions();
        playSound('swipe');

        setTimeout(() => processMatches(src, { tile: other, r: tr, c: tc }), 300);
    }

    function processMatches(srcInfo, otherInfo) {
        const matched = new Set();
        for (let r = 0; r < BOARD_SIZE; r++) {
            for (let c = 0; c < BOARD_SIZE - 2; c++) {
                if(grid[r][c] && grid[r][c+1] && grid[r][c+2] &&
                   grid[r][c].type === grid[r][c+1].type && grid[r][c].type === grid[r][c+2].type) {
                    matched.add(grid[r][c].id); matched.add(grid[r][c+1].id); matched.add(grid[r][c+2].id);
                }
            }
        }
        for (let c = 0; c < BOARD_SIZE; c++) {
            for (let r = 0; r < BOARD_SIZE - 2; r++) {
                if(grid[r][c] && grid[r+1][c] && grid[r+2][c] &&
                   grid[r][c].type === grid[r+1][c].type && grid[r][c].type === grid[r+2][c].type) {
                    matched.add(grid[r][c].id); matched.add(grid[r+1][c].id); matched.add(grid[r+2][c].id);
                }
            }
        }

        if(matched.size === 0) {
            // Нет совпадений — меняем обратно (только если был свайп, не каскад)
            if (srcInfo && otherInfo) {
                grid[srcInfo.r][srcInfo.c] = srcInfo.tile;
                srcInfo.tile.r = srcInfo.r; srcInfo.tile.c = srcInfo.c;
                grid[otherInfo.r][otherInfo.c] = otherInfo.tile;
                otherInfo.tile.r = otherInfo.r; otherInfo.tile.c = otherInfo.c;
                updateTilePositions();
            }
            return;
        }

        isAnimating = true;
        playSound('match');
        let points = matched.size * 10;
        updateScore(points);

        matched.forEach(id => {
            const el = domTiles[id];
            if(el) el.classList.add('matched');
        });

        setTimeout(() => {
            // Remove matched
            matched.forEach(id => {
                const el = domTiles[id];
                if(el) el.remove();
                delete domTiles[id];
            });
            for (let r = 0; r < BOARD_SIZE; r++)
                for (let c = 0; c < BOARD_SIZE; c++)
                    if(grid[r][c] && matched.has(grid[r][c].id)) grid[r][c] = null;

            // Gravity
            for (let c = 0; c < BOARD_SIZE; c++) {
                let writeRow = BOARD_SIZE - 1;
                for (let r = BOARD_SIZE - 1; r >= 0; r--) {
                    if(grid[r][c]) {
                        if(r !== writeRow) {
                            grid[writeRow][c] = grid[r][c];
                            grid[writeRow][c].r = writeRow;
                            grid[r][c] = null;
                        }
                        writeRow--;
                    }
                }
                // New tiles — стартуют над доской, падают вниз
                const padding = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--tile-gap')) || 3;
                for (let r = writeRow; r >= 0; r--) {
                    let type = Math.floor(Math.random() * TILE_TYPES);
                    let tile = { id: idCounter++, r, c, type };
                    grid[r][c] = tile;
                    const el = createDOMTile(tile);
                    el.style.top = `calc(-100% / ${BOARD_SIZE})`;
                    el.style.left = `calc(${c * (100 / BOARD_SIZE)}% + ${padding}px)`;
                    el.getBoundingClientRect(); // force reflow for transition
                }
            }
            updateTilePositions();
            isAnimating = false;

            if(score >= TARGET_SCORE && !isGameWon) triggerWin();

            // Check new matches
            setTimeout(() => {
                const hasMatches = checkHasMatches();
                if(hasMatches) processMatches(null, null);
            }, 100);
        }, 300);
    }

    function checkHasMatches() {
        for (let r = 0; r < BOARD_SIZE; r++)
            for (let c = 0; c < BOARD_SIZE - 2; c++)
                if(grid[r][c] && grid[r][c+1] && grid[r][c+2] &&
                   grid[r][c].type === grid[r][c+1].type && grid[r][c].type === grid[r][c+2].type) return true;
        for (let c = 0; c < BOARD_SIZE; c++)
            for (let r = 0; r < BOARD_SIZE - 2; r++)
                if(grid[r][c] && grid[r+1][c] && grid[r+2][c] &&
                   grid[r][c].type === grid[r+1][c].type && grid[r][c].type === grid[r+2][c].type) return true;
        return false;
    }

    function triggerWin() {
        isGameWon = true;
        playSound('win');
        const duration = 2500;
        const end = Date.now() + duration;
        (function frame() {
            confetti({
                particleCount: 5, angle: 60, spread: 55, origin: { x: 0 },
                colors: ['#A5D6B6', '#B5CBEB', '#FCE199', '#F8C8C9', '#D7D0F1']
            });
            confetti({
                particleCount: 5, angle: 120, spread: 55, origin: { x: 1 },
                colors: ['#A5D6B6', '#B5CBEB', '#FCE199', '#F8C8C9', '#D7D0F1']
            });
            if (Date.now() < end) requestAnimationFrame(frame);
            else winModal.classList.add('active');
        }());
    }

    function restartGame() {
        initGame();
    }

    initGame();
</script>
