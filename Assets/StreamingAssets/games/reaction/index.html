<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Reaction - Brain Games</title>
    <style>
        :root {
            --bg-color: #F8F9FA;
            --text-color: #1C2331;
            --board-bg: #E2E8F0;
            --btn-bg: #E2E6EB;
            --color-wait: #EF476F;
            --color-go: #06D6A0;
            --color-early: #FFD166;
            --shadow: rgba(0, 0, 0, 0.1);

            /* Выставляется в JS функцией applyLayout() */
            --margin: 16px;
            --gap: 12px;
            --header-h: 64px;
            --board-size: 320px;
            --btn-size: 44px;
            --icon-size: 22px;
            --title-size: 22px;
            --score-size: 16px;
            --status-icon-size: 48px;
            --status-title-size: 26px;
            --status-sub-size: 16px;
        }

        [data-theme="dark"] {
            --bg-color: #1A1A24;
            --text-color: #F8F9FA;
            --board-bg: #2A2A38;
            --btn-bg: #2A2A38;
            --color-wait: #B93756;
            --color-go: #05A67D;
            --color-early: #C6A24F;
            --shadow: rgba(0, 0, 0, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            background: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }

        .app-container {
            position: fixed;
            inset: 0;
            padding-top: calc(var(--margin) + env(safe-area-inset-top, 0px));
            padding-bottom: calc(var(--margin) + env(safe-area-inset-bottom, 0px));
            padding-left: calc(var(--margin) + env(safe-area-inset-left, 0px));
            padding-right: calc(var(--margin) + env(safe-area-inset-right, 0px));
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--gap);
        }

        /* ── Header ── */
        .header {
            width: 100%;
            max-width: calc(var(--board-size) + 2px);
            height: var(--header-h);
            flex: 0 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            position: relative;
        }

        .back-btn {
            width: var(--btn-size);
            height: var(--btn-size);
            min-width: var(--btn-size);
            border-radius: 50%;
            border: none;
            background: var(--btn-bg);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 12px var(--shadow);
            transition: transform 0.1s, background 0.3s;
            -webkit-tap-highlight-color: transparent;
        }

        .back-btn:active { transform: scale(0.9); }

        .back-btn svg {
            width: var(--icon-size);
            height: var(--icon-size);
        }

        .header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: var(--title-size);
            font-weight: 800;
            letter-spacing: 1px;
            line-height: 1;
            color: var(--text-color);
            white-space: nowrap;
            pointer-events: none;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .score-panel {
            display: flex;
            align-items: center;
            gap: 5px;
            background: var(--btn-bg);
            padding: 0.35em 0.7em;
            border-radius: 1.5em;
            box-shadow: 0 4px 12px var(--shadow);
            font-size: var(--score-size);
            font-weight: 700;
            white-space: nowrap;
            transition: background 0.3s;
        }

        .theme-toggle {
            width: var(--btn-size);
            height: var(--btn-size);
            min-width: var(--btn-size);
            border-radius: 50%;
            border: none;
            background: var(--btn-bg);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 12px var(--shadow);
            transition: transform 0.1s, background 0.3s;
            -webkit-tap-highlight-color: transparent;
        }

        .theme-toggle:active { transform: scale(0.9); }

        .theme-toggle svg {
            width: var(--icon-size);
            height: var(--icon-size);
            color: var(--text-color);
        }

        /* ── Game Board ── */
        .game-area {
            flex: 1 1 auto;
            width: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 0;
        }

        .board-container {
            width: var(--board-size);
            height: var(--board-size);
            background-color: var(--board-bg);
            border-radius: 20px;
            box-shadow: 0 8px 0 var(--shadow);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            text-align: center;
            padding: 20px;
            transition: background-color 0.05s;
        }

        .status-icon {
            font-size: var(--status-icon-size);
            margin-bottom: 8px;
            line-height: 1;
        }

        .status-title {
            font-size: var(--status-title-size);
            font-weight: 800;
            line-height: 1.2;
        }

        .status-sub {
            font-size: var(--status-sub-size);
            font-weight: 700;
            opacity: 0.8;
            margin-top: 8px;
            line-height: 1.3;
        }

        /* Board states */
        .state-wait  { background-color: var(--color-wait); color: #fff; }
        .state-go    { background-color: var(--color-go);   color: #fff; }
        .state-early { background-color: var(--color-early); color: var(--text-color); }
        .state-result { /* uses default --board-bg */ }
    </style>
</head>
<body>

<div class="app-container" id="appContainer">
    <!-- Header -->
    <div class="header">
        <button class="back-btn" onclick="goBack()" title="Back">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <polyline points="15 18 9 12 15 6"></polyline>
            </svg>
        </button>
        <span class="header-title">Reaction</span>
        <div class="header-right">
            <!-- <div class="score-panel" id="scorePanel"> -->
                <!-- 🏆 <span id="bestScore">--</span> ms -->
            <!-- </div> -->
            <button class="theme-toggle" id="themeBtn" title="Change theme">
                <svg id="sunIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"
                    style="display: none;">
                    <circle cx="12" cy="12" r="5"></circle>
                    <line x1="12" y1="1" x2="12" y2="3"></line>
                    <line x1="12" y1="21" x2="12" y2="23"></line>
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                    <line x1="1" y1="12" x2="3" y2="12"></line>
                    <line x1="21" y1="12" x2="23" y2="12"></line>
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                </svg>
                <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                </svg>
            </button>
        </div>
    </div>

    <!-- Game Board -->
    <div class="game-area">
        <div class="board-container" id="gameBoard">
            <div class="status-icon" id="statusIcon">⚡</div>
            <div class="status-title" id="mainText">Tap to start</div>
            <div class="status-sub" id="subText">Wait for green</div>
        </div>
    </div>
</div>

<script>
    function showInterstitialAd() {
        let payload = { action: "showInterstitial" };
        Unity.call(JSON.stringify(payload));
    }

    function showRewardedAd() {
        let payload = { action: "showRewarded" };
        Unity.call(JSON.stringify(payload));
    }

    function closeGame() {
        let payload = { action: "close" };
        Unity.call(JSON.stringify(payload));
    }

    function goBack() {
        closeGame();
    }

    // ── Theme ──
    const themeBtn = document.getElementById('themeBtn');
    const sunIcon = document.getElementById('sunIcon');
    const moonIcon = document.getElementById('moonIcon');

    function updateThemeIcons(theme) {
        sunIcon.style.display = theme === 'dark' ? 'block' : 'none';
        moonIcon.style.display = theme === 'dark' ? 'none' : 'block';
    }

    const savedTheme = localStorage.getItem('brainGamesTheme') || 'light';
    document.documentElement.setAttribute('data-theme', savedTheme);
    updateThemeIcons(savedTheme);

    themeBtn.addEventListener('click', () => {
        const html = document.documentElement;
        const isDark = html.getAttribute('data-theme') === 'dark';
        const newTheme = isDark ? 'light' : 'dark';
        html.setAttribute('data-theme', newTheme);
        localStorage.setItem('brainGamesTheme', newTheme);
        updateThemeIcons(newTheme);
    });

    // ── Adaptive Layout ──
    let safeInsetsCache = { top: 0, bottom: 0, left: 0, right: 0 };
    (function measureSafeInsets() {
        const probe = document.createElement('div');
        probe.style.cssText = 'position:fixed;top:0;left:0;width:0;height:0;' +
            'padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);' +
            'padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);' +
            'visibility:hidden;';
        document.body.appendChild(probe);
        const cs = getComputedStyle(probe);
        safeInsetsCache = {
            top: parseFloat(cs.paddingTop) || 0,
            bottom: parseFloat(cs.paddingBottom) || 0,
            left: parseFloat(cs.paddingLeft) || 0,
            right: parseFloat(cs.paddingRight) || 0
        };
        probe.remove();
    })();

    function applyLayout() {
        const insets = safeInsetsCache;
        const availW = window.innerWidth - insets.left - insets.right;
        const availH = window.innerHeight - insets.top - insets.bottom;

        const margin = Math.round(availH * 0.025);
        const gap = Math.round(availH * 0.018);
        const headerH = Math.round(Math.min(Math.max(availH * 0.075, availH * 0.05), availH * 0.10));
        const usableH = availH - margin * 2 - headerH - gap;
        const usableW = availW - margin * 2;
        const boardSize = Math.max(180, Math.floor(Math.min(usableH, usableW)));

        const root = document.documentElement;
        root.style.setProperty('--margin', margin + 'px');
        root.style.setProperty('--gap', gap + 'px');
        root.style.setProperty('--header-h', headerH + 'px');
        root.style.setProperty('--board-size', boardSize + 'px');

        root.style.setProperty('--btn-size', Math.round(headerH * 0.68) + 'px');
        root.style.setProperty('--icon-size', Math.round(headerH * 0.36) + 'px');
        root.style.setProperty('--title-size', Math.round(headerH * 0.34) + 'px');
        root.style.setProperty('--score-size', Math.round(headerH * 0.26) + 'px');

        root.style.setProperty('--status-icon-size', Math.round(boardSize * 0.14) + 'px');
        root.style.setProperty('--status-title-size', Math.round(boardSize * 0.08) + 'px');
        root.style.setProperty('--status-sub-size', Math.round(boardSize * 0.05) + 'px');
    }

    let layoutTimeout;
    function scheduleLayout() {
        clearTimeout(layoutTimeout);
        layoutTimeout = setTimeout(applyLayout, 30);
    }
    if (window.ResizeObserver) {
        new ResizeObserver(scheduleLayout).observe(document.documentElement);
    } else {
        window.addEventListener('resize', scheduleLayout);
        window.addEventListener('orientationchange', scheduleLayout);
    }
    applyLayout();

    // ── Audio ──
    let audioCtx;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        }
    }

    function playSound(type) {
        if (!audioCtx) return;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'beep') {
            osc.type = 'sine';
            osc.frequency.setValueAtTime(800, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'click') {
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(300, audioCtx.currentTime);
            osc.frequency.exponentialRampToValueAtTime(50, audioCtx.currentTime + 0.1);
            gain.gain.setValueAtTime(0.2, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.1);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.1);
        } else if (type === 'error') {
            osc.type = 'sawtooth';
            osc.frequency.setValueAtTime(150, audioCtx.currentTime);
            gain.gain.setValueAtTime(0.1, audioCtx.currentTime);
            gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.3);
            osc.start();
            osc.stop(audioCtx.currentTime + 0.3);
        }
    }

    // ── Game Logic ──
    const board = document.getElementById('gameBoard');
    const statusIcon = document.getElementById('statusIcon');
    const mainText = document.getElementById('mainText');
    const subText = document.getElementById('subText');
    const bestScoreEl = document.getElementById('bestScore');

    let state = 'idle'; // idle | waiting | go | result
    let timeoutId = null;
    let startTime = 0;
    let bestScore = parseInt(localStorage.getItem('reactionBest')) || null;

    if (bestScore && bestScoreEl) bestScoreEl.textContent = bestScore;

    function setBoardClass(cls) {
        board.className = 'board-container ' + cls;
    }

    function startGame() {
        initAudio();
        playSound('click');
        state = 'waiting';
        setBoardClass('state-wait');
        statusIcon.textContent = '🛑';
        mainText.textContent = 'Wait...';
        subText.textContent = 'Don\'t tap before green';

        const delay = Math.floor(Math.random() * 3000) + 2000; // 2–5 seconds
        timeoutId = setTimeout(() => {
            state = 'go';
            setBoardClass('state-go');
            statusIcon.textContent = '🟢';
            mainText.textContent = 'TAP!';
            subText.textContent = '';
            playSound('beep');
            startTime = performance.now();
        }, delay);
    }

    function handleTap() {
        if (state === 'idle' || state === 'result') {
            startGame();
        } else if (state === 'waiting') {
            clearTimeout(timeoutId);
            playSound('error');
            showInterstitialAd();
            state = 'result';
            setBoardClass('state-early');
            statusIcon.textContent = '⚠️';
            mainText.textContent = 'Too soon!';
            subText.textContent = 'Tap to try again';
        } else if (state === 'go') {
            const reactionTime = Math.round(performance.now() - startTime);
            playSound('click');
            showInterstitialAd();
            state = 'result';
            setBoardClass('state-result');
            statusIcon.textContent = '⏱️';
            mainText.textContent = reactionTime + ' ms';
            subText.textContent = 'Tap to try again';

            if (!bestScore || reactionTime < bestScore) {
                bestScore = reactionTime;
                localStorage.setItem('reactionBest', bestScore);
                if (bestScoreEl) bestScoreEl.textContent = bestScore;
                subText.textContent = '🏆 New record! Tap again';
            }
        }
    }

    // pointerdown — zero-delay, fires before click on all devices
    board.addEventListener('pointerdown', (e) => {
        e.preventDefault();
        handleTap();
    });
</script>
</body>
</html>
