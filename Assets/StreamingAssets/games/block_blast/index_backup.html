<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Block Blast</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #1c2331;
            --board-bg: #e2e8f0;
            --cell-bg: #cbd5e1;
            --primary: #06D6A0;
            --shadow: rgba(0, 0, 0, 0.1);
        }

        [data-theme="dark"] {
            --bg-color: #1A1A24;
            --text-color: #F8F9FA;
            --board-bg: #2A2A38;
            --cell-bg: #353546;
            --shadow: rgba(0, 0, 0, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        body {
            background: var(--bg-color);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100dvh;
            padding-top: calc(64px + env(safe-area-inset-top, 0px));
            padding-bottom: env(safe-area-inset-bottom, 0px);
            overflow: hidden;
            transition: background 0.3s;
        }

        .app-container {
            width: 100%;
            max-width: min(100%, calc(100dvh - 220px));
            padding: 20px;
            display: flex;
            flex-direction: column;
            gap: 16px;
            position: relative;
        }

        /* Top bar */
        .header {
            position: fixed;
            top: env(safe-area-inset-top, 0px);
            left: 50%;
            transform: translateX(-50%);
            width: 100%;
            margin-top: 20px;
            max-width: min(100%, calc(100dvh - 220px));
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            padding: 0 20px;
            background: var(--bg-color);
            z-index: 50;
            transition: background 0.3s;
        }

        .back-btn {
            width: 44px;
            height: 44px;
            min-width: 44px;
            border-radius: 50%;
            border: none;
            background: var(--board-bg);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 12px var(--shadow);
            transition: transform 0.1s, background 0.3s;
            -webkit-tap-highlight-color: transparent;
        }

        .back-btn:active {
            transform: scale(0.9);
        }

        .header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.4rem;
            font-weight: 800;
            letter-spacing: 1px;
            line-height: 1;
            color: var(--text-color);
            white-space: nowrap;
            pointer-events: none;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .theme-toggle {
            width: 44px;
            height: 44px;
            min-width: 44px;
            border-radius: 50%;
            border: none;
            background: var(--board-bg);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 12px var(--shadow);
            transition: transform 0.1s, background 0.3s;
            -webkit-tap-highlight-color: transparent;
        }

        .theme-toggle:active {
            transform: scale(0.9);
        }

        .theme-toggle svg {
            width: 24px;
            height: 24px;
            color: var(--text-color);
        }

        .score-panel {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--board-bg);
            padding: 8px 14px;
            border-radius: 25px;
            box-shadow: 0 4px 12px var(--shadow);
            font-size: 1rem;
            font-weight: bold;
            white-space: nowrap;
        }

        .board-wrapper {
            background: var(--board-bg);
            padding: 10px;
            border-radius: 12px;
            box-shadow: 0 8px var(--shadow);
        }

        .board {
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: 3px;
            aspect-ratio: 1;
        }

        .cell {
            background: var(--cell-bg);
            border-radius: 6px;
            transition: transform 0.1s, opacity 0.1s;
        }

        .cell.filled {
            box-shadow: inset 0 -4px rgba(0, 0, 0, 0.2);
        }

        /* Спеціальні ефекти підсвічування та згоряння */
        .cell.highlight-valid {
            background: var(--preview-color) !important;
            opacity: 0.85;
            filter: brightness(0.65);
        }

        .cell.highlight-invalid {
            background: #ef4444 !important;
            opacity: 0.7;
        }

        .cell.clearing {
            background: #ffffff !important;
            transform: scale(1.15);
            opacity: 0.8;
            z-index: 10;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
        }

        .hand {
            display: flex;
            justify-content: space-around;
            align-items: center;
            height: 120px;
            background: var(--board-bg);
            border-radius: 12px;
            padding: 10px;
            box-shadow: 0 8px var(--shadow);
        }

        .shape-container {
            position: relative;
            width: 80px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .shape {
            display: grid;
            gap: 2px;
            cursor: grab;
        }

        .shape-block {
            width: 20px;
            height: 20px;
            border-radius: 4px;
            box-shadow: inset 0 -3px rgba(0, 0, 0, 0.2);
        }

        /* Dragging styles - тепер зміщено вгору через JS */
        .shape.dragging {
            position: fixed;
            z-index: 100;
            pointer-events: none;
            transform: scale(1.5) translate(-50%, -50%);
            transform-origin: center;
            transition: transform 0.1s;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        .modal-content {
            background: var(--bg-color);
            padding: 40px;
            border-radius: 20px;
            text-align: center;
            box-shadow: 0 10px 30px var(--shadow);
        }

        .btn {
            padding: 15px 40px;
            border-radius: 20px;
            border: none;
            background: var(--primary);
            color: #fff;
            font-size: 20px;
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>

    <div class="app-container">
        <!-- Top bar -->
        <div class="header">
            <button class="back-btn" id="backBtn" onclick="goBack()" title="Back">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <span class="header-title">Block Blast</span>
            <div class="header-right">
                <div class="score-panel">
                    ⭐ <span id="score">0</span>
                </div>
                <button class="theme-toggle" id="themeBtn" title="Change theme">
                    <svg id="sunIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" style="display: none;">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </div>
        </div>

        <div class="board-wrapper">
            <div class="board" id="board"></div>
        </div>

        <div class="hand" id="hand"></div>
    </div>

    <div class="modal" id="gameOverModal">
        <div class="modal-content">
            <h2 style="font-size: 36px; margin-bottom: 10px;">Game Over</h2>
            <p style="font-size: 20px;">Your score: <span id="finalScore"
                    style="font-weight: bold; color: var(--primary);">0</span></p>
            <button class="btn" onclick="location.reload()">Play Again</button>
        </div>
    </div>

    <script>
        // --- AUDIO ENGINE ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (!audioCtx) return;
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            if (type === 'place') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, t);
                osc.frequency.exponentialRampToValueAtTime(100, t + 0.06);
                gain.gain.setValueAtTime(0.12, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
                osc.start(t); osc.stop(t + 0.1);
            } else if (type === 'clear') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, t);
                osc.frequency.exponentialRampToValueAtTime(500, t + 0.12);
                gain.gain.setValueAtTime(0.08, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
                osc.start(t); osc.stop(t + 0.18);
            }
        }

        const GRID_SIZE = 8;
        const boardEl = document.getElementById('board');
        const handEl = document.getElementById('hand');
        const scoreEl = document.getElementById('score');
        let grid = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(0));
        let score = 0;
        let streak = 0;

        // --- BACK BUTTON ---
        function goBack() {
            if (typeof unityInstance !== 'undefined' && unityInstance) {
                unityInstance.SendMessage('WebViewBridge', 'OnBackPressed');
            }
            if (window.history.length > 1) window.history.back();
        }

        // --- THEME ---
        const themeBtn = document.getElementById('themeBtn');
        const sunIcon = document.getElementById('sunIcon');
        const moonIcon = document.getElementById('moonIcon');

        function updateThemeIcons(theme) {
            sunIcon.style.display = theme === 'dark' ? 'block' : 'none';
            moonIcon.style.display = theme === 'dark' ? 'none' : 'block';
        }

        const savedTheme = localStorage.getItem('brainGamesTheme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeIcons(savedTheme);

        themeBtn.addEventListener('click', () => {
            const html = document.documentElement;
            const isDark = html.getAttribute('data-theme') === 'dark';
            const newTheme = isDark ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('brainGamesTheme', newTheme);
            updateThemeIcons(newTheme);
        });

        for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
                let cell = document.createElement('div');
                cell.className = 'cell';
                cell.id = `cell-${r}-${c}`;
                boardEl.appendChild(cell);
            }
        }

        // --- SHAPES LIBRARY (weight categories) ---
        const shapesLib = [
            { matrix: [[1]], color: '#EF476F', weight: 'simple' },
            { matrix: [[1, 1]], color: '#FFD166', weight: 'simple' },
            { matrix: [[1], [1]], color: '#FFD166', weight: 'simple' },
            { matrix: [[1, 1, 1]], color: '#06D6A0', weight: 'simple' },
            { matrix: [[1], [1], [1]], color: '#06D6A0', weight: 'simple' },
            { matrix: [[1, 1, 1, 1]], color: '#06D6A0', weight: 'simple' },
            { matrix: [[1], [1], [1], [1]], color: '#06D6A0', weight: 'simple' },
            { matrix: [[1, 1], [1, 1]], color: '#118AB2', weight: 'simple' },
            { matrix: [[1, 0], [1, 1]], color: '#9D4EDD', weight: 'medium' },
            { matrix: [[0, 1], [1, 1]], color: '#9D4EDD', weight: 'medium' },
            { matrix: [[1, 1], [1, 0]], color: '#9D4EDD', weight: 'medium' },
            { matrix: [[1, 1], [0, 1]], color: '#9D4EDD', weight: 'medium' },
            { matrix: [[1, 1, 1], [0, 1, 0]], color: '#F78C6B', weight: 'medium' },
            { matrix: [[0, 1], [1, 1], [0, 1]], color: '#F78C6B', weight: 'medium' },
            { matrix: [[1, 1, 1], [1, 0, 0], [1, 0, 0]], color: '#FF9F1C', weight: 'hard' },
            { matrix: [[1, 1, 1], [0, 0, 1], [0, 0, 1]], color: '#FF9F1C', weight: 'hard' },
            { matrix: [[0, 0, 1], [0, 0, 1], [1, 1, 1]], color: '#FF9F1C', weight: 'hard' },
            { matrix: [[1, 0, 0], [1, 0, 0], [1, 1, 1]], color: '#FF9F1C', weight: 'hard' },
            { matrix: [[1, 1, 0], [0, 1, 1]], color: '#45CB85', weight: 'hard' },
            { matrix: [[0, 1, 1], [1, 1, 0]], color: '#45CB85', weight: 'hard' },
            { matrix: [[1, 1, 1], [1, 1, 1], [1, 1, 1]], color: '#118AB2', weight: 'hard' },
            { matrix: [[1, 1, 1, 1, 1]], color: '#06D6A0', weight: 'hard' },
            { matrix: [[1], [1], [1], [1], [1]], color: '#06D6A0', weight: 'hard' }
        ];

        let currentHand = [];

        function canPlaceAnywhere(matrix) {
            for (let r = 0; r <= GRID_SIZE - matrix.length; r++) {
                for (let c = 0; c <= GRID_SIZE - matrix[0].length; c++) {
                    if (canPlace(r, c, matrix)) return true;
                }
            }
            return false;
        }

        function countEmptyCells() {
            let count = 0;
            for (let r = 0; r < GRID_SIZE; r++)
                for (let c = 0; c < GRID_SIZE; c++)
                    if (grid[r][c] === 0) count++;
            return count;
        }

        function getDynamicWeights() {
            const emptyRatio = countEmptyCells() / (GRID_SIZE * GRID_SIZE);
            const comboFactor = Math.min(streak, 5);
            const scoreFactor = Math.min(score / 500, 3);
            let wSimple = 40 - comboFactor * 4 - scoreFactor * 5;
            let wMedium = 20 + comboFactor * 2 + scoreFactor * 2;
            let wHard = 10 + comboFactor * 2 + scoreFactor * 3;
            if (emptyRatio < 0.25) {
                if (score < 300) { wSimple += 20; wHard = Math.max(1, wHard - 8); }
                else { wHard += 15; wSimple = Math.max(1, wSimple - 15); }
            }
            if (emptyRatio < 0.4 && emptyRatio > 0.15) { wHard += 5; wMedium += 3; }
            return { simple: Math.max(1, wSimple), medium: Math.max(1, wMedium), hard: Math.max(1, wHard) };
        }

        function pickShapeByWeight(weights, excludeShapes) {
            const filtered = shapesLib.filter(s => !excludeShapes.includes(s));
            const simplePool = filtered.filter(s => s.weight === 'simple');
            const mediumPool = filtered.filter(s => s.weight === 'medium');
            const hardPool = filtered.filter(s => s.weight === 'hard');
            const pool = [];
            for (let i = 0; i < Math.round(weights.simple); i++) pool.push('simple');
            for (let i = 0; i < Math.round(weights.medium); i++) pool.push('medium');
            for (let i = 0; i < Math.round(weights.hard); i++) pool.push('hard');
            const chosen = pool[Math.floor(Math.random() * pool.length)];
            let candidates;
            if (chosen === 'simple') candidates = simplePool.length > 0 ? simplePool : filtered;
            else if (chosen === 'medium') candidates = mediumPool.length > 0 ? mediumPool : filtered;
            else candidates = hardPool.length > 0 ? hardPool : filtered;
            if (candidates.length === 0) candidates = filtered;
            return candidates[Math.floor(Math.random() * candidates.length)];
        }

        function generateHand() {
            handEl.innerHTML = '';
            currentHand = [];
            const weights = getDynamicWeights();
            let attempts = 0;
            while (currentHand.length < 3 && attempts < 200) {
                attempts++;
                const exclude = currentHand.filter(s => s.weight === 'hard');
                const shapeObj = pickShapeByWeight(weights, exclude);
                if (!canPlaceAnywhere(shapeObj.matrix)) continue;
                if (shapeObj.weight === 'hard' && currentHand.filter(s => s.weight === 'hard').length >= 1) {
                    if (attempts % 3 !== 0) continue;
                }
                currentHand.push(shapeObj);
                createShapeElement(shapeObj, currentHand.length - 1);
            }
            while (currentHand.length < 3) {
                const fb = shapesLib[Math.floor(Math.random() * shapesLib.length)];
                currentHand.push(fb);
                createShapeElement(fb, currentHand.length - 1);
            }
            checkGameOver();
        }

        function createShapeElement(shapeObj, index) {
            const container = document.createElement('div');
            container.className = 'shape-container';
            const shapeEl = document.createElement('div');
            shapeEl.className = 'shape';
            shapeEl.dataset.index = index;
            shapeEl.style.gridTemplateColumns = `repeat(${shapeObj.matrix[0].length}, 20px)`;
            shapeObj.matrix.forEach(row => {
                row.forEach(val => {
                    const block = document.createElement('div');
                    if (val) { block.className = 'shape-block'; block.style.background = shapeObj.color; }
                    shapeEl.appendChild(block);
                });
            });
            setupDrag(shapeEl, shapeObj, container);
            container.appendChild(shapeEl);
            handEl.appendChild(container);
        }

        function setupDrag(el, shapeObj, container) {
            let isDragging = false;
            el.addEventListener('pointerdown', (e) => {
                isDragging = true;
                el.setPointerCapture(e.pointerId);
                el.classList.add('dragging');
                moveAt(e.clientX, e.clientY);
            });
            el.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                moveAt(e.clientX, e.clientY);
                clearHighlights();
                const cellInfo = getTargetCellMath(e.clientX, e.clientY, shapeObj.matrix);
                if (cellInfo) highlightGrid(cellInfo.r, cellInfo.c, shapeObj);
            });
            el.addEventListener('pointerup', (e) => {
                if (!isDragging) return;
                isDragging = false;
                el.releasePointerCapture(e.pointerId);
                el.classList.remove('dragging');
                el.style.left = 'auto'; el.style.top = 'auto';
                const cellInfo = getTargetCellMath(e.clientX, e.clientY, shapeObj.matrix);
                if (cellInfo && canPlace(cellInfo.r, cellInfo.c, shapeObj.matrix)) {
                    placeShape(cellInfo.r, cellInfo.c, shapeObj);
                    currentHand[el.dataset.index] = null;
                    container.innerHTML = '';
                    if (currentHand.every(s => s === null)) generateHand();
                    else checkGameOver();
                }
                clearHighlights();
            });
            function moveAt(pageX, pageY) {
                el.style.left = pageX + 'px';
                el.style.top = (pageY - 80) + 'px';
            }
        }

        function getTargetCellMath(x, y, matrix) {
            const boardRect = boardEl.getBoundingClientRect();
            const cellW = boardRect.width / GRID_SIZE;
            const visualX = x;
            const visualY = y - 80;
            if (visualX < boardRect.left - cellW || visualX > boardRect.right + cellW ||
                visualY < boardRect.top - cellW || visualY > boardRect.bottom + cellW) return null;
            const centerC = Math.floor((visualX - boardRect.left) / cellW);
            const centerR = Math.floor((visualY - boardRect.top) / cellW);
            let startR = centerR - Math.floor(matrix.length / 2);
            let startC = centerC - Math.floor(matrix[0].length / 2);
            startR = Math.max(0, Math.min(GRID_SIZE - matrix.length, startR));
            startC = Math.max(0, Math.min(GRID_SIZE - matrix[0].length, startC));
            return { r: startR, c: startC };
        }

        function canPlace(startR, startC, matrix) {
            for (let r = 0; r < matrix.length; r++) {
                for (let c = 0; c < matrix[0].length; c++) {
                    if (matrix[r][c]) {
                        let br = startR + r, bc = startC + c;
                        if (br < 0 || br >= GRID_SIZE || bc < 0 || bc >= GRID_SIZE) return false;
                        if (grid[br][bc] !== 0) return false;
                    }
                }
            }
            return true;
        }

        function highlightGrid(startR, startC, shapeObj) {
            const matrix = shapeObj.matrix;
            const valid = canPlace(startR, startC, matrix);
            const hClass = valid ? 'highlight-valid' : 'highlight-invalid';
            for (let r = 0; r < matrix.length; r++) {
                for (let c = 0; c < matrix[0].length; c++) {
                    if (matrix[r][c]) {
                        let br = startR + r, bc = startC + c;
                        if (br >= 0 && br < GRID_SIZE && bc >= 0 && bc < GRID_SIZE) {
                            const cell = document.getElementById(`cell-${br}-${bc}`);
                            cell.classList.add(hClass);
                            if (valid) cell.style.setProperty('--preview-color', shapeObj.color);
                        }
                    }
                }
            }
        }

        function clearHighlights() {
            document.querySelectorAll('.cell').forEach(c => c.classList.remove('highlight-valid', 'highlight-invalid'));
        }

        function placeShape(startR, startC, shapeObj) {
            let blocksPlaced = 0;
            const matrix = shapeObj.matrix;
            for (let r = 0; r < matrix.length; r++) {
                for (let c = 0; c < matrix[0].length; c++) {
                    if (matrix[r][c]) {
                        grid[startR + r][startC + c] = shapeObj.color;
                        const cell = document.getElementById(`cell-${startR + r}-${startC + c}`);
                        cell.classList.add('filled');
                        cell.style.background = shapeObj.color;
                        blocksPlaced++;
                    }
                }
            }
            score += blocksPlaced;
            scoreEl.innerText = score;
            initAudio();
            playSound('place');
            checkClears();
        }

        function checkClears() {
            let rowsToClear = [], colsToClear = [];
            for (let r = 0; r < GRID_SIZE; r++) { if (grid[r].every(val => val !== 0)) rowsToClear.push(r); }
            for (let c = 0; c < GRID_SIZE; c++) {
                let colFull = true;
                for (let r = 0; r < GRID_SIZE; r++) { if (grid[r][c] === 0) { colFull = false; break; } }
                if (colFull) colsToClear.push(c);
            }
            const totalLines = rowsToClear.length + colsToClear.length;
            if (totalLines > 0) {
                initAudio();
                playSound('clear');
                streak++;
                score += (100 * totalLines) * totalLines * streak;
                scoreEl.innerText = score;
                const cellsToClear = new Set();
                rowsToClear.forEach(r => { for (let c = 0; c < GRID_SIZE; c++) { grid[r][c] = 0; cellsToClear.add(`cell-${r}-${c}`); } });
                colsToClear.forEach(c => { for (let r = 0; r < GRID_SIZE; r++) { grid[r][c] = 0; cellsToClear.add(`cell-${r}-${c}`); } });
                cellsToClear.forEach(id => { document.getElementById(id).classList.add('clearing'); });
                setTimeout(() => {
                    cellsToClear.forEach(id => {
                        const cell = document.getElementById(id);
                        cell.classList.remove('filled', 'clearing');
                        cell.style.background = '';
                    });
                }, 200);
            } else { streak = 0; }
        }

        function checkGameOver() {
            const availableShapes = currentHand.filter(s => s !== null);
            for (let shapeObj of availableShapes) {
                for (let r = 0; r < GRID_SIZE; r++) {
                    for (let c = 0; c < GRID_SIZE; c++) {
                        if (canPlace(r, c, shapeObj.matrix)) return;
                    }
                }
            }
            if (availableShapes.length > 0) {
                setTimeout(() => {
                    document.getElementById('finalScore').innerText = score;
                    document.getElementById('gameOverModal').style.display = 'flex';
                }, 300);
            }
        }

        generateHand();
    </script>
</body>

</html>
