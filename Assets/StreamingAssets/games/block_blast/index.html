<!DOCTYPE html>
<html lang="en" data-theme="light">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Block Blast</title>
    <style>
        :root {
            --bg-color: #f8f9fa;
            --text-color: #1c2331;
            --board-bg: #e2e8f0;
            --cell-bg: #cbd5e1;
            --primary: #06D6A0;
            --shadow: rgba(0, 0, 0, 0.1);

            /* ==== Всё, что ниже, выставляется в JS функцией applyLayout().
               Значения по умолчанию — просто чтобы страница не "прыгала"
               до первого расчёта. Каждое значение — конкретный px,
               посчитанный из реального innerWidth/innerHeight на этот кадр,
               а не единый общий "scale" на всё подряд. ==== */
            --margin: 16px;
            --gap: 12px;
            --header-h: 64px;
            --tray-h: 120px;
            --tray-w: 120px;
            --board-size: 320px;
            --btn-size: 44px;
            --icon-size: 22px;
            --title-size: 22px;
            --score-size: 18px;
            --cell-gap: 3px;
            --shape-block: 20px;
            --shape-gap: 2px;
        }

        [data-theme="dark"] {
            --bg-color: #1A1A24;
            --text-color: #F8F9FA;
            --board-bg: #2A2A38;
            --cell-bg: #353546;
            --shadow: rgba(0, 0, 0, 0.2);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Nunito', sans-serif;
            touch-action: none;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            background: var(--bg-color);
            color: var(--text-color);
            overflow: hidden;
            transition: background 0.3s;
        }

        /* Корневой контейнер игры. Ничего не центрируется "само по себе" через
           flex/margin — все размеры и позиции ставит JS (calcLayout),
           поэтому контейнер просто на весь экран. */
        .app-container {
            position: fixed;
            inset: 0;
            padding-top: calc(var(--margin) + env(safe-area-inset-top, 0px));
            padding-bottom: calc(var(--margin) + env(safe-area-inset-bottom, 0px));
            padding-left: calc(var(--margin) + env(safe-area-inset-left, 0px));
            padding-right: calc(var(--margin) + env(safe-area-inset-right, 0px));
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--gap);
        }

        /* Top bar. Высота, шрифты и кнопки — все в var(), посчитаны от
           реальной доступной высоты экрана в JS. */
        .header {
            width: 100%;
            max-width: calc(var(--board-size) + 2px);
            height: var(--header-h);
            flex: 0 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            position: relative;
        }

        .back-btn {
            width: var(--btn-size);
            height: var(--btn-size);
            min-width: var(--btn-size);
            border-radius: 50%;
            border: none;
            background: var(--board-bg);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 12px var(--shadow);
            transition: transform 0.1s, background 0.3s;
            -webkit-tap-highlight-color: transparent;
        }

        .back-btn:active {
            transform: scale(0.9);
        }

        .back-btn svg {
            width: var(--icon-size);
            height: var(--icon-size);
        }

        .header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: var(--title-size);
            font-weight: 800;
            letter-spacing: 1px;
            line-height: 1;
            color: var(--text-color);
            white-space: nowrap;
            pointer-events: none;
        }

        .header-right {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .theme-toggle {
            width: var(--btn-size);
            height: var(--btn-size);
            min-width: var(--btn-size);
            border-radius: 50%;
            border: none;
            background: var(--board-bg);
            color: var(--text-color);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            box-shadow: 0 4px 12px var(--shadow);
            transition: transform 0.1s, background 0.3s;
            -webkit-tap-highlight-color: transparent;
        }

        .theme-toggle:active {
            transform: scale(0.9);
        }

        .theme-toggle svg {
            width: var(--icon-size);
            height: var(--icon-size);
            color: var(--text-color);
        }

        .score-panel {
            display: flex;
            align-items: center;
            gap: 6px;
            background: var(--board-bg);
            padding: var(--score-pad-v) var(--score-pad-h);
            border-radius: var(--score-radius);
            box-shadow: 0 4px 12px var(--shadow);
            font-size: var(--score-size);
            font-weight: bold;
            white-space: nowrap;
        }

        /* Игровая зона: доска + трей. В портрете — колонка, в ландшафте — строка.
           Это именно то, чего не было в исходнике: разные КОМПОЗИЦИИ экрана,
           а не одна и та же, просто сжатая. */
        .game-area {
            flex: 1 1 auto;
            width: 100%;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: var(--gap);
            min-height: 0;
        }

        .app-container.landscape .game-area {
            flex-direction: row;
        }

        .board-wrapper {
            background: var(--board-bg);
            padding: var(--board-padding);
            border-radius: var(--board-radius);
            box-shadow: 0 8px var(--shadow);
            width: var(--board-size);
            height: var(--board-size);
            flex: 0 0 auto;
        }

        .board {
            width: 100%;
            height: 100%;
            display: grid;
            grid-template-columns: repeat(8, 1fr);
            gap: var(--cell-gap);
        }

        .cell {
            background: var(--cell-bg);
            border-radius: var(--cell-radius);
            transition: transform 0.1s, opacity 0.1s;
        }

        .cell.filled {
            box-shadow: inset 0 -4px rgba(0, 0, 0, 0.2);
        }

        .cell.highlight-valid {
            background: var(--preview-color) !important;
            opacity: 0.85;
            filter: brightness(0.65);
        }

        .cell.clearing {
            background: #ffffff !important;
            transform: scale(1.15);
            opacity: 0.8;
            z-index: 10;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.8);
        }

        /* Трей с фигурами — без подложки, только контейнер */
        .hand {
            display: flex;
            flex: 0 0 auto;
            justify-content: space-around;
            align-items: center;
            width: 100%;
            max-width: var(--board-size);
            height: var(--tray-h);
        }

        .app-container.landscape .hand {
            flex-direction: column;
            width: var(--tray-w);
            max-width: none;
            height: var(--board-size);
        }

        .shape-container {
            position: relative;
            width: calc(var(--shape-block) * 4);
            height: calc(var(--shape-block) * 4);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: grab;
        }

        .shape {
            display: grid;
            gap: var(--shape-gap);
        }

        .shape-block {
            width: var(--shape-block);
            height: var(--shape-block);
            border-radius: var(--shape-radius);
            box-shadow: inset 0 -3px rgba(0, 0, 0, 0.2);
        }

        .shape.dragging {
            position: fixed;
            z-index: 100;
            pointer-events: none;
            transform: scale(1.5) translate(-50%, -50%);
            transform-origin: center;
            transition: transform 0.1s;
        }

        .modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(5px);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 200;
        }

        .modal-content {
            background: var(--bg-color);
            padding: var(--modal-padding);
            border-radius: var(--modal-radius);
            text-align: center;
            box-shadow: 0 10px 30px var(--shadow);
        }

        .btn {
            padding: var(--modal-padding) calc(var(--modal-padding) * 1.5);
            border-radius: var(--modal-radius);
            border: none;
            background: var(--primary);
            color: #fff;
            font-size: var(--modal-btn-size);
            font-weight: bold;
            margin-top: 20px;
            cursor: pointer;
            transition: transform 0.1s;
        }

        .btn:active {
            transform: scale(0.95);
        }
    </style>
</head>

<body>

    <div class="app-container" id="appContainer">
        <!-- Top bar -->
        <div class="header">
            <button class="back-btn" id="backBtn" onclick="goBack()" title="Back">
                <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <polyline points="15 18 9 12 15 6"></polyline>
                </svg>
            </button>
            <span class="header-title">Block Blast</span>
            <div class="header-right">
                <!-- <div class="score-panel"> -->
                    <!-- ⭐ <span id="score">0</span> -->
                <!-- </div> -->
                <button class="theme-toggle" id="themeBtn" title="Change theme">
                    <svg id="sunIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" style="display: none;">
                        <circle cx="12" cy="12" r="5"></circle>
                        <line x1="12" y1="1" x2="12" y2="3"></line>
                        <line x1="12" y1="21" x2="12" y2="23"></line>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
                        <line x1="1" y1="12" x2="3" y2="12"></line>
                        <line x1="21" y1="12" x2="23" y2="12"></line>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
                    </svg>
                    <svg id="moonIcon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24"
                        fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>
                    </svg>
                </button>
            </div>
        </div>

        <div class="game-area" id="gameArea">
            <div class="board-wrapper">
                <div class="board" id="board"></div>
            </div>

            <div class="hand" id="hand"></div>
        </div>
    </div>

    <div class="modal" id="gameOverModal">
        <div class="modal-content">
            <h2 style="font-size: var(--modal-title-size); margin-bottom: 10px;">Game Over</h2>
            <p style="font-size: var(--modal-text-size);">Your score: <span id="finalScore"
                    style="font-weight: bold; color: var(--primary);">0</span></p>
            <button class="btn" onclick="location.reload()">Play Again</button>
        </div>
    </div>

    <script>
        // --- AUDIO ENGINE ---
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
            if (audioCtx.state === 'suspended') audioCtx.resume();
        }

        function playSound(type) {
            if (!audioCtx) return;
            const t = audioCtx.currentTime;
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);
            if (type === 'place') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(200, t);
                osc.frequency.exponentialRampToValueAtTime(100, t + 0.06);
                gain.gain.setValueAtTime(0.12, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.1);
                osc.start(t); osc.stop(t + 0.1);
            } else if (type === 'clear') {
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, t);
                osc.frequency.exponentialRampToValueAtTime(500, t + 0.12);
                gain.gain.setValueAtTime(0.08, t);
                gain.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
                osc.start(t); osc.stop(t + 0.18);
            }
        }

        const GRID_SIZE = 8;
        const boardEl = document.getElementById('board');
        const handEl = document.getElementById('hand');
        const scoreEl = document.getElementById('score');
        const appContainer = document.getElementById('appContainer');
        let grid = Array(GRID_SIZE).fill().map(() => Array(GRID_SIZE).fill(0));
        let score = 0;
        let streak = 0;

        // --- BACK BUTTON ---
        function goBack() {
            if (typeof unityInstance !== 'undefined' && unityInstance) {
                unityInstance.SendMessage('WebViewBridge', 'OnBackPressed');
            }
            if (window.history.length > 1) window.history.back();
        }

        // --- THEME ---
        const themeBtn = document.getElementById('themeBtn');
        const sunIcon = document.getElementById('sunIcon');
        const moonIcon = document.getElementById('moonIcon');

        function updateThemeIcons(theme) {
            sunIcon.style.display = theme === 'dark' ? 'block' : 'none';
            moonIcon.style.display = theme === 'dark' ? 'none' : 'block';
        }

        const savedTheme = localStorage.getItem('brainGamesTheme') || 'light';
        document.documentElement.setAttribute('data-theme', savedTheme);
        updateThemeIcons(savedTheme);

        themeBtn.addEventListener('click', () => {
            const html = document.documentElement;
            const isDark = html.getAttribute('data-theme') === 'dark';
            const newTheme = isDark ? 'light' : 'dark';
            html.setAttribute('data-theme', newTheme);
            localStorage.setItem('brainGamesTheme', newTheme);
            updateThemeIcons(newTheme);
        });

        for (let r = 0; r < GRID_SIZE; r++) {
            for (let c = 0; c < GRID_SIZE; c++) {
                let cell = document.createElement('div');
                cell.className = 'cell';
                cell.id = `cell-${r}-${c}`;
                boardEl.appendChild(cell);
            }
        }

        // =====================================================================
        // РЕСПОНЗИВНЫЙ ЛЕЙАУТ (по образцу calcLayout() из Konva-игры)
        //
        // Идея: НИЧЕГО не завязано на один общий "scale" и нет эталонного
        // canvas-разрешения. При каждом resize мы заново считаем реальные px
        // всех ключевых блоков как доли от актуального innerWidth/innerHeight,
        // отдельно для портретной и альбомной ориентации — потому что это не
        // одна и та же композиция, сжатая в размере, а два разных расклада.
        // =====================================================================

        const LAYOUT_CFG = {
            portrait: {
                marginRatio: 0.025,   // отступы контейнера, доля от доступной высоты
                gapRatio: 0.018,      // зазор между header/доской/треем
                headerRatio: 0.075,   // высота хедера
                headerMinRatio: 0.05, headerMaxRatio: 0.10,
                trayRatio: 0.175,     // высота трея с фигурами
                trayMinRatio: 0.20, trayMaxRatio: 0.36,
            },
            landscape: {
                marginRatio: 0.035,
                gapRatio: 0.03,
                headerRatio: 0.12,
                headerMinRatio: 0.06, headerMaxRatio: 0.14,
                trayWidthRatio: 0.17, // в ландшафте трей — вертикальная колонка сбоку
                trayMinRatio: 0.15, trayMaxRatio: 0.30,
            }
        };

        function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

        // Разово меряем safe-area через служебный div (надёжнее, чем парсить env() в JS).
        let safeInsetsCache = { top: 0, bottom: 0, left: 0, right: 0 };
        (function measureSafeInsets() {
            const probe = document.createElement('div');
            probe.style.cssText = 'position:fixed;top:0;left:0;width:0;height:0;' +
                'padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);' +
                'padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);' +
                'visibility:hidden;';
            document.body.appendChild(probe);
            const cs = getComputedStyle(probe);
            safeInsetsCache = {
                top: parseFloat(cs.paddingTop) || 0,
                bottom: parseFloat(cs.paddingBottom) || 0,
                left: parseFloat(cs.paddingLeft) || 0,
                right: parseFloat(cs.paddingRight) || 0
            };
            probe.remove();
        })();

        // Смещение фигуры над пальцем при драге — раньше было хардкод -80px.
        // Теперь считается от реального размера трея/хедера, чтобы всегда
        // поднимать фигуру ровно настолько, чтобы её не закрывал палец,
        // вне зависимости от экрана.
        let DRAG_LIFT = 80;

        function calcLayout() {
            const insets = safeInsetsCache;
            const availW = window.innerWidth - insets.left - insets.right;
            const availH = window.innerHeight - insets.top - insets.bottom;
            const isPortrait = availH >= availW;
            const cfg = isPortrait ? LAYOUT_CFG.portrait : LAYOUT_CFG.landscape;

            const margin = Math.round(availH * cfg.marginRatio);
            const gap = Math.round(availH * cfg.gapRatio);
            const headerH = Math.round(clamp(availH * cfg.headerRatio, availH * cfg.headerMinRatio, availH * cfg.headerMaxRatio));

            let trayH, trayW, boardSize;

            if (isPortrait) {
                trayH = Math.round(clamp(availH * cfg.trayRatio, availH * cfg.trayMinRatio, availH * cfg.trayMaxRatio));
                const usableH = availH - margin * 2 - headerH - trayH - gap * 2;
                const usableW = availW - margin * 2;
                boardSize = Math.max(180, Math.floor(Math.min(usableH, usableW)));
                trayW = boardSize;
            } else {
                trayW = Math.round(clamp(availW * cfg.trayWidthRatio, availW * cfg.trayMinRatio, availW * cfg.trayMaxRatio));
                const usableH = availH - margin * 2 - headerH - gap;
                const usableW = availW - margin * 2 - trayW - gap;
                boardSize = Math.max(180, Math.floor(Math.min(usableH, usableW)));
                trayH = boardSize;
            }

            return { isPortrait, margin, gap, headerH, trayH, trayW, boardSize };
        }

        function applyLayout() {
            const L = calcLayout();
            const root = document.documentElement;

            appContainer.classList.toggle('landscape', !L.isPortrait);
            appContainer.classList.toggle('portrait', L.isPortrait);

            const cellSize = L.boardSize / GRID_SIZE;

            root.style.setProperty('--margin', L.margin + 'px');
            root.style.setProperty('--gap', L.gap + 'px');
            root.style.setProperty('--header-h', L.headerH + 'px');
            root.style.setProperty('--tray-h', L.trayH + 'px');
            root.style.setProperty('--tray-w', L.trayW + 'px');
            root.style.setProperty('--board-size', L.boardSize + 'px');

            // Кнопки/иконки/шрифты хедера — доля от высоты хедера (а не от cellSize),
            // потому что визуально они принадлежат хедеру, а не доске.
            root.style.setProperty('--btn-size', Math.round(L.headerH * 0.68) + 'px');
            root.style.setProperty('--icon-size', Math.round(L.headerH * 0.36) + 'px');
            root.style.setProperty('--title-size', Math.round(L.headerH * 0.34) + 'px');
            root.style.setProperty('--score-size', Math.round(L.headerH * 0.28) + 'px');

            // Клетки доски и блоки фигур — доля от реального размера клетки,
            // посчитанного из итогового boardSize.
            root.style.setProperty('--cell-gap', Math.max(2, Math.round(cellSize * 0.05)) + 'px');
            root.style.setProperty('--shape-block', Math.round(cellSize * 0.40) + 'px');
            root.style.setProperty('--shape-gap', Math.max(1, Math.round(cellSize * 0.05)) + 'px');

            // Скругления и отступы — доли от boardSize
            root.style.setProperty('--board-padding', Math.round(L.boardSize * 0.028) + 'px');
            root.style.setProperty('--board-radius', Math.round(L.boardSize * 0.035) + 'px');
            root.style.setProperty('--cell-radius', Math.round(cellSize * 0.14) + 'px');
            root.style.setProperty('--shape-radius', Math.round(cellSize * 0.07) + 'px');

            // Модальное окно
            root.style.setProperty('--modal-padding', Math.round(L.boardSize * 0.07) + 'px');
            root.style.setProperty('--modal-radius', Math.round(L.boardSize * 0.05) + 'px');
            root.style.setProperty('--modal-title-size', Math.round(L.boardSize * 0.065) + 'px');
            root.style.setProperty('--modal-text-size', Math.round(L.boardSize * 0.04) + 'px');
            root.style.setProperty('--modal-btn-size', Math.round(L.boardSize * 0.042) + 'px');

            // Отступы в score-panel — доля от btn-size
            root.style.setProperty('--score-pad-v', Math.round(L.headerH * 0.12) + 'px');
            root.style.setProperty('--score-pad-h', Math.round(L.headerH * 0.22) + 'px');
            root.style.setProperty('--score-radius', Math.round(L.headerH * 0.35) + 'px');

            DRAG_LIFT = Math.round((L.isPortrait ? L.trayH : L.headerH) * 0.65);
        }

        // Надёжный ресайз: ResizeObserver + fallback на resize/orientationchange
        let layoutResizeTimeout;
        function scheduleLayout() {
            clearTimeout(layoutResizeTimeout);
            layoutResizeTimeout = setTimeout(applyLayout, 30);
        }
        if (window.ResizeObserver) {
            new ResizeObserver(scheduleLayout).observe(document.documentElement);
        } else {
            window.addEventListener('resize', scheduleLayout);
            window.addEventListener('orientationchange', scheduleLayout);
        }
        applyLayout();

        // --- SHAPES LIBRARY (weight categories) ---
        const shapesLib = [
            { matrix: [[1]], color: '#EF476F', weight: 'simple' },
            { matrix: [[1, 1]], color: '#FFD166', weight: 'simple' },
            { matrix: [[1], [1]], color: '#FFD166', weight: 'simple' },
            { matrix: [[1, 1, 1]], color: '#06D6A0', weight: 'simple' },
            { matrix: [[1], [1], [1]], color: '#06D6A0', weight: 'simple' },
            { matrix: [[1, 1, 1, 1]], color: '#06D6A0', weight: 'simple' },
            { matrix: [[1], [1], [1], [1]], color: '#06D6A0', weight: 'simple' },
            { matrix: [[1, 1], [1, 1]], color: '#118AB2', weight: 'simple' },
            { matrix: [[1, 0], [1, 1]], color: '#9D4EDD', weight: 'medium' },
            { matrix: [[0, 1], [1, 1]], color: '#9D4EDD', weight: 'medium' },
            { matrix: [[1, 1], [1, 0]], color: '#9D4EDD', weight: 'medium' },
            { matrix: [[1, 1], [0, 1]], color: '#9D4EDD', weight: 'medium' },
            { matrix: [[1, 1, 1], [0, 1, 0]], color: '#F78C6B', weight: 'medium' },
            { matrix: [[0, 1], [1, 1], [0, 1]], color: '#F78C6B', weight: 'medium' },
            { matrix: [[1, 1, 1], [1, 0, 0], [1, 0, 0]], color: '#FF9F1C', weight: 'hard' },
            { matrix: [[1, 1, 1], [0, 0, 1], [0, 0, 1]], color: '#FF9F1C', weight: 'hard' },
            { matrix: [[0, 0, 1], [0, 0, 1], [1, 1, 1]], color: '#FF9F1C', weight: 'hard' },
            { matrix: [[1, 0, 0], [1, 0, 0], [1, 1, 1]], color: '#FF9F1C', weight: 'hard' },
            { matrix: [[1, 1, 0], [0, 1, 1]], color: '#45CB85', weight: 'hard' },
            { matrix: [[0, 1, 1], [1, 1, 0]], color: '#45CB85', weight: 'hard' },
            { matrix: [[1, 1, 1], [1, 1, 1], [1, 1, 1]], color: '#118AB2', weight: 'hard' },
            { matrix: [[1, 1, 1, 1, 1]], color: '#06D6A0', weight: 'hard' },
            { matrix: [[1], [1], [1], [1], [1]], color: '#06D6A0', weight: 'hard' }
        ];

        let currentHand = [];

        function canPlaceAnywhere(matrix) {
            for (let r = 0; r <= GRID_SIZE - matrix.length; r++) {
                for (let c = 0; c <= GRID_SIZE - matrix[0].length; c++) {
                    if (canPlace(r, c, matrix)) return true;
                }
            }
            return false;
        }

        function countEmptyCells() {
            let count = 0;
            for (let r = 0; r < GRID_SIZE; r++)
                for (let c = 0; c < GRID_SIZE; c++)
                    if (grid[r][c] === 0) count++;
            return count;
        }

        function getDynamicWeights() {
            const emptyRatio = countEmptyCells() / (GRID_SIZE * GRID_SIZE);
            const comboFactor = Math.min(streak, 5);
            const scoreFactor = Math.min(score / 500, 3);
            let wSimple = 40 - comboFactor * 4 - scoreFactor * 5;
            let wMedium = 20 + comboFactor * 2 + scoreFactor * 2;
            let wHard = 10 + comboFactor * 2 + scoreFactor * 3;
            if (emptyRatio < 0.25) {
                if (score < 300) { wSimple += 20; wHard = Math.max(1, wHard - 8); }
                else { wHard += 15; wSimple = Math.max(1, wSimple - 15); }
            }
            if (emptyRatio < 0.4 && emptyRatio > 0.15) { wHard += 5; wMedium += 3; }
            return { simple: Math.max(1, wSimple), medium: Math.max(1, wMedium), hard: Math.max(1, wHard) };
        }

        function pickShapeByWeight(weights, excludeShapes) {
            const filtered = shapesLib.filter(s => !excludeShapes.includes(s));
            const simplePool = filtered.filter(s => s.weight === 'simple');
            const mediumPool = filtered.filter(s => s.weight === 'medium');
            const hardPool = filtered.filter(s => s.weight === 'hard');
            const pool = [];
            for (let i = 0; i < Math.round(weights.simple); i++) pool.push('simple');
            for (let i = 0; i < Math.round(weights.medium); i++) pool.push('medium');
            for (let i = 0; i < Math.round(weights.hard); i++) pool.push('hard');
            const chosen = pool[Math.floor(Math.random() * pool.length)];
            let candidates;
            if (chosen === 'simple') candidates = simplePool.length > 0 ? simplePool : filtered;
            else if (chosen === 'medium') candidates = mediumPool.length > 0 ? mediumPool : filtered;
            else candidates = hardPool.length > 0 ? hardPool : filtered;
            if (candidates.length === 0) candidates = filtered;
            return candidates[Math.floor(Math.random() * candidates.length)];
        }

        function generateHand() {
            handEl.innerHTML = '';
            currentHand = [];
            const weights = getDynamicWeights();
            let attempts = 0;
            while (currentHand.length < 3 && attempts < 200) {
                attempts++;
                const exclude = currentHand.filter(s => s.weight === 'hard');
                const shapeObj = pickShapeByWeight(weights, exclude);
                if (!canPlaceAnywhere(shapeObj.matrix)) continue;
                if (shapeObj.weight === 'hard' && currentHand.filter(s => s.weight === 'hard').length >= 1) {
                    if (attempts % 3 !== 0) continue;
                }
                currentHand.push(shapeObj);
                createShapeElement(shapeObj, currentHand.length - 1);
            }
            while (currentHand.length < 3) {
                const fb = shapesLib[Math.floor(Math.random() * shapesLib.length)];
                currentHand.push(fb);
                createShapeElement(fb, currentHand.length - 1);
            }
            checkGameOver();
        }

        function createShapeElement(shapeObj, index) {
            const container = document.createElement('div');
            container.className = 'shape-container';
            container.style.animationDelay = (index * 0.08) + 's';
            const cols = shapeObj.matrix[0].length;
            const rows = shapeObj.matrix.length;
            container.style.width = `calc(var(--shape-block) * ${Math.max(cols, 4)})`;
            container.style.height = `calc(var(--shape-block) * ${Math.max(rows, 4)})`;
            const shapeEl = document.createElement('div');
            shapeEl.className = 'shape';
            shapeEl.dataset.index = index;
            shapeEl.style.gridTemplateColumns = `repeat(${cols}, var(--shape-block))`;
            shapeEl.style.gridTemplateRows = `repeat(${rows}, var(--shape-block))`;
            shapeObj.matrix.forEach(row => {
                row.forEach(val => {
                    const block = document.createElement('div');
                    if (val) { block.className = 'shape-block'; block.style.background = shapeObj.color; }
                    shapeEl.appendChild(block);
                });
            });
            setupDrag(shapeEl, shapeObj, container);
            container.appendChild(shapeEl);
            // Анимация вылетания через Web Animations API — без моргания
            container.animate([
                { opacity: 0, transform: 'translateY(120px) scale(0.5)' },
                { opacity: 1, transform: 'translateY(0) scale(1)' }
            ], {
                duration: 400,
                delay: index * 80,
                easing: 'cubic-bezier(0.34, 1.56, 0.64, 1)',
                fill: 'backwards'
            });
            handEl.appendChild(container);
        }

        function setupDrag(el, shapeObj, container) {
            let isDragging = false;
            container.addEventListener('pointerdown', (e) => {
                isDragging = true;
                container.setPointerCapture(e.pointerId);
                el.classList.add('dragging');
                moveAt(e.clientX, e.clientY);
            });
            container.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                moveAt(e.clientX, e.clientY);
                clearHighlights();
                const cellInfo = getTargetCellMath(e.clientX, e.clientY, shapeObj.matrix);
                if (cellInfo) highlightGrid(cellInfo.r, cellInfo.c, shapeObj);
            });
            container.addEventListener('pointerup', (e) => {
                if (!isDragging) return;
                isDragging = false;
                container.releasePointerCapture(e.pointerId);
                el.classList.remove('dragging');
                el.style.left = 'auto'; el.style.top = 'auto';
                const cellInfo = getTargetCellMath(e.clientX, e.clientY, shapeObj.matrix);
                if (cellInfo && canPlace(cellInfo.r, cellInfo.c, shapeObj.matrix)) {
                    placeShape(cellInfo.r, cellInfo.c, shapeObj);
                    currentHand[el.dataset.index] = null;
                    container.innerHTML = '';
                    if (currentHand.every(s => s === null)) generateHand();
                    else checkGameOver();
                }
                clearHighlights();
            });
            function moveAt(pageX, pageY) {
                el.style.left = pageX + 'px';
                el.style.top = (pageY - DRAG_LIFT) + 'px';
            }
        }

        function getTargetCellMath(x, y, matrix) {
            const boardRect = boardEl.getBoundingClientRect();
            const cellW = boardRect.width / GRID_SIZE;
            const visualX = x;
            const visualY = y - DRAG_LIFT;
            if (visualX < boardRect.left - cellW || visualX > boardRect.right + cellW ||
                visualY < boardRect.top - cellW || visualY > boardRect.bottom + cellW) return null;
            const centerC = Math.floor((visualX - boardRect.left) / cellW);
            const centerR = Math.floor((visualY - boardRect.top) / cellW);
            let startR = centerR - Math.floor(matrix.length / 2);
            let startC = centerC - Math.floor(matrix[0].length / 2);
            startR = Math.max(0, Math.min(GRID_SIZE - matrix.length, startR));
            startC = Math.max(0, Math.min(GRID_SIZE - matrix[0].length, startC));
            return { r: startR, c: startC };
        }

        function canPlace(startR, startC, matrix) {
            for (let r = 0; r < matrix.length; r++) {
                for (let c = 0; c < matrix[0].length; c++) {
                    if (matrix[r][c]) {
                        let br = startR + r, bc = startC + c;
                        if (br < 0 || br >= GRID_SIZE || bc < 0 || bc >= GRID_SIZE) return false;
                        if (grid[br][bc] !== 0) return false;
                    }
                }
            }
            return true;
        }

        function highlightGrid(startR, startC, shapeObj) {
            const matrix = shapeObj.matrix;
            if (!canPlace(startR, startC, matrix)) return; // превью только на доступных местах
            for (let r = 0; r < matrix.length; r++) {
                for (let c = 0; c < matrix[0].length; c++) {
                    if (matrix[r][c]) {
                        let br = startR + r, bc = startC + c;
                        if (br >= 0 && br < GRID_SIZE && bc >= 0 && bc < GRID_SIZE) {
                            const cell = document.getElementById(`cell-${br}-${bc}`);
                            cell.classList.add('highlight-valid');
                            cell.style.setProperty('--preview-color', shapeObj.color);
                        }
                    }
                }
            }
        }

        function clearHighlights() {
            document.querySelectorAll('.cell').forEach(c => c.classList.remove('highlight-valid'));
        }

        function placeShape(startR, startC, shapeObj) {
            let blocksPlaced = 0;
            const matrix = shapeObj.matrix;
            for (let r = 0; r < matrix.length; r++) {
                for (let c = 0; c < matrix[0].length; c++) {
                    if (matrix[r][c]) {
                        grid[startR + r][startC + c] = shapeObj.color;
                        const cell = document.getElementById(`cell-${startR + r}-${startC + c}`);
                        cell.classList.add('filled');
                        cell.style.background = shapeObj.color;
                        blocksPlaced++;
                    }
                }
            }
            score += blocksPlaced;
            scoreEl.innerText = score;
            initAudio();
            playSound('place');
            checkClears();
        }

        function checkClears() {
            let rowsToClear = [], colsToClear = [];
            for (let r = 0; r < GRID_SIZE; r++) { if (grid[r].every(val => val !== 0)) rowsToClear.push(r); }
            for (let c = 0; c < GRID_SIZE; c++) {
                let colFull = true;
                for (let r = 0; r < GRID_SIZE; r++) { if (grid[r][c] === 0) { colFull = false; break; } }
                if (colFull) colsToClear.push(c);
            }
            const totalLines = rowsToClear.length + colsToClear.length;
            if (totalLines > 0) {
                initAudio();
                playSound('clear');
                streak++;
                score += (100 * totalLines) * totalLines * streak;
                scoreEl.innerText = score;
                const cellsToClear = new Set();
                rowsToClear.forEach(r => { for (let c = 0; c < GRID_SIZE; c++) { grid[r][c] = 0; cellsToClear.add(`cell-${r}-${c}`); } });
                colsToClear.forEach(c => { for (let r = 0; r < GRID_SIZE; r++) { grid[r][c] = 0; cellsToClear.add(`cell-${r}-${c}`); } });
                cellsToClear.forEach(id => { document.getElementById(id).classList.add('clearing'); });
                setTimeout(() => {
                    cellsToClear.forEach(id => {
                        const cell = document.getElementById(id);
                        cell.classList.remove('filled', 'clearing');
                        cell.style.background = '';
                    });
                }, 200);
            } else { streak = 0; }
        }

        function checkGameOver() {
            const availableShapes = currentHand.filter(s => s !== null);
            for (let shapeObj of availableShapes) {
                for (let r = 0; r < GRID_SIZE; r++) {
                    for (let c = 0; c < GRID_SIZE; c++) {
                        if (canPlace(r, c, shapeObj.matrix)) return;
                    }
                }
            }
            if (availableShapes.length > 0) {
                setTimeout(() => {
                    document.getElementById('finalScore').innerText = score;
                    document.getElementById('gameOverModal').style.display = 'flex';
                }, 300);
            }
        }

        generateHand();
    </script>
</body>
