<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Arrows - Brain Games</title>
    <!-- Підключення confetti для салюту -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;800&display=swap');

        :root {
            /* Світла тема */
            --bg-color: #F8F9FA;
            --text-main: #1C2331;
            --text-sub: #7A8294;
            --board-bg: #E9ECEF;
            --panel-bg: #FFFFFF;
            --shadow-color: rgba(0, 0, 0, 0.05);
            
            /* Палітра блоків (Brain Games) */
            --color-1: #EF476F;
            --color-2: #FFD166;
            --color-3: #06D6A0;
            --color-4: #118AB2;
            --color-5: #9D4EDD;
            --color-6: #F78C6B;
            --color-7: #4ECDC4;
            
            /* Тінь блоків */
            --block-shadow: rgba(0, 0, 0, 0.15);
        }

        [data-theme="dark"] {
            /* Темна тема */
            --bg-color: #121212;
            --text-main: #FFFFFF;
            --text-sub: #A0AABF;
            --board-bg: #1E1E1E;
            --panel-bg: #2C2C2C;
            --shadow-color: rgba(0, 0, 0, 0.2);
            
            /* Приглушені кольори блоків для темної теми */
            --color-1: #D63D60;
            --color-2: #E6BC5C;
            --color-3: #05BC8C;
            --color-4: #0F7A9E;
            --color-5: #8C45C6;
            --color-6: #DE7E60;
            --color-7: #45B8B0;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        html, body {
            width: 100%;
            height: 100%;
        }

        body {
            font-family: 'Nunito', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-main);
            overflow: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        /* Корневой контейнер — все размеры ставит JS (calcLayout) */
        .app-container {
            position: fixed;
            inset: 0;
            padding-top: calc(var(--margin) + env(safe-area-inset-top, 0px));
            padding-bottom: calc(var(--margin) + env(safe-area-inset-bottom, 0px));
            padding-left: calc(var(--margin) + env(safe-area-inset-left, 0px));
            padding-right: calc(var(--margin) + env(safe-area-inset-right, 0px));
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: var(--gap);
        }

        /* Верхняя панель */
        .header {
            width: 100%;
            max-width: calc(var(--board-size) + 2px);
            height: var(--header-h);
            flex: 0 0 auto;
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            position: relative;
        }

        /* Кнопка назад */
        .back-btn {
            width: var(--btn-size);
            height: var(--btn-size);
            min-width: var(--btn-size);
            border-radius: 50%;
            background-color: var(--panel-bg);
            box-shadow: 0 4px 12px var(--shadow-color);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            border: none;
            outline: none;
            color: var(--text-main);
            transition: transform 0.1s, background-color 0.3s;
            -webkit-tap-highlight-color: transparent;
        }

        .back-btn:active { transform: scale(0.9); }
        .back-btn svg { width: var(--icon-size); height: var(--icon-size); }

        /* Название игры по центру (абсолютное позиционирование) */
        .header-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            max-width: calc(100% - var(--btn-size) * 2 - 80px);
            font-size: var(--title-size);
            font-weight: 800;
            letter-spacing: 1px;
            line-height: 1;
            color: var(--text-main);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            pointer-events: none;
        }

        /* Правая группа: уровень + тема */
        .header-right {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .theme-toggle {
            width: var(--btn-size);
            height: var(--btn-size);
            min-width: var(--btn-size);
            border-radius: 50%;
            background-color: var(--panel-bg);
            border: none;
            box-shadow: 0 4px 12px var(--shadow-color);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.2s, background-color 0.3s;
            -webkit-tap-highlight-color: transparent;
        }

        .theme-toggle:active { transform: scale(0.9); }
        .theme-toggle svg { width: var(--icon-size); height: var(--icon-size); color: var(--text-main); }

        .level-panel {
            background-color: var(--panel-bg);
            padding: 0.4em 0.8em;
            border-radius: 1.5em;
            box-shadow: 0 4px 12px var(--shadow-color);
            display: flex;
            align-items: center;
            gap: 0.3em;
            font-weight: 800;
            font-size: var(--score-size);
            white-space: nowrap;
            transition: background-color 0.3s;
        }

        .level-panel span { color: var(--text-main); }

        /* Игровое поле */
        .board-wrapper {
            width: var(--board-size);
            height: var(--board-size);
            flex: 0 0 auto;
            margin: auto 0;
            background-color: var(--board-bg);
            border-radius: 4%;
            padding: 2%;
            box-shadow: inset 0 4px 10px rgba(0,0,0,0.05);
            position: relative;
            overflow: visible;
            transition: background-color 0.3s;
        }

        .board {
            width: 100%;
            height: 100%;
            position: relative;
        }

        /* Блоки зі стрілочками */
        .block-container {
            position: absolute;
            transition: top 0.3s cubic-bezier(0.4, 0.0, 0.2, 1), 
                        left 0.3s cubic-bezier(0.4, 0.0, 0.2, 1), 
                        transform 0.4s cubic-bezier(0.5, 0, 0.2, 1), 
                        opacity 0.3s;
            padding: 2%; /* Відступ між блоками */
        }

        .block {
            width: 100%;
            height: 100%;
            border-radius: 20px;
            box-shadow: 0 6px 0 var(--block-shadow);
            display: flex;
            justify-content: center;
            align-items: center;
            cursor: pointer;
            transition: transform 0.1s;
            position: relative;
        }

        .block:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--block-shadow);
        }

        .block svg {
            width: 60%;
            height: 60%;
            fill: var(--block-shadow); /* Іконка кольору тіні */
            pointer-events: none;
        }

        /* Повороти стрілочок */
        .dir-UP svg { transform: rotate(0deg); }
        .dir-RIGHT svg { transform: rotate(90deg); }
        .dir-DOWN svg { transform: rotate(180deg); }
        .dir-LEFT svg { transform: rotate(-90deg); }

        /* Анімації вильоту */
        .fly-UP { transform: translateY(-1000px); opacity: 0; }
        .fly-DOWN { transform: translateY(1000px); opacity: 0; }
        .fly-LEFT { transform: translateX(-1000px); opacity: 0; }
        .fly-RIGHT { transform: translateX(1000px); opacity: 0; }

        /* Анімації удару (коли шлях заблоковано) */
        @keyframes bump-UP { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-10px); } }
        @keyframes bump-DOWN { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(10px); } }
        @keyframes bump-LEFT { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(-10px); } }
        @keyframes bump-RIGHT { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(10px); } }

        .bump-UP .block { animation: bump-UP 0.2s ease-in-out; }
        .bump-DOWN .block { animation: bump-DOWN 0.2s ease-in-out; }
        .bump-LEFT .block { animation: bump-LEFT 0.2s ease-in-out; }
        .bump-RIGHT .block { animation: bump-RIGHT 0.2s ease-in-out; }

        /* Модальне вікно (Overlay) */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.4);
            backdrop-filter: blur(5px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
        }

        .overlay.active {
            opacity: 1;
            pointer-events: all;
        }

        .modal {
            background-color: var(--panel-bg);
            padding: var(--modal-padding);
            border-radius: var(--modal-radius);
            text-align: center;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            transform: translateY(50px);
            transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            max-width: 90vw;
        }

        .overlay.active .modal {
            transform: translateY(0);
        }

        .modal h2 {
            font-size: var(--modal-title-size);
            margin-bottom: 0.3em;
            color: var(--text-main);
        }

        .modal p {
            color: var(--text-sub);
            font-size: var(--modal-text-size);
            margin-bottom: 0.8em;
        }

        .btn-next {
            background-color: var(--color-3);
            color: white;
            border: none;
            padding: 0.8em 2em;
            font-size: var(--modal-btn-size);
            font-weight: bold;
            border-radius: 0.8em;
            cursor: pointer;
            box-shadow: 0 6px 0 rgba(0,0,0,0.15);
            transition: transform 0.1s, box-shadow 0.1s;
        }

        .btn-next:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 rgba(0,0,0,0.15);
        }
    </style>
</head>
<body>

<div class="app-container">
    <!-- Top bar -->
    <div class="header">
        <button class="back-btn" id="backBtn" onclick="goBack()" title="Back">
            <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"></polyline></svg>
        </button>
        <span class="header-title">Arrows</span>
        <div class="header-right">
            <!--div class="level-panel">
                ⭐ <span id="level-indicator">Level 1</span>
            </div-->
            <button class="theme-toggle" id="theme-btn" title="Change theme">
                <svg id="icon-sun" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display: none;"><circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line></svg>
                <svg id="icon-moon" xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
            </button>
        </div>
    </div>

    <div class="board-wrapper">
        <div class="board" id="board"></div>
    </div>
</div>

<div class="overlay" id="win-overlay">
    <div class="modal">
        <h2>Level Complete!</h2>
        <p>Your spatial thinking is impressive! 🧠</p>
        <button class="btn-next" onclick="nextLevel()">Next Level</button>
    </div>
</div>

<script>
    // ================================================================
    // АДАПТИВНАЯ ВЁРСТКА (как в block_blast)
    // ================================================================

    const LAYOUT_CFG = {
        portrait: {
            marginRatio: 0.025,
            gapRatio: 0.018,
            headerRatio: 0.075,
            headerMinRatio: 0.05, headerMaxRatio: 0.10,
        },
        landscape: {
            marginRatio: 0.035,
            gapRatio: 0.03,
            headerRatio: 0.12,
            headerMinRatio: 0.06, headerMaxRatio: 0.14,
        }
    };

    function clamp(v, min, max) { return Math.max(min, Math.min(max, v)); }

    let safeInsetsCache = { top: 0, bottom: 0, left: 0, right: 0 };
    (function measureSafeInsets() {
        const probe = document.createElement('div');
        probe.style.cssText = 'position:fixed;top:0;left:0;width:0;height:0;' +
            'padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);' +
            'padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px);' +
            'visibility:hidden;';
        document.body.appendChild(probe);
        const cs = getComputedStyle(probe);
        safeInsetsCache = {
            top: parseFloat(cs.paddingTop) || 0,
            bottom: parseFloat(cs.paddingBottom) || 0,
            left: parseFloat(cs.paddingLeft) || 0,
            right: parseFloat(cs.paddingRight) || 0
        };
        probe.remove();
    })();

    function calcLayout() {
        const insets = safeInsetsCache;
        const availW = window.innerWidth - insets.left - insets.right;
        const availH = window.innerHeight - insets.top - insets.bottom;
        const isPortrait = availH >= availW;
        const cfg = isPortrait ? LAYOUT_CFG.portrait : LAYOUT_CFG.landscape;

        const margin = Math.round(availH * cfg.marginRatio);
        const gap = Math.round(availH * cfg.gapRatio);
        const headerH = Math.round(clamp(availH * cfg.headerRatio, availH * cfg.headerMinRatio, availH * cfg.headerMaxRatio));

        const usableH = availH - margin * 2 - headerH - gap;
        const usableW = availW - margin * 2;
        const boardSize = Math.max(180, Math.floor(Math.min(usableH, usableW)));

        return { margin, gap, headerH, boardSize };
    }

    function applyLayout() {
        const L = calcLayout();
        const root = document.documentElement;

        root.style.setProperty('--margin', L.margin + 'px');
        root.style.setProperty('--gap', L.gap + 'px');
        root.style.setProperty('--header-h', L.headerH + 'px');
        root.style.setProperty('--board-size', L.boardSize + 'px');

        // Кнопки/иконки/шрифты — доля от высоты хедера
        root.style.setProperty('--btn-size', Math.round(L.headerH * 0.68) + 'px');
        root.style.setProperty('--icon-size', Math.round(L.headerH * 0.36) + 'px');
        root.style.setProperty('--title-size', Math.round(L.headerH * 0.34) + 'px');
        root.style.setProperty('--score-size', Math.round(L.headerH * 0.28) + 'px');

        // Модальное окно — доля от размера доски
        root.style.setProperty('--modal-padding', Math.round(L.boardSize * 0.08) + 'px');
        root.style.setProperty('--modal-radius', Math.round(L.boardSize * 0.04) + 'px');
        root.style.setProperty('--modal-title-size', Math.round(L.boardSize * 0.07) + 'px');
        root.style.setProperty('--modal-text-size', Math.round(L.boardSize * 0.04) + 'px');
        root.style.setProperty('--modal-btn-size', Math.round(L.boardSize * 0.045) + 'px');
    }

    applyLayout();

    // Надёжный ресайз: ResizeObserver + fallback на resize/orientationchange
    let layoutResizeTimeout;
    function scheduleLayout() {
        clearTimeout(layoutResizeTimeout);
        layoutResizeTimeout = setTimeout(applyLayout, 30);
    }
    if (window.ResizeObserver) {
        new ResizeObserver(scheduleLayout).observe(document.documentElement);
    } else {
        window.addEventListener('resize', scheduleLayout);
        window.addEventListener('orientationchange', scheduleLayout);
    }

    // --- АУДІО ДВИЖОК (Web Audio API) ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx;

    function initAudio() {
        if (!audioCtx) {
            audioCtx = new AudioContext();
        }
        if (audioCtx.state === 'suspended') {
            audioCtx.resume();
        }
    }

    function playSound(type) {
        if (!audioCtx) return;
        const t = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();

        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (type === 'fly') {
            // Швидкий свайп/вжик для вилітаючого блоку
            osc.type = 'sine';
            osc.frequency.setValueAtTime(400, t);
            osc.frequency.exponentialRampToValueAtTime(800, t + 0.1);
            gain.gain.setValueAtTime(0, t);
            gain.gain.linearRampToValueAtTime(0.3, t + 0.05);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.2);
            osc.start(t);
            osc.stop(t + 0.2);
        } else if (type === 'bump') {
            // Глухий звук удару
            osc.type = 'triangle';
            osc.frequency.setValueAtTime(150, t);
            osc.frequency.exponentialRampToValueAtTime(50, t + 0.1);
            gain.gain.setValueAtTime(0.4, t);
            gain.gain.exponentialRampToValueAtTime(0.01, t + 0.1);
            osc.start(t);
            osc.stop(t + 0.1);
        } else if (type === 'win') {
            // Радісний акорд перемоги
            const chord = [523.25, 659.25, 783.99, 1046.50]; // C E G C
            chord.forEach((freq, i) => {
                const o = audioCtx.createOscillator();
                const g = audioCtx.createGain();
                o.connect(g);
                g.connect(audioCtx.destination);
                o.type = 'sine';
                o.frequency.value = freq;
                g.gain.setValueAtTime(0, t + i * 0.1);
                g.gain.linearRampToValueAtTime(0.2, t + i * 0.1 + 0.05);
                g.gain.exponentialRampToValueAtTime(0.01, t + i * 0.1 + 0.5);
                o.start(t + i * 0.1);
                o.stop(t + i * 0.1 + 0.5);
            });
        }
    }

    // --- КНОПКА НАЗАД ---
    function goBack() {
        if (typeof unityInstance !== 'undefined' && unityInstance) {
            unityInstance.SendMessage('WebViewBridge', 'OnBackPressed');
        }
        if (window.history.length > 1) {
            window.history.back();
        }
    }

    // --- ЛОГІКА ТЕМ (Світла/Темна) ---
    const themeBtn = document.getElementById('theme-btn');
    const iconSun = document.getElementById('icon-sun');
    const iconMoon = document.getElementById('icon-moon');
    
    let isDark = localStorage.getItem('brain_theme') === 'dark';
    
    function updateTheme() {
        if (isDark) {
            document.documentElement.setAttribute('data-theme', 'dark');
            iconSun.style.display = 'block';
            iconMoon.style.display = 'none';
        } else {
            document.documentElement.setAttribute('data-theme', 'light');
            iconSun.style.display = 'none';
            iconMoon.style.display = 'block';
        }
    }
    
    themeBtn.addEventListener('click', () => {
        initAudio(); // Ініціалізація аудіо по першому кліку
        isDark = !isDark;
        localStorage.setItem('brain_theme', isDark ? 'dark' : 'light');
        updateTheme();
    });
    updateTheme();

    // --- ЛОГІКА ГРИ "СТРІЛОЧКИ" ---
    const boardEl = document.getElementById('board');
    //const levelText = document.getElementById('level-indicator');
    const winOverlay = document.getElementById('win-overlay');

    let currentLevel = 1;
    let gridSize = 3;
    let logicalGrid = []; // 2D масив для перевірок [row][col]
    let activeBlocksCount = 0;
    let hasWon = false;
    
    const DIRS = ['UP', 'RIGHT', 'DOWN', 'LEFT'];
    const COLORS = ['var(--color-1)', 'var(--color-2)', 'var(--color-3)', 'var(--color-4)', 'var(--color-5)', 'var(--color-6)', 'var(--color-7)'];

    // Вектори напрямків
    const vec = {
        'UP': {r: -1, c: 0},
        'DOWN': {r: 1, c: 0},
        'LEFT': {r: 0, c: -1},
        'RIGHT': {r: 0, c: 1}
    };

    // SVG стрілки (товста, красива)
    const arrowSVG = `
        <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2L3 11h5v11h8V11h5L12 2z" stroke-linejoin="round"/>
        </svg>
    `;

    // Запуск гри
    function initGame() {
        winOverlay.classList.remove('active');
        hasWon = false;
        //levelText.innerText = `Level ${currentLevel}`;
        boardEl.innerHTML = '';
        activeBlocksCount = 0;

        // Прогресія складності
        gridSize = Math.min(8, 2 + Math.floor(currentLevel / 3));
        // Завжди генеруємо повне поле на 100%
        let numBlocks = gridSize * gridSize;

        generateSolvableLevel(gridSize, numBlocks);
    }

    // Перевірка чи шлях вільний у сітці
    function isPathClear(grid, r, c, dir, size) {
        let currR = r + vec[dir].r;
        let currC = c + vec[dir].c;
        
        while (currR >= 0 && currR < size && currC >= 0 && currC < size) {
            if (grid[currR][currC] !== null) return false; // Заблоковано!
            currR += vec[dir].r;
            currC += vec[dir].c;
        }
        return true; // Шлях чистий аж до краю
    }

    // Зворотна генерація (гарантує 100% можливість проходження)
    function generateSolvableLevel(size, targetCount) {
        let attempts = 0;
        let maxAttempts = 1000;

        while (attempts < maxAttempts) {
            attempts++;
            // Створюємо порожню сітку
            logicalGrid = Array(size).fill(null).map(() => Array(size).fill(null));
            let placedBlocks = [];
            let stuck = false;

            while (placedBlocks.length < targetCount) {
                let candidates = [];

                // Шукаємо всі пусті клітинки, які зараз мають чистий шлях назовні
                for (let r = 0; r < size; r++) {
                    for (let c = 0; c < size; c++) {
                        if (logicalGrid[r][c] === null) {
                            let validDirs = [];
                            for (let dir of DIRS) {
                                if (isPathClear(logicalGrid, r, c, dir, size)) {
                                    validDirs.push(dir);
                                }
                            }
                            if (validDirs.length > 0) {
                                candidates.push({ r, c, dirs: validDirs });
                            }
                        }
                    }
                }

                // Якщо нікуди ставити (затиснули себе), глухий кут
                if (candidates.length === 0) {
                    stuck = true;
                    break;
                }

                // ЕВРИСТИКА: пріоритет клітинкам з найменшою кількістю доступних напрямків.
                // Це не дає генератору заблокувати центр поля і гарантує 100% заповнення.
                let minDirs = Math.min(...candidates.map(c => c.dirs.length));
                let bestCandidates = candidates.filter(c => c.dirs.length === minDirs);

                // Обираємо випадкову клітинку серед "найбільш затиснутих" і напрямок
                let cand = bestCandidates[Math.floor(Math.random() * bestCandidates.length)];
                let dir = cand.dirs[Math.floor(Math.random() * cand.dirs.length)];
                let color = COLORS[Math.floor(Math.random() * COLORS.length)];

                let blockData = { r: cand.r, c: cand.c, dir: dir, color: color, id: placedBlocks.length };
                logicalGrid[cand.r][cand.c] = blockData;
                placedBlocks.push(blockData);
            }

            // Якщо ми успішно заповнили поле на 100% без глухих кутів
            if (!stuck && placedBlocks.length === targetCount) {
                activeBlocksCount = placedBlocks.length;
                renderBlocks(placedBlocks, size);
                return; // Успіх!
            }
        }
        
        console.error("Не вдалося згенерувати 100% поле, зменшуємо ціль");
        // Резервний варіант, якщо 100% випадково не згенерувалося
        generateSolvableLevel(size, targetCount - 1);
    }

    function renderBlocks(blocks, size) {
        const cellSize = 100 / size; // Відсоток ширини/висоти

        blocks.forEach(b => {
            const wrapper = document.createElement('div');
            wrapper.className = `block-container dir-${b.dir}`;
            wrapper.style.width = `${cellSize}%`;
            wrapper.style.height = `${cellSize}%`;
            wrapper.style.left = `${b.c * cellSize}%`;
            wrapper.style.top = `${b.r * cellSize}%`;
            
            const block = document.createElement('div');
            block.className = 'block';
            block.style.backgroundColor = b.color;
            block.innerHTML = arrowSVG;

            // Зберігаємо координати в DOM для кліків
            wrapper.dataset.r = b.r;
            wrapper.dataset.c = b.c;
            wrapper.dataset.dir = b.dir;

            wrapper.appendChild(block);
            boardEl.appendChild(wrapper);

            // Обробник кліку (або тапу)
            wrapper.addEventListener('pointerdown', () => handleBlockClick(wrapper));
        });
    }

    function handleBlockClick(wrapper) {
        initAudio(); // Страховка для iOS
        if (wrapper.classList.contains('flying')) return; // Вже летить

        const r = parseInt(wrapper.dataset.r);
        const c = parseInt(wrapper.dataset.c);
        const dir = wrapper.dataset.dir;

        if (isPathClear(logicalGrid, r, c, dir, gridSize)) {
            // Шлях вільний!
            playSound('fly');
            
            // Звільняємо місце в логічній сітці миттєво
            logicalGrid[r][c] = null;
            wrapper.classList.add('flying');
            wrapper.classList.add(`fly-${dir}`);
            
            activeBlocksCount--;

            // Видаляємо з DOM після анімації
            setTimeout(() => {
                wrapper.remove();
                if (activeBlocksCount === 0) {
                    triggerWin();
                }
            }, 400);

        } else {
            // Шлях заблоковано!
            playSound('bump');
            
            // Запускаємо анімацію удару (wiggle)
            wrapper.classList.remove(`bump-UP`, `bump-DOWN`, `bump-LEFT`, `bump-RIGHT`);
            // Невеликий хак, щоб перезапустити CSS анімацію
            void wrapper.offsetWidth; 
            wrapper.classList.add(`bump-${dir}`);
            
            setTimeout(() => {
                wrapper.classList.remove(`bump-${dir}`);
            }, 200);
        }
    }

    function triggerWin() {
        if (hasWon) return;
        hasWon = true;
        playSound('win');
        
        // Фирменный салют — масштабируется под размер доски
        const boardSz = parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--board-size')) || 400;
        const colors = ['#EF476F', '#FFD166', '#06D6A0', '#118AB2'];
        confetti({
            particleCount: Math.round(boardSz * 0.35),
            spread: Math.round(boardSz * 0.18),
            origin: { y: 0.6 },
            colors: colors
        });

        // Показуємо модальне вікно
        setTimeout(() => {
            winOverlay.classList.add('active');
        }, 500);
    }

    function nextLevel() {
        currentLevel++;
        initGame();
    }

    // Запуск першого рівня при завантаженні
    initGame();

</script>
